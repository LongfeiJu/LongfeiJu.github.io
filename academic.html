<script src="site.js?v=5e02573d"></script>
<script>
(function () {
  var T = site.T, esc = site.esc, items = [];
  function wordsOf(body) { return (body || '').trim().split(/\s+/).filter(Boolean).length; }
  function fmt(n) { return n.toLocaleString('en-US'); }

  function check() {
    var zh = site.lang() === 'zh', vis = items.filter(function (x) { return !zh || x.show_in_chinese; }).length;
    document.getElementById('empty').hidden = vis > 0;
  }
  site.onLang(check);
  site.load('content/academic.json').then(function (d) {
    var el = document.getElementById('intro'); if (site.has(d.intro)) el.outerHTML = T(d.intro, 'p', 'id="intro"');
    items = (d.items || []).filter(function (x) { return x && site.has(x.title); });
    document.getElementById('items').innerHTML = items.map(function (x, i) {
      var n = wordsOf(x.body), mins = Math.max(1, Math.round(n / 230));
      var href = x.body ? 'essay.html?e=' + encodeURIComponent(x.slug || String(i)) : '';
      var meta = (x.year ? '<span>' + esc(x.year) + '</span>' : '') + (n ? '<span>' + fmt(n) + ' <span data-zh="词">words</span></span><span>' + mins + ' <span data-zh="分钟阅读">min read</span></span>' : '');
      var inner = '<div class="toc-body">' + T(x.title, 'h2') + (site.has(x.summary) ? T(x.summary, 'p') : '') + '</div>'
        + (href ? '<span class="toc-arrow" aria-hidden="true">→</span>' : '');
      return '<li class="' + (x.show_in_chinese ? '' : 'en-only') + '">' + (href ? '<a class="toc-item" href="' + href + '">' + inner + '</a>' : '<div class="toc-item">' + inner + '</div>') + '</li>';
    }).join('');
    site.scan(); check();
  }).catch(function () { document.getElementById('empty').hidden = false; site.scan(); });
})();
</script>
