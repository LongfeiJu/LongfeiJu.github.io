CH.push({n:3,color:'#7a3e9d',title:'Adjusting the Accounts',
hook:'Why the trial balance is "almost right" — and the entries that make revenue and expenses land in the right month.',
los:['Explain the time-period assumption, accrual versus cash basis, and how revenue recognition and matching drive adjustments.','Identify the types of adjusting entries and why each is needed.','Prepare adjusting entries for prepaid expenses under the asset and expense methods.','Prepare adjusting entries for unearned revenues under the liability and revenue methods.','Prepare adjusting entries for accruals and estimates (depreciation, bad debts, inventory).','Prepare an adjusted trial balance and financial statements from it.'],
why:`<p>Transactions are recorded when something <i>happens</i> — a payment, a bill, a sale. But some things happen quietly, day by day: insurance gets used up, salaries build up, equipment wears out, interest grows. Nobody sends a receipt for those. At the end of the period the trial balance is therefore "almost right" but not quite.</p><p><b>Adjusting entries</b> fix that, so revenues land in the month they are earned and expenses in the month they help earn revenue. Your quizzes test them constantly (prepaid rent, unearned subscriptions, supplies used), and they reappear in every later chapter — bad debts (Ch. 6), depreciation (Ch. 8), and cash-flow conversions (Ch. 9).</p>`,
terms:{
'Accrual basis of accounting':'Revenue recorded when earned and expenses when incurred, whether or not cash has changed hands. Required by GAAP.',
'Cash basis of accounting':'Revenue recorded only when cash is received and expenses only when cash is paid. Not GAAP.',
'Adjusting entries':'Entries made at the end of a period to bring assets, liabilities, revenues and expenses up to date.',
'Prepaid expense':'An expense paid in advance and recorded as an asset until it is used up (e.g. prepaid rent, insurance, supplies).',
'Unearned revenue':'Cash received before the service or goods are delivered; a liability until earned (also called deferred revenue or pre-collection).',
'Asset method':'Recording a prepayment first as an asset; the adjustment moves the used-up part to expense.',
'Expense method':'Recording a prepayment first as an expense; the adjustment moves the unused part to an asset.',
'Liability method':'Recording an advance collection first as Unearned Revenue; the adjustment moves the earned part to revenue.',
'Revenue method':'Recording an advance collection first as revenue; the adjustment moves the unearned part to a liability.',
'Accrued revenue':'Revenue earned but not yet received in cash or recorded (e.g. interest receivable).',
'Accrued expense':'An expense incurred but not yet paid or recorded (e.g. salaries payable).',
'Depreciation':'Allocating the cost of a long-lived tangible asset (except land) to expense over its useful life.',
'Accumulated depreciation':'A contra-asset account holding all depreciation recorded so far; deducted from the asset\'s cost.',
'Contra account':'An account that is deducted from a related account (e.g. Accumulated Depreciation from Equipment).',
'Book value':'Cost minus accumulated depreciation (also net book value or carrying amount).',
'Salvage value':'The estimated scrap or residual value of an asset at the end of its useful life.',
'Allowance method':'Estimating bad debts at period-end and recording them through an Allowance for Doubtful Accounts. Required by GAAP.',
'Direct write-off method':'Recording bad-debt expense only when a specific account is found to be worthless; used for tax (BIR) purposes but not GAAP.',
'Income Summary':'A temporary account used to adjust inventory and to close revenues and expenses.',
'Adjusted trial balance':'A trial balance prepared after adjusting entries are posted; the statements are prepared from it.'},
lessons:[
{t:'Time periods, accrual accounting and the two principles',lo:1,h:`
${kt('Accrual basis of accounting','Cash basis of accounting')}
<p class="lead">The time-period (periodicity) assumption chops a business's life into months, quarters or years. Periods shorter than a year are <b>interim periods</b>; a one-year accounting period is usually a <b>fiscal year</b> (<a class="xl" href="#c1-3">Lesson 1.3</a>).</p>
<p>Because we report every period, we must decide <i>which</i> period each revenue and expense belongs to. There are two ways:</p>
${tbl(['','Accrual basis','Cash basis'],[['Revenue recorded when…','<b>earned</b> (not only when cash is received)','cash is received'],['Expense recorded when…','goods/services are <b>used</b> to earn revenue (not only when paid)','cash is paid'],['Follows GAAP?','<b>Yes</b>','No']],{cls:'stack'})}
<div class="ex" data-t="Same month, two answers"><p>A clinic does ₱20,000 of work in December, collects in January, and pays December's ₱3,000 electricity bill in January. <b>Accrual:</b> December revenue ₱20,000, expense ₱3,000. <b>Cash:</b> December shows nothing; January shows both. Accrual tells you how December really went.</p></div>
<h2>The two principles behind adjustments</h2>
<p><b>Revenue recognition</b> — record revenue in the period it is earned. In a service business that's when the service is performed; in a merchandising business, usually when goods are delivered.</p>
<p><b>Matching</b> — "efforts (expenses) are matched with accomplishments (revenues)." Expenses incurred to earn this month's revenue are reported this month.</p>
<div class="tip"><p>The slides' slogan: <b>adjusting entries make the revenue recognition and matching principles HAPPEN.</b> A quiz asked which two principles adjusting entries serve — matching and revenue recognition.</p></div>`},
{t:'Why adjust — and the six types of adjustment',lo:2,h:`
${kt('Adjusting entries')}
<p class="lead">Adjusting entries bring assets, liabilities, revenues and expenses <b>up to date</b> at the end of the period. They are needed <b>every time financial statements are prepared</b>.</p>
<p>The starting point is the unadjusted trial balance. Pioneer Advertising's October trial balance (from <a class="xl" href="#c2-5">Lesson 2.5</a>) totals $28,700 — but some balances are stale: part of the supplies has been used, part of the insurance has expired, the equipment has worn a little, and staff have worked days that haven't been paid yet.</p>
<h2>The types of adjusting entries (per your slides)</h2>
${tbl(['Type','What it fixes','Example'],[['1. Prepayments (prepaid expenses)','Paid in advance, partly used up','Rent, insurance, supplies'],['2. Pre-collections (unearned revenues)','Collected in advance, partly earned','Subscriptions, advance rent received'],['3. Accruals','Earned or incurred but not yet recorded','Interest receivable, salaries payable'],['4. Estimates','Costs that must be estimated','Depreciation, amortisation, bad debts'],['5. Ending inventory','Merchandisers/manufacturers using periodic inventory','Setting up the counted ending inventory'],['6. Bank reconciliation items','Bank items not yet in the books','Service charges, interest earned']],{cls:'stack'})}
<div class="tip"><p>Every adjusting entry has <b>one income-statement account and one balance-sheet account</b>. And <b>Cash is never in an adjusting entry</b> (the bank-reconciliation items are the exception your slides list, because the bank has already moved the cash).</p></div>
<p>The rest of this chapter takes each type in turn, then rebuilds Pioneer's statements in <a class="xl" href="#c3-7">Lesson 3.7</a>.</p>`},
{t:'Prepaid expenses: asset and expense methods',lo:3,h:`
${kt('Prepaid expense','Asset method','Expense method')}
<p class="lead">A <b>prepaid expense</b> is paid in cash before it is used — like buying a 12-month gym membership. As time passes, part of it "expires" and becomes an expense.</p>
<p>Before adjustment, <b>assets are overstated and expenses understated</b>. The usual adjustment debits an expense and credits the asset. But there are two ways to record the original payment, and the adjustment depends on which one was used:</p>
${tbl(['','Asset (balance-sheet) method','Expense (income-statement) method'],[['Initial entry','Dr Prepaid asset / Cr Cash','Dr Expense / Cr Cash'],['At period-end the problem is…','Asset overstated','Expense overstated'],['Adjusting entry records…','The <b>expired</b> (used) part as expense: Dr Expense / Cr Prepaid','The <b>unexpired</b> (unused) part as asset: Dr Prepaid / Cr Expense']],{cls:'stack'})}
<div class="tip"><p>Short way to remember: under the <b>asset</b> method you adjust for what's <b>used</b>; under the <b>expense</b> method you adjust for what's <b>left</b>. A quiz asked "the type of prepayment where the adjustment is the unexpired portion" — the <b>expense method</b>.</p></div>
<div class="ex" data-t="Miguel Enterprise prepaid rent"><p>On September 1, 2016, Miguel Enterprise paid ₱12,000 rent for one year. Year-end is December 31.</p>
<p><b>Step 1 — Count the months used by Dec 31:</b> September, October, November, December = 4 months. Months remaining: 8.</p>
${calc([['Expired (used): 12,000 × 4/12',4000],['Unexpired (left): 12,000 × 8/12',8000]])}
<p><b>Asset method</b></p>${je([['Sep 1','Prepaid Rent',12000,''],['','Cash','',12000],['Dec 31','Rent Expense',4000,''],['','Prepaid Rent','',4000],['To record 4 months\' rent used.']])}
<p><b>Expense method</b></p>${je([['Sep 1','Rent Expense',12000,''],['','Cash','',12000],['Dec 31','Prepaid Rent',8000,''],['','Rent Expense','',8000],['To set up 8 months\' unused rent.']])}
<p><b>Either way the result is the same:</b> Prepaid Rent ₱8,000 on the balance sheet, Rent Expense ₱4,000 on the income statement.</p></div>
<div class="fix"><p>The slide's working table has two typing errors: it says "Required Prepaid <i>Insurance</i> (12k × 10/12) P10,000" and, for the expense method, "Unexpired portion 10,000 → required Rent Expense P2,000." The journal entries on the same slide (4,000 and 8,000) are correct; the required balances are <b>Prepaid Rent ₱8,000</b> (12,000 × 8/12) and <b>Rent Expense ₱4,000</b>.</p></div>
<div class="ex" data-t="Supplies and insurance (Pioneer and Quiz 1)"><p><b>Supplies</b> work the same way, but you count what's left. Quiz 1: beginning supplies ₱1,600 + purchases ₱2,900 = ₱4,500 available; ₱2,100 on hand at month-end, so <b>supplies expense = ₱2,400</b>. Pioneer: supplies of $2,500 fall to $1,000 on hand, so $1,500 is expensed.</p>
${je([['Oct 31','Advertising Supplies Expense',1500,''],['','Advertising Supplies','',1500],['Oct 31','Insurance Expense',50,''],['','Prepaid Insurance','',50]])}
<p><b>Prepaid rent (pre-midterm):</b> ₱60,000 at the start of the year falls to ₱45,000 after a quarter — ₱15,000 over 3 months, so the monthly adjustment is <b>₱5,000</b>.</p></div>`},
{t:'Unearned revenues: liability and revenue methods',lo:4,h:`
${kt('Unearned revenue','Liability method','Revenue method')}
<p class="lead">An <b>unearned revenue</b> (pre-collection, deferred revenue) is cash received before you deliver — like a magazine selling a one-year subscription. Until you deliver, you <i>owe</i> the customer, so it's a liability.</p>
<p>Before adjustment, <b>liabilities are overstated and revenues understated</b>. Examples: rent received in advance, subscriptions, airline tickets, tuition. Again, two recording methods:</p>
${tbl(['','Liability (balance-sheet) method','Revenue (income-statement) method'],[['Initial entry','Dr Cash / Cr Unearned Revenue','Dr Cash / Cr Revenue'],['At period-end the problem is…','Liability overstated','Revenue overstated'],['Adjusting entry records…','The <b>earned</b> part: Dr Unearned / Cr Revenue','The <b>unearned</b> part: Dr Revenue / Cr Unearned']],{cls:'stack'})}
<div class="ex" data-t="Advance rent at a pension house"><p>On October 1, 2016, Lebron James Pension House received ₱60,000 rent in advance for one year. By December 31, 3 months (Oct, Nov, Dec) are earned; 9 remain.</p>
${calc([['Earned: 60,000 × 3/12',15000],['Unearned: 60,000 × 9/12',45000]])}
<p><b>Liability method</b></p>${je([['Oct 1','Cash',60000,''],['','Unearned Rent','',60000],['Dec 31','Unearned Rent',15000,''],['','Rent Income','',15000],['To record 3 months earned.']])}
<p><b>Revenue method</b></p>${je([['Oct 1','Cash',60000,''],['','Rent Income','',60000],['Dec 31','Rent Income',45000,''],['','Unearned Rent','',45000],['To defer 9 months not yet earned.']])}
<p>Both end with <b>Unearned Rent ₱45,000</b> (liability) and <b>Rent Income ₱15,000</b>.</p></div>
<div class="fix"><p>The slide's computation line is mislabelled "Required Prepaid Insurance (12k × 9/12)"; it should read <b>Required Unearned Rent (60,000 × 9/12) = ₱45,000</b>. The T-accounts also show the receipt date as 10/31; the transaction date is October 1.</p></div>
<div class="ex" data-t="Subscriptions starting next year (pre-midterm)"><p>Big News received ₱72,000 in Nov–Dec 2024 for three-year subscriptions starting January 2, 2025. How much 2024 revenue? <b>₱0</b> — no newspapers were delivered in 2024. All ₱72,000 is Unearned Subscription Revenue.</p></div>
<div class="ex" data-t="Pioneer's unearned revenue"><p>Pioneer's Unearned Revenue fell from $1,200 to $800, so $400 of work was performed: Dr Unearned Revenue 400, Cr Service Revenue 400.</p></div>`},
{t:'Accruals: revenue earned and expenses incurred',lo:5,h:`
${kt('Accrued revenue','Accrued expense')}
<p class="lead"><b>Accruals</b> record things that have <i>happened</i> but haven't been recorded because no cash has moved yet. Unlike prepayments, an accrual adjustment <b>increases</b> both a balance-sheet account and an income-statement account.</p>
${tbl(['','Accrued revenue','Accrued expense'],[['Meaning','Earned, not yet received or recorded','Incurred, not yet paid or recorded'],['Before adjustment','Assets and revenues understated','Expenses and liabilities understated'],['Adjusting entry','Dr Receivable (asset) / Cr Revenue','Dr Expense / Cr Payable (liability)'],['Examples','Accounts receivable for unbilled work, rent receivable, interest receivable','Salaries payable, interest payable, rent payable, utilities payable']],{cls:'stack'})}
<div class="ex" data-t="Interest on a note (Illustration 3-6)"><p>Pioneer has a $5,000, 6% note payable. One month's interest has built up but isn't due yet.</p>
${calc([['Face value × annual rate × time (in years)','5,000 × 6% × 1/12'],['=Accrued interest','$25']])}
${je([['Oct 31','Interest Expense',25,''],['','Interest Payable','',25],['To accrue one month\'s interest.']])}</div>
<div class="ex" data-t="Pioneer's other accruals"><p>Work done but not yet billed, $200; salaries earned by staff but unpaid, $1,200.</p>${je([['Oct 31','Accounts Receivable',200,''],['','Service Revenue','',200],['Oct 31','Salaries Expense',1200,''],['','Salaries Payable','',1200]])}</div>
<div class="warn"><p>Time in the interest formula is always <b>in years</b>: 1 month = 1/12, 90 days = 90/360 or 90/365 (follow the problem's convention). Forgetting this is the most common interest mistake.</p></div>
<div class="ex" data-t="Expenses on the accrual basis (pre-midterm)"><p>Ms. Atlo's clinic, after two months: salary ₱12,500/month × 2 = ₱25,000; rent ₱12,000 × 2 = ₱24,000; utilities ₱7,500 for two months (including the unpaid February bill — still an expense); supplies used ₱5,000. Total expenses = 25,000 + 24,000 + 7,500 + 5,000 = <b>₱61,500</b>. The unpaid bill counts because it was <i>incurred</i>.</p></div>`},
{t:'Estimates: depreciation, bad debts and inventory',lo:5,h:`
${kt('Depreciation','Accumulated depreciation','Contra account','Book value','Salvage value','Allowance method','Direct write-off method','Income Summary')}
<p class="lead">Some costs can't be known exactly at period-end, so accountants <b>estimate</b> them. Your slides cover four.</p>
<h2>1. Depreciation (and amortisation)</h2>
<p>Equipment, buildings and other property, plant and equipment — <b>except land</b> — help earn revenue for years. So we record them as assets and spread their cost over their useful life using "systematic and rational allocation" (<a class="xl" href="#c1-4">Lesson 1.4</a>).</p>
${je([['Dec 31','Depreciation Expense','xxx',''],['','Accumulated Depreciation','','xxx']])}
<p><b>Accumulated Depreciation</b> is a <b>contra-asset</b>: it sits under the asset and is subtracted, so the original cost stays visible. Cost minus accumulated depreciation is the <b>book value</b>.</p>
${calc([['Annual depreciation (straight-line) = (Cost − Salvage value) ÷ Useful life',''],['Pioneer: office equipment, one month\'s depreciation','$83'],['Balance sheet: Office equipment $5,000 − Accumulated $83','=$4,917']])}
<div class="warn"><p>Depreciation is an <b>allocation of cost, not a measure of market value</b>. "We're not attempting to reflect the actual change in value of an asset!" (your slides). Accumulated depreciation is also not a pile of cash saved for replacement.</p></div>
<p><b>Amortisation</b> is the same idea for intangible assets (patents, copyrights, franchises): cost ÷ legal or useful life. Your slides use "amortization" for Pioneer's equipment because that deck is Canadian; in the Philippines "depreciation" is used for tangible assets. Full detail in <a class="xl" href="#c8-3">Lesson 8.3</a>.</p>
<h2>2. Estimated uncollectible accounts (bad debts)</h2>
<p>Some customers never pay. Two methods:</p>
${tbl(['','Direct write-off','Allowance'],[['When expense is recorded','Only when a specific account proves worthless','At period-end, by <b>estimate</b>'],['Used for','BIR (tax) purposes','GAAP / PFRS reporting'],['Matching?','Poor — expense may land years after the sale','Good — expense in the year of the sale']],{cls:'stack'})}
<div class="ex" data-t="Highland's receivables (allowance method)"><p>The slides list five events but no entries. Here they are under the allowance method:</p>
${je([['1','Accounts Receivable',60000,''],['','Sales','',60000],['Sales on account.'],['2','Bad Debts Expense',8000,''],['','Allowance for Doubtful Accounts','',8000],['Estimated uncollectible.'],['3','Allowance for Doubtful Accounts',3000,''],['','Accounts Receivable','',3000],['Wrote off a worthless account.'],['4','Accounts Receivable',2500,''],['','Allowance for Doubtful Accounts','',2500],['Reinstated an account previously written off.'],['5','Cash',2500,''],['','Accounts Receivable','',2500],['Collected the reinstated account.']])}
<p>Under the <b>direct</b> method, entry 2 would not exist and entry 3 would be Dr Bad Debts Expense 3,000 / Cr Accounts Receivable 3,000.</p></div>
<p>Estimating methods (detail in <a class="xl" href="#c6-4">Lesson 6.4</a>): the <b>income-statement approach</b> (percentage of sales) and the <b>balance-sheet approach</b> (percentage of receivables, or aging the receivables).</p>
<h2>3. Ending inventory (periodic system)</h2>
<p>Merchandisers count unsold goods at year-end. Using the <b>Income Summary</b> approach in your slides, the old balance is removed and the new count put in:</p>
${je([['Dec 31','Income Summary','xxx',''],['','Merchandise Inventory, beginning','','xxx'],['Dec 31','Merchandise Inventory, end','xxx',''],['','Income Summary','','xxx']])}
<p>More in <a class="xl" href="#c7-2">Lesson 7.2</a>.</p>
<h2>4. Bank reconciliation items</h2>
<p>Items the bank has already recorded (service charges, interest earned, NSF checks, collections) need book entries. That's all of Chapter 5 — see <a class="xl" href="#c5-6">Lesson 5.6</a>.</p>`},
{t:'The adjusted trial balance and the financial statements',lo:6,h:`
${kt('Adjusted trial balance')}
<p class="lead">After all adjusting entries are journalized and posted, an <b>adjusted trial balance</b> proves debits still equal credits — and the financial statements are prepared straight from it.</p>
<div class="ex" data-t="Pioneer: before and after adjustment (Illustration 3-11)">
${tbl(['Account','Before Dr','Before Cr','After Dr','After Cr'],[['Cash','15,200','','15,200',''],['Accounts Receivable','','','200',''],['Advertising Supplies','2,500','','1,000',''],['Prepaid Insurance','600','','550',''],['Office Equipment','5,000','','5,000',''],['Accumulated Amortization','','','','83'],['Notes Payable','','5,000','','5,000'],['Accounts Payable','','2,500','','2,500'],['Unearned Revenue','','1,200','','800'],['Salaries Payable','','','','1,200'],['Interest Payable','','','','25'],['C.R. Byrd, Capital','','10,000','','10,000'],['C.R. Byrd, Drawings','500','','500',''],['Service Revenue','','10,000','','10,600'],['Adv. Supplies Expense','','','1,500',''],['Amortization Expense','','','83',''],['Insurance Expense','','','50',''],['Salaries Expense','4,000','','5,200',''],['Rent Expense','900','','900',''],['Interest Expense','','','25',''],['Totals','28,700','28,700','30,208','30,208']],{num:[1,2,3,4],tot:true})}
<p>Service revenue: 10,000 + 400 (unearned now earned) + 200 (accrued) = 10,600.</p></div>
<h2>Preparing the statements — in this order</h2>
<ol class="steps"><li><b>Income statement</b> from revenue and expense accounts.</li><li><b>Statement of owner's equity</b> from capital, drawings and the net income just computed.</li><li><b>Balance sheet</b> from assets and liabilities plus the ending capital from step 2.</li></ol>
<div class="ex" data-t="Pioneer's October statements (Illustrations 3-12, 3-13)"><p><b>Income statement</b></p>${calc([['Service revenue',10600],['Adv. supplies expense','1,500'],['Amortization expense','83'],['Insurance expense','50'],['Salaries expense','5,200'],['Rent expense','900'],['Interest expense','25'],['Total expenses','(7,758)'],['=Net income','$2,842']])}
<p><b>Statement of owner's equity</b></p>${calc([['C.R. Byrd, Capital, Oct 1','0'],['Add: investments',10000],['Add: net income',2842],['Less: drawings','(500)'],['=C.R. Byrd, Capital, Oct 31','$12,342']])}
<p><b>Balance sheet</b></p>${calc([['Cash + A/R + Supplies + Prepaid insurance (15,200 + 200 + 1,000 + 550)',16950],['Office equipment 5,000 − accumulated 83',4917],['=Total assets','$21,867'],['Liabilities: 5,000 + 2,500 + 800 + 1,200 + 25',9525],['Owner\'s equity',12342],['=Total liabilities and equity','$21,867']])}</div>
<h2>Summary of adjusting entries (Illustration 3-8)</h2>
${tbl(['Type','Before adjustment','Adjusting entry'],[['Prepaid expenses','Assets overstated, expenses understated','Dr Expense / Cr Asset'],['Unearned revenues','Liabilities overstated, revenues understated','Dr Liability / Cr Revenue'],['Accrued revenues','Assets and revenues understated','Dr Asset / Cr Revenue'],['Accrued expenses','Expenses and liabilities understated','Dr Expense / Cr Liability'],['Depreciation','Expenses understated, assets overstated','Dr Depreciation Exp. / Cr Accum. Depreciation']],{cls:'stack'})}
<div class="tip"><p>Quiz 1, Q5: <b>failing to record depreciation</b> leaves expenses understated, so income is <b>overstated</b> and assets are <b>overstated</b>. Practise this "effect of a missed adjustment" reasoning for every row of the table above.</p></div>`}
],
sum:['The time-period assumption creates periods; accrual accounting (GAAP) records revenue when earned and expenses when incurred, unlike the cash basis. Adjusting entries make revenue recognition and matching happen.',
'Adjustments are needed whenever statements are prepared: prepayments, pre-collections, accruals, estimates, ending inventory and bank-reconciliation items. Each touches one income-statement and one balance-sheet account.',
'Prepaid expenses: under the asset method adjust for the used part (Dr Expense, Cr Prepaid); under the expense method adjust for the unused part (Dr Prepaid, Cr Expense). Both give the same final balances.',
'Unearned revenues: under the liability method adjust for the earned part (Dr Unearned, Cr Revenue); under the revenue method adjust for the unearned part (Dr Revenue, Cr Unearned).',
'Accruals increase both an asset and revenue, or an expense and a liability. Interest = face × rate × time. Estimates include depreciation (Dr Dep. Exp., Cr Accumulated Dep.), bad debts (allowance method for GAAP) and ending inventory.',
'The adjusted trial balance feeds the income statement, then the statement of owner\'s equity, then the balance sheet (Pioneer: NI $2,842; capital $12,342; total assets $21,867).'],

['Why does every adjusting entry involve one income-statement account and one balance-sheet account?','<p>Adjustments exist to put revenues and expenses in the correct period. Moving an amount into or out of revenue/expense always has an equal effect on an asset or liability (prepaid, unearned, receivable, payable, accumulated depreciation). Cash isn\'t involved because no cash moves at period-end.</p>'],
['Compare the asset method and the expense method for prepaid insurance of ₱24,000 paid July 1 for one year (year-end Dec 31).','<p>Six months used (₱12,000), six left (₱12,000). <b>Asset method:</b> initial Dr Prepaid Insurance 24,000; adjust Dr Insurance Expense 12,000 / Cr Prepaid 12,000. <b>Expense method:</b> initial Dr Insurance Expense 24,000; adjust Dr Prepaid 12,000 / Cr Insurance Expense 12,000. Both end with prepaid ₱12,000 and expense ₱12,000.</p>'],
['Why is the allowance method required under GAAP while the direct write-off method is used for tax?','<p>The allowance method estimates bad debts in the same period as the related sales (matching) and reports receivables at the amount expected to be collected. Direct write-off records the loss only when an account is proven worthless — often a later period — but tax rules (BIR) allow deductions only for actual write-offs.</p>'],
['List the order in which statements are prepared from the adjusted trial balance and explain why.','<p>Income statement → statement of owner\'s equity → balance sheet. Net income is needed to compute ending capital, and ending capital is needed to complete the balance sheet.</p>']],

CH.push({n:4,color:'#b5541c',title:'Completing the Accounting Cycle',
hook:'Wrapping up the year: the worksheet, closing the books, and a balance sheet that tells you whether the business can pay its bills.',
los:['Prepare a worksheet and explain its purpose.','Explain why closing entries are needed and prepare them.','Prepare a post-closing trial balance and list the nine steps of the accounting cycle.','Explain reversing entries and prepare correcting entries.','Prepare a classified balance sheet.','Measure liquidity with working capital and the current ratio.'],
why:`<p>By the end of Chapter 3 you could produce a correct set of statements. But the books aren't finished: the revenue and expense accounts still hold this year's totals. If you left them alone, next year's income statement would start with this year's sales already in it — like a basketball scoreboard that never resets between games.</p><p>This chapter finishes the cycle: an optional <b>worksheet</b> to organise the work, <b>closing entries</b> to reset the scoreboard, a <b>post-closing trial balance</b> to check, and a <b>classified balance sheet</b> that lets users judge liquidity — a bridge to the ratio analysis in Chapter 10.</p>`,
terms:{
'Worksheet':'A multi-column working paper used to organise adjustments and prepare statements; a tool, not a permanent record.',
'Closing entries':'Entries at period-end that transfer revenues, expenses and drawings to owner\'s capital and reset those accounts to zero.',
'Temporary accounts':'Revenue, expense, drawings (and Income Summary) accounts — closed every period.',
'Permanent accounts':'Balance-sheet accounts (assets, liabilities, capital) — never closed; their balances carry forward.',
'Post-closing trial balance':'A trial balance prepared after closing, listing only permanent accounts.',
'Accounting cycle':'The repeating sequence of steps from analysing transactions to the post-closing trial balance.',
'Reversing entry':'An optional entry on the first day of a new period that exactly reverses certain adjusting entries of the prior period.',
'Correcting entry':'An entry made whenever an error is discovered, to fix the accounts.',
'Classified balance sheet':'A balance sheet that groups assets and liabilities into standard subgroups (current, long-term, etc.).',
'Current assets':'Cash and other resources expected to be realised in cash, sold or consumed within one year or the operating cycle, whichever is longer.',
'Current liabilities':'Obligations expected to be paid from current assets (or new current liabilities) within one year or the operating cycle, whichever is longer.',
'Long-term investments':'Resources convertible to cash, but not expected to be within a year — e.g. shares of another company, land held for resale.',
'Capital assets':'Long-lived tangible assets (PPE, natural resources) and intangible assets used in the business.',
'Long-term liabilities':'Obligations expected to be paid after one year, e.g. long-term notes, bonds and mortgages payable.',
'Liquidity':'The ability to pay short-term obligations as they come due.',
'Working capital':'Current assets minus current liabilities.',
'Current ratio':'Current assets ÷ current liabilities; a measure of short-term debt-paying ability.'},
lessons:[
{t:'The worksheet',lo:1,h:`
${kt('Worksheet')}
<p class="lead">A <b>worksheet</b> is a big multi-column form that lets the accountant see the trial balance, the adjustments and the statements side by side. It is a <b>working tool</b>, not a permanent accounting record — like the scratch paper you use before writing your final exam answer.</p>
<figure><svg viewBox="0 0 660 120" role="img" aria-label="Worksheet columns"><g font-size="12" text-anchor="middle" font-weight="700"><rect x="4" y="10" width="100" height="44" class="al"/><text x="54" y="37">Account titles</text>
<rect x="108" y="10" width="106" height="44" class="a"/><text x="161" y="30" class="wt">Trial balance</text><text x="161" y="46" class="wt" font-weight="400">Dr | Cr</text>
<rect x="218" y="10" width="106" height="44" class="a"/><text x="271" y="30" class="wt">Adjustments</text><text x="271" y="46" class="wt" font-weight="400">Dr | Cr</text>
<rect x="328" y="10" width="106" height="44" class="a"/><text x="381" y="30" class="wt">Adjusted TB</text><text x="381" y="46" class="wt" font-weight="400">Dr | Cr</text>
<rect x="438" y="10" width="106" height="44" class="a"/><text x="491" y="30" class="wt">Income stmt</text><text x="491" y="46" class="wt" font-weight="400">Dr | Cr</text>
<rect x="548" y="10" width="106" height="44" class="a"/><text x="601" y="30" class="wt">Balance sheet</text><text x="601" y="46" class="wt" font-weight="400">Dr | Cr</text></g>
<g font-size="12" text-anchor="middle"><text x="161" y="78">① prepare</text><text x="271" y="78">② enter</text><text x="381" y="78">③ combine</text><text x="546" y="78">④ extend each balance to its statement</text><text x="546" y="100">⑤ total, find net income, balance</text></g></svg><figcaption>Illustration 4-1: the ten money columns of a worksheet and the five steps.</figcaption></figure>
<ol class="steps"><li>Enter the <b>trial balance</b>.</li><li>Enter the <b>adjustments</b>.</li><li>Combine them into <b>adjusted balances</b>.</li><li><b>Extend</b> each adjusted balance to the correct statement columns (revenues/expenses → income statement; assets, liabilities, capital, drawings → balance sheet).</li><li>Total the columns, compute <b>net income or loss</b>, and complete the worksheet.</li></ol>
<div class="ex" data-t="Finishing Pioneer's worksheet"><p>Using Pioneer's adjusted balances (<a class="xl" href="#c3-7">Lesson 3.7</a>):</p>
${tbl(['','Income stmt Dr','Income stmt Cr','Balance sheet Dr','Balance sheet Cr'],[['Column totals','7,758','10,600','22,450','19,608'],['Net income (balancing figure)','2,842','','','2,842'],['Totals','10,600','10,600','22,450','22,450']],{num:[1,2,3,4],tot:true})}
<p>Net income appears twice: as a debit to balance the income-statement columns, and as a credit in the balance-sheet columns (because it increases capital). If both pairs balance, the extension was done correctly. A net <i>loss</i> goes on the opposite sides.</p></div>
<div class="tip"><p>Balance-sheet debit total 22,450 = cash 15,200 + receivable 200 + supplies 1,000 + prepaid 550 + equipment 5,000 + <b>drawings 500</b>. Drawings is extended to the balance-sheet columns — not the income statement — because it isn't an expense.</p></div>`},
{t:'Closing entries',lo:2,h:`
${kt('Closing entries','Temporary accounts','Permanent accounts')}
<p class="lead">At the end of the period, the temporary accounts are emptied into owner's capital. This does two jobs:</p>
<ol><li>It <b>updates owner's capital</b> for the period's net income (or loss) and drawings.</li><li>It <b>resets revenue, expense and drawings accounts to zero</b>, ready for next period.</li></ol>
${tbl(['Temporary (nominal) — closed','Permanent (real) — not closed'],[['All revenue accounts','All asset accounts'],['All expense accounts','All liability accounts'],['Owner\'s drawings','Owner\'s capital']])}
<h2>The four closing entries</h2>
<figure><svg viewBox="0 0 640 220" role="img" aria-label="Closing process"><g text-anchor="middle" font-weight="700" font-size="14"><rect x="20" y="20" width="160" height="46" rx="8" class="al"/><text x="100" y="48">Expenses</text><rect x="460" y="20" width="160" height="46" rx="8" class="al"/><text x="540" y="48">Revenues</text><rect x="240" y="20" width="160" height="46" rx="8" class="a"/><text x="320" y="48" class="wt">Income Summary</text><rect x="240" y="150" width="160" height="46" rx="8" class="a"/><text x="320" y="178" class="wt">Owner's Capital</text><rect x="20" y="150" width="160" height="46" rx="8" class="al"/><text x="100" y="178">Drawings</text></g>
<path d="M458 43h-54M182 43h54M320 68v78M182 173h54" class="as" stroke-width="2.5" marker-end="url(#a4)"/><defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="a"/></marker></defs>
<g font-size="13" font-weight="700"><text x="430" y="36">①</text><text x="210" y="36">②</text><text x="332" y="112">③ net income</text><text x="208" y="166">④</text></g></svg><figcaption>Revenues and expenses go to Income Summary, its balance (net income) goes to capital, then drawings goes to capital.</figcaption></figure>
<ol class="steps"><li>Debit each <b>revenue</b> account for its balance; credit Income Summary for total revenues.</li><li>Debit Income Summary for total expenses; credit each <b>expense</b> account.</li><li>Debit Income Summary for its balance (= net income); credit Owner's Capital. (Reverse for a loss.)</li><li>Debit Owner's Capital; credit <b>Drawings</b> for its balance.</li></ol>
<div class="ex" data-t="Closing R. A. Lamb's merchandising accounts (Illustration slides)"><p>Data comes from the income-statement columns of the worksheet. Opening capital was $83,000.</p>
${je([['Dec 31','Sales',480000,''],['','Income Summary','',480000],['(1) Close revenue accounts.'],['31','Income Summary',450000,''],['','Sales Returns and Allowances','',12000],['','Sales Discounts','',8000],['','Cost of Goods Sold','',316000],['','Store Salaries Expense','',45000],['','Rent Expense','',19000],['','Freight-out','',7000],['','Advertising Expense','',16000],['','Utilities Expense','',17000],['','Depreciation Expense','',8000],['','Insurance Expense','',2000],['(2) Close debit-balance income-statement accounts.'],['31','Income Summary',30000,''],['','R. A. Lamb, Capital','',30000],['(3) Close net income (480,000 − 450,000).'],['31','R. A. Lamb, Capital',15000,''],['','R. A. Lamb, Drawings','',15000],['(4) Close drawings.']])}
${calc([['Opening capital',83000],['Add: net income',30000],['Less: drawings','(15,000)'],['=Ending capital','$98,000']])}</div>
<div class="warn"><p><b>Sales Returns and Allowances</b> and <b>Sales Discounts</b> have <i>debit</i> balances (they reduce sales), so they are closed with the expenses in entry 2, not with Sales. <b>Cost of Goods Sold</b> is a new account for merchandisers and is closed the same way.</p></div>
<div class="deep"><p>The slides' diagram shows revenues and expenses closed <i>directly</i> to Owner's Capital, while the journal entries use <b>Income Summary</b> as a middle stop. Both give the same capital balance; Income Summary just makes net income visible as one figure before it goes to capital.</p></div>
<p><b>Stop and check:</b> after posting, (1) does capital equal the ending capital on the statement of owner's equity? (2) Is every temporary account at zero?</p>`},
{t:'The post-closing trial balance and the accounting cycle',lo:3,h:`
${kt('Post-closing trial balance','Accounting cycle')}
<p class="lead">After closing, a <b>post-closing trial balance</b> proves that the <b>permanent</b> accounts — the only ones carried into next period — still balance.</p>
<div class="ex" data-t="Pioneer's post-closing trial balance (Illustration 4-8)">${tbl(['Account','Debit','Credit'],[['Cash','15,200',''],['Accounts Receivable','200',''],['Advertising Supplies','1,000',''],['Prepaid Insurance','550',''],['Office Equipment','5,000',''],['Accumulated Amortization','','83'],['Notes Payable','','5,000'],['Accounts Payable','','2,500'],['Unearned Revenue','','800'],['Salaries Payable','','1,200'],['Interest Payable','','25'],['C. R. Byrd, Capital','','12,342'],['Totals','$21,950','$21,950']],{num:[1,2],tot:true})}
<p>No revenues, expenses or drawings appear — they were closed. Capital is now the ending balance of $12,342.</p></div>
<h2>The nine steps of the accounting cycle</h2>
<figure><svg viewBox="0 0 520 330" role="img" aria-label="Accounting cycle"><g font-size="12.5" text-anchor="middle">
<circle cx="260" cy="165" r="118" class="ln" stroke-width="2" stroke-dasharray="4 5"/>
<g font-weight="700"><rect x="190" y="14" width="140" height="34" rx="17" class="a"/><text x="260" y="36" class="wt">1 Analyse</text>
<rect x="358" y="54" width="150" height="34" rx="17" class="al"/><text x="433" y="76">2 Journalize</text>
<rect x="388" y="122" width="126" height="34" rx="17" class="al"/><text x="451" y="144">3 Post</text>
<rect x="372" y="190" width="146" height="34" rx="17" class="al"/><text x="445" y="212">4 Trial balance</text>
<rect x="320" y="258" width="190" height="34" rx="17" class="al"/><text x="415" y="280">5 Adjusting entries</text>
<rect x="120" y="290" width="200" height="34" rx="17" class="al"/><text x="220" y="312">6 Adjusted trial balance</text>
<rect x="6" y="222" width="170" height="34" rx="17" class="al"/><text x="91" y="244">7 Financial statements</text>
<rect x="6" y="140" width="150" height="34" rx="17" class="al"/><text x="81" y="162">8 Closing entries</text>
<rect x="6" y="64" width="170" height="34" rx="17" class="al"/><text x="91" y="86">9 Post-closing TB</text></g>
<text x="260" y="160" class="mu">repeats every</text><text x="260" y="178" class="mu">period</text></g></svg><figcaption>Steps 1–3 happen during the period; steps 4–9 at the end. (Reversing entries are an optional step 10.)</figcaption></figure>`},
{t:'Reversing and correcting entries',lo:4,h:`
${kt('Reversing entry','Correcting entry')}
<h2>Reversing entries (optional)</h2>
<p class="lead">A <b>reversing entry</b> is made on the <b>first day of the new period</b> and is the exact opposite of an adjusting entry from the period before. Its only purpose is convenience: the bookkeeper can then record the next cash payment or receipt the normal way, without remembering the old accrual.</p>
<div class="ex" data-t="Reversing Pioneer's salary accrual"><p>(Added to show the idea; your slides refer this to an appendix.) Pioneer accrued $1,200 of salaries on October 31. Suppose $4,000 of salaries is paid on November 9, covering October's $1,200 plus $2,800 for November.</p>
${je([['Oct 31','Salaries Expense',1200,''],['','Salaries Payable','',1200],['Adjusting entry.'],['Nov 1','Salaries Payable',1200,''],['','Salaries Expense','',1200],['Reversing entry.'],['Nov 9','Salaries Expense',4000,''],['','Cash','',4000],['Paid salaries — recorded the normal way.']])}
<p>Salaries Expense for November = 4,000 − 1,200 = <b>$2,800</b>, exactly right, and Salaries Payable is back to zero. Without the reversal, the clerk would have to split the payment: Dr Salaries Payable 1,200, Dr Salaries Expense 2,800, Cr Cash 4,000.</p></div>
<div class="tip"><p>Reversing entries are typically used for <b>accruals</b> (accrued revenues and expenses), and for prepayments/pre-collections that were first recorded under the <b>expense or revenue method</b>.</p></div>
<h2>Correcting entries</h2>
<p>Errors should be fixed <b>as soon as they are discovered</b> with a <b>correcting entry</b>. Unlike adjusting entries, they can be made at any time, and can involve any combination of balance-sheet and income-statement accounts — even Cash. If the books are error-free, none are needed.</p>
<ol class="steps"><li>Work out the entry that <b>was</b> made.</li><li>Work out the entry that <b>should have been</b> made.</li><li>Record whatever entry turns the first into the second.</li></ol>
<div class="ex" data-t="Hunt Company's wages check (from the Cash deck)"><p>Check No. 630 for wages was recorded as $240 instead of the correct $420. Recorded: Dr Wages Expense 240 / Cr Cash 240. Should be: 420 / 420. Correction for the $180 difference:</p>${je([['','Wages Expense',180,''],['','Cash','',180],['To correct check No. 630 recorded at $240 instead of $420.']])}<p>You'll meet this item again in Hunt's bank reconciliation (<a class="xl" href="#c5-7">Lesson 5.7</a>).</p></div>`},
{t:'The classified balance sheet',lo:5,h:`
${kt('Classified balance sheet','Current assets','Long-term investments','Capital assets','Current liabilities','Long-term liabilities')}
<p class="lead">A <b>classified balance sheet</b> groups items into standard subgroups so users can see, at a glance, which assets will soon become cash and which debts are due soon.</p>
${tbl(['Assets','Liabilities and equity'],[['Current assets','Current liabilities'],['Long-term investments','Long-term liabilities'],['Capital assets (PPE, natural resources, intangibles)','Owner\'s / partners\' / shareholders\' equity']])}
<h2>The groups</h2>
<p><b>Current assets</b> — cash and resources expected to be realised in cash, sold or consumed within <b>one year or the operating cycle, whichever is longer</b>. Listed in order of <b>liquidity</b> (how quickly they turn into cash): cash, temporary investments, receivables, inventory, prepaids.</p>
<p><b>Long-term investments</b> — can be turned into cash but aren't expected to be within that time: shares or bonds of another company, land held for resale.</p>
<p><b>Capital assets</b> — (1) property, plant and equipment and natural resources (land, buildings, machinery, timber, oil reserves), and (2) intangible assets with no physical substance (patents, copyrights, trademarks).</p>
<p><b>Current liabilities</b> — paid from current assets within one year or the operating cycle, whichever is longer: accounts payable, unearned revenue, interest payable, the current portion of long-term debt.</p>
<p><b>Long-term liabilities</b> — due after one year: long-term notes, bonds, mortgages, lease liabilities.</p>
<p><b>Equity</b> — a proprietorship has one Capital account; a partnership one per partner; a corporation has <b>shareholders' equity</b> = share capital + retained earnings.</p>
<div class="ex" data-t="Pioneer's classified balance sheet (Illustration 4-17)"><p>Of Pioneer's $5,000 note payable, $1,000 is due within a year and $4,000 later.</p>
${calc([['Cash',15200],['Accounts receivable',200],['Advertising supplies',1000],['Prepaid insurance',550],['=Total current assets','16,950'],['Office equipment 5,000 less accumulated amortization 83',4917],['=Total assets','$21,867']])}
${calc([['Notes payable (current portion)',1000],['Accounts payable',2500],['Unearned revenue',800],['Salaries payable',1200],['Interest payable',25],['=Total current liabilities','5,525'],['Notes payable (long-term)',4000],['=Total liabilities','9,525'],['C. R. Byrd, Capital',12342],['=Total liabilities and owner\'s equity','$21,867']])}</div>
<div class="ph"><p>Your Exercise 4 asked when trade receivables are current: within one year <b>or</b> the normal operating cycle, <b>whichever is longer</b>. PAS 1 also lets entities present items in order of liquidity when that is more relevant (common for banks).</p></div>`},
{t:'Liquidity: working capital and the current ratio',lo:6,h:`
${kt('Liquidity','Working capital','Current ratio')}
<p class="lead"><b>Liquidity</b> is the ability to pay short-term debts when they come due. Two simple measures use the classified balance sheet.</p>
${calc([['Working capital = Current assets − Current liabilities',''],['Current ratio = Current assets ÷ Current liabilities','']])}
<p>The <b>current ratio</b> (or working-capital ratio) is the more dependable indicator, because it adjusts for size: ₱100,000 of working capital is comfortable for a small clinic and dangerously thin for a hospital chain.</p>
<div class="ex" data-t="Pioneer's liquidity"><p>Using Lesson 4.5's figures:</p>${calc([['Working capital = 16,950 − 5,525','$11,425'],['Current ratio = 16,950 ÷ 5,525','3.07 : 1']])}<p>Pioneer has about $3.07 of current assets for every $1 of current debt.</p></div>
<div class="ex" data-t="Community Hospital Supplies (pre-midterm Q15)"><p>Current assets: cash ₱5,000,000; receivables ₱6,700,000; accrued interest receivable ₱600,000; inventory ₱500,000; prepaid insurance ₱300,000. Current liabilities: accounts payable ₱8,500,000; income tax payable ₱1,440,000.</p>
${calc([['Current assets',13100000],['Current liabilities','9,940,000'],['=Working capital','₱3,160,000'],['Current ratio = 13,100,000 ÷ 9,940,000','1.32'],['Quick ratio = (5,000,000 + 6,700,000 + 600,000) ÷ 9,940,000','1.24']])}
<p>The quick (acid-test) ratio leaves out inventory and prepaids — see <a class="xl" href="#c10-4">Lesson 10.4</a>.</p></div>
<div class="warn"><p>Working capital is a <b>peso amount</b>; the current ratio is a <b>ratio</b>. Exam options love to pair a correct ratio with an incorrect working capital (₱13,100,000 is total current assets, not working capital).</p></div>`}
],

CH.push({n:5,color:'#2a7d3f',title:'Cash and Internal Control',
hook:'The most tempting asset in the business — how companies pay out, protect and reconcile their cash.',
los:['Describe the operating, investing and financing activities of a business and how each affects cash.','Define cash and explain the main internal-control procedures over cash.','Record cash payments for inventory, including purchase discounts and returns.','Record payments for expenses and operate a petty cash fund.','Prepare a bank reconciliation and the journal entries it requires.'],
why:`<p>Cash is the one asset everyone wants: it is small, easy to carry and impossible to identify once spent. That makes it the asset most exposed to theft and error, which is why companies wrap it in controls — separate duties, deposit everything, pay by numbered check, and reconcile the bank account every month.</p><p>This chapter follows cash going <i>out</i> of a business (paying suppliers, expenses and small items through petty cash), then shows how to prove the books agree with the bank. The bank reconciliation is a guaranteed exam topic: your Exercises 3 and 4 had more than ten questions on it.</p>`,
terms:{
'Operating activities':'Activities tied to the main purpose of the business: selling, buying inventory and paying expenses.',
'Investing activities':'Buying and selling long-term assets such as property, plant and equipment and investments.',
'Financing activities':'Raising money other than through operations — borrowing (debt) or selling ownership (equity) — and repaying it.',
'Cash':'Coins, currency, money orders, checks, and bank deposits available to pay the company\'s obligations.',
'Internal control':'The policies and procedures a business uses to protect its assets and ensure its records are reliable.',
'Segregation of duties':'Separating the people who handle cash from the people who record it, so no one person can steal and hide it.',
'Purchase discount':'A reduction a seller offers if the buyer pays within a short period (e.g. 2/10, n/30).',
'2/10, n/30':'Credit terms: 2% discount if paid within 10 days; otherwise the full (net) amount is due in 30 days.',
'Purchase returns and allowances':'Goods sent back to the supplier, or a price reduction for damaged goods.',
'Debit memo':'A document the buyer sends the seller to notify a return or request an allowance; the buyer debits Accounts Payable.',
'Petty cash fund':'A small cash fund kept on hand to pay minor expenses without writing checks.',
'Imprest system':'A fixed-amount fund: expenses are recorded only when the fund is replenished back to its set amount.',
'Bank statement':'The bank\'s monthly report of a depositor\'s beginning balance, deposits, checks cleared, other charges and ending balance.',
'Bank reconciliation':'A schedule that explains the difference between the cash balance on the bank statement and the cash balance in the books.',
'Deposit in transit':'A deposit recorded in the books but not yet processed by the bank.',
'Outstanding check':'A check written and deducted in the books but not yet cleared by the bank.',
'NSF check':'A customer\'s check that bounced because of Not Sufficient Funds; the bank deducts it from the depositor\'s account.',
'Bank service charge':'A fee the bank deducts for maintaining the account.',
'Credit memo':'The bank\'s notice that it increased the depositor\'s balance (e.g. interest, a collection).',
'Adjusted balance':'The correct cash balance; both the bank side and the book side of a reconciliation must reach it.'},
lessons:[
{t:'Business activities and cash',lo:1,h:`
${kt('Operating activities','Investing activities','Financing activities')}
<p class="lead">Every business does three kinds of things, and each one moves cash.</p>
${tbl(['Activity','What it means','Cash in','Cash out'],[['<b>Operating</b>','Selling products/services, buying inventory, paying expenses — the business\'s primary purpose','Cash sales, collecting receivables','Paying suppliers, salaries, rent'],['<b>Investing</b>','Buying assets for use: PPE and financial assets. Less frequent, large amounts','Selling PPE or investments','Buying PPE or investments'],['<b>Financing</b>','Raising money other than by operating: debt or equity','Borrowing; owners investing','Repaying debt; paying dividends/drawings']],{cls:'stack'})}
<p>Two ways to raise money: <b>debt financing</b> (borrowing from creditors) and <b>equity financing</b> (selling ownership to investors).</p>
<div class="tip"><p>Even <b>credit</b> sales and purchases cause cash flows — just later, when the customer pays or you pay the supplier.</p></div>
<p>These same three labels become the three sections of the statement of cash flows in <a class="xl" href="#c9-1">Lesson 9.1</a>. The Cengage textbook behind this deck lays out its chapters by activity: operating (receivables, inventory, expenses), investing (PPE, investments), financing (debt, equity), then cash flows and analysis.</p>`},
{t:'What counts as cash — and how to protect it',lo:2,h:`
${kt('Cash','Internal control','Segregation of duties')}
<p class="lead"><b>Cash</b> includes coins, currency, money orders and checks, and money on deposit with banks or savings institutions that is <b>available to pay the company's obligations</b>.</p>
<p>The key test is <b>"unrestricted and available for current use."</b> Your exercises drilled this:</p>
${tbl(['Item','Cash?','Why'],[['Currency and coins','Yes','Available now'],['Checking and savings account balances','Yes','On deposit and available'],['Money orders, certified checks, customers\' current checks','Yes','Can be deposited immediately'],['Petty cash fund, change fund','Yes','Cash on hand'],['<b>Postdated checks</b> from customers','No — a receivable','Can\'t be deposited until its date'],['<b>IOUs</b> from employees','No — a receivable','Just a promise to pay'],['Certificates of deposit, money-market certificates','Usually not cash','They are investments (may be cash equivalents if very short-term)'],['Cash set aside to repay long-term debt','No','Restricted']],{cls:'stack'})}
<div class="ph"><p>Postdated checks (PDCs) are everyday tools in the Philippines — landlords, banks and suppliers routinely take a stack of them. Remember they are <b>not cash</b> until their date arrives and they can be deposited.</p></div>
<h2>Cash control procedures</h2>
<ol class="steps"><li><b>Separate duties</b>: the person who handles cash should not record it.</li><li><b>Deposit all cash receipts</b> in the bank.</li><li>Except for small amounts (petty cash), <b>make all payments by pre-numbered checks</b>.</li><li><b>Reconcile the bank account</b> regularly (usually monthly).</li></ol>
<div class="ex" data-t="Spot the weak control (Exercise 4)"><p>"The responsibility for receiving merchandise and paying for it should usually be given to one person" is the <b>incorrect</b> statement: one person could then approve payment for goods that never arrived. Rotating clerical staff and giving well-defined responsibilities are good controls.</p></div>`},
{t:'Paying for inventory: discounts and returns',lo:3,h:`
${kt('Purchase discount','2/10, n/30','Purchase returns and allowances','Debit memo')}
<p class="lead">Hot Pot Bakery (the deck's running example) uses a perpetual inventory system, so purchases, discounts and returns all go through the <b>Inventory</b> account.</p>
<div class="ex" data-t="Cash and credit purchases"><p>Hot Pot buys inventory: ₱2,000 in cash and ₱3,000 on account, then pays the ₱3,000 a month later.</p>${je([['','Inventory',5000,''],['','Cash','',2000],['','Accounts Payable','',3000],['To record cash and credit purchases.'],['1 month later','Accounts Payable',3000,''],['','Cash','',3000],['Paid for the earlier credit purchase.']])}</div>
<h2>Purchase discounts</h2>
<p>Sellers offer a discount to get paid sooner. <b>"2/10, n/30"</b> means: take <b>2%</b> off if you pay within <b>10</b> days; otherwise pay the <b>net</b> (full) amount within <b>30</b> days.</p>
<div class="ex" data-t="Taking the discount"><p>March 1, 2017: Hot Pot buys flour for ₱1,000 on terms 2/10, n/30. It pays on March 6 (within 10 days): discount = 1,000 × 2% = ₱20.</p>${je([['Mar 1','Inventory',1000,''],['','Accounts Payable','',1000],['Mar 6','Accounts Payable',1000,''],['','Cash','',980],['','Inventory','',20],['Paid within the discount period.']])}<p>The discount <b>reduces the cost of the inventory</b> (credit Inventory), because the flour really cost ₱980.</p></div>
<div class="ex" data-t="Missing the discount is expensive"><p>If Hot Pot pays on March 15 instead, it pays ₱1,000 — an extra ₱20 for keeping ₱980 for 20 more days (day 10 to day 30). As an annual interest rate:</p>${calc([['Rate = 20 ÷ 980 × 360 ÷ 20','≈ 36.7%, about 37% a year']])}${je([['Mar 15','Accounts Payable',1000,''],['','Cash','',1000]])}<p>That's why companies borrow at 10% from a bank rather than miss a 2/10 discount.</p></div>
<h2>Purchase returns and allowances</h2>
<p>If goods are damaged or defective, the buyer sends the seller a <b>debit memo</b> (it "debits" the seller's account in the buyer's books) and records Dr Accounts Payable, Cr Inventory.</p>
<div class="ex" data-t="Return, then discounted payment"><p>On March 2, Hot Pot returns ₱200 of the poor-quality flour, then pays the rest on March 7 (within the discount period).</p>${je([['Mar 2','Accounts Payable',200,''],['','Inventory','',200],['Returned inventory to vendor.'],['Mar 7','Accounts Payable',800,''],['','Cash','',784],['','Inventory','',16],['Paid balance less 2% of ₱800.']])}</div>
<div class="warn"><p>The discount is computed only on the amount <b>still owed after returns</b> (₱800 × 2% = ₱16), not on the original ₱1,000.</p></div>
<div class="ex" data-t="Trade discount + cash discount (pre-midterm Q23)"><p>List price ₱500,000; trade discount 30%; terms 10/30, n/50, FOB shipping point; buyer paid ₱20,000 freight; pays on day 30.</p>${calc([['Invoice price = 500,000 × 70%',350000],['Less cash discount 10% (paid within 30 days)','(35,000)'],['=Cash paid to seller','₱315,000']])}<p>The trade discount is just a price reduction (never recorded separately). Under FOB shipping point the buyer pays freight separately to the carrier, so it is not part of the payment to the seller.</p></div>`},
{t:'Paying for expenses',lo:4,h:`
<p class="lead">Companies pay many operating expenses in cash — rent, maintenance, utilities. If a payment is for a <b>future</b> period, it is debited to an <b>asset</b> (Prepaid Rent, Prepaid Insurance) and expensed as time passes — the asset method from <a class="xl" href="#c3-3">Lesson 3.3</a>.</p>
<div class="ex" data-t="One-year insurance"><p>On January 2, 2017, Hot Pot pays ₱12,000 for one year of insurance. At the end of each month, one-twelfth is used up.</p>${je([['Jan 2','Prepaid Insurance',12000,''],['','Cash','',12000],['Prepaid one year of insurance.'],['Jan 31','Insurance Expense',1000,''],['','Prepaid Insurance','',1000],['Consumed portion: 12,000 ÷ 12.']])}</div>
<div class="tip"><p>Cash leaves on January 2, but the expense is recognised ₱1,000 per month — the matching principle at work. On the cash-flow statement, the whole ₱12,000 is an operating outflow in January.</p></div>`},
{t:'Petty cash funds',lo:4,h:`
${kt('Petty cash fund','Imprest system')}
<p class="lead">Writing a check for ₱45 of postage is silly. A <b>petty cash fund</b> is a small amount of cash, looked after by one <b>custodian</b>, used for minor payments.</p>
<h2>1. Establish the fund</h2>
<div class="ex" data-t="Setting up the fund"><p>April 1, 2017: Hot Pot issues a check to set up a ₱3,000 fund for the personnel department.</p>${je([['Apr 1','Petty Cash',3000,''],['','Cash','',3000],['To establish petty cash fund.']])}</div>
<h2>2. Make payments — no journal entry</h2>
<p>When the custodian pays something from the fund, <b>no accounting entry is made</b>. Each payment must be supported by a <b>petty cash receipt (voucher)</b>. At any moment: <b>receipts + cash left = fund size</b>.</p>
<h2>3. Replenish the fund</h2>
<p>At regular intervals, or when the fund runs low, it is topped back up to its original amount. Expenses are recorded <b>now</b>, from the receipts.</p>
<div class="ex" data-t="Replenishing"><p>On April 30, ₱700 is left. Receipts show miscellaneous ₱400, postage ₱1,450 and freight-out ₱450.</p>${calc([['Receipts 400 + 1,450 + 450',2300],['Cash left',700],['=Total (equals fund size)','3,000']])}${je([['Apr 30','Miscellaneous Expenses',400,''],['','Postage Expense',1450,''],['','Freight-out',450,''],['','Cash','',2300],['To replenish petty cash fund.']])}</div>
<div class="warn"><p>Replenishment debits <b>expenses</b> and credits <b>Cash</b>; it does <b>not</b> touch the Petty Cash account. Petty Cash is debited only when the fund is <b>created</b> or <b>increased</b> (and credited if decreased). This was asked in both Exercise 3 and 4.</p></div>
<div class="ph"><p>This "fixed amount" design is called the <b>imprest system</b> — the control feature specific to petty cash. Its main purpose is to <b>control small cash disbursements</b>: the custodian must always account for the full fund with cash plus receipts.</p></div>
<div class="deep"><p>If receipts plus cash don't add up to the fund (say only ₱680 is left), the ₱20 difference is debited to <b>Cash Short and Over</b> (a shortage is an expense-type item). Not on your slides, but common in exam problems.</p></div>`},
{t:'The bank statement and reconciling items',lo:5,h:`
${kt('Bank statement','Credit memo','Deposit in transit','Outstanding check','NSF check','Bank service charge')}
<p class="lead">Each month the bank sends a <b>bank statement</b>: beginning balance, deposits, checks paid, other charges and credits, and ending balance. It rarely matches the company's Cash account. Why? The two sets of records are kept by different people at different times.</p>
<div class="warn"><p><b>The bank's point of view is reversed.</b> To the bank, your deposit is money it owes you — a <i>liability</i>. So a bank <b>debit memo</b> reduces your balance (e.g. service charge, NSF check) and a bank <b>credit memo</b> increases it (e.g. interest, a note collected for you).</p></div>
<h2>Three reasons the balances differ</h2>
${tbl(['Type','Items','Who must adjust?'],[['<b>1. Timing differences</b> — the bank hasn\'t caught up','Deposits in transit; outstanding checks','<b>Bank side</b> (no book entry needed)'],['<b>2. Banking entries</b> — the books haven\'t caught up','Service charges, NSF checks, direct deposits by customers, interest paid, bank transfers','<b>Book side</b> — journal entries required'],['<b>3. Errors</b>','Bank errors / book (accounting) errors','The side that made the error']],{cls:'stack'})}
<ul><li><b>Deposit in transit</b> — deposited at month-end but not on the statement yet; it will appear next month.</li><li><b>Outstanding check</b> — written and deducted in the books but not yet presented to or cleared by the bank.</li><li><b>NSF check</b> — a customer's deposited check bounced; the bank takes the amount back. The company now has a receivable from that customer again.</li></ul>
<div class="tip"><p>Logic questions from Exercise 4: if the <b>bank</b> balance is lower than the correct balance with no errors, there must be a <b>deposit in transit</b>. If the <b>book</b> balance is lower than correct, there must be a <b>deposit credited by the bank not yet recorded</b> (e.g. interest or a collection). Outstanding checks and deposits in transit <b>never</b> require book entries.</p></div>`},
{t:'Preparing the bank reconciliation',lo:5,h:`
${kt('Bank reconciliation','Adjusted balance')}
<p class="lead">A <b>bank reconciliation</b> brings both balances to the same <b>correct (adjusted) cash balance</b>. The account is reconciled when the two adjusted balances are equal.</p>
${tbl(['Bank side','Book side'],[['Balance per bank statement','Balance per books'],['+ Deposits in transit','+ Interest paid by bank'],['− Outstanding checks','+ Direct deposits / collections by bank'],['± Bank errors','− Service charges'],['','− NSF checks'],['','− Bank transfers out'],['','± Accounting (book) errors'],['= Adjusted bank balance','= Adjusted book balance']])}
<div class="ex" data-t="Hunt Company, July 2017 (Exhibit 6.5)"><p>Bank statement ending balance $14,422; books $13,937. Notes: deposit in transit $3,100; outstanding checks No. 625 $326, No. 631 $426, No. 634 $185 (No. 627 was voided); service charge $7; direct deposit by Joy Company $3,200; transfer of $425 to Martin Custodial Service; interest $60; check No. 630 for wages recorded as $240 instead of $420.</p>
${calc([['Balance per bank statement',14422],['Add: deposit in transit',3100],['Less: outstanding checks (326 + 426 + 185)','(937)'],['=Adjusted bank balance','$16,585']])}
${calc([['Balance per books',13937],['Add: direct deposit (Joy Co.) 3,200 + interest 60',3260],['Less: service charge 7 + bank transfer 425 + error on check 630 (420 − 240 = 180)','(612)'],['=Adjusted book balance','$16,585']])}
<p>Both sides agree at <b>$16,585</b>. Only the <b>book-side</b> items need journal entries:</p>
${je([['Jul 31','Cash',3260,''],['','Accounts Receivable','',3200],['','Interest Revenue','',60],['Additions from the July reconciliation.'],['31','Custodial Expense',425,''],['','Miscellaneous Expense',7,''],['','Wages Expense',180,''],['','Cash','',612],['Deductions: transfer, service charge, check No. 630 error.']])}</div>
<div class="warn"><p>The voided check No. 627 is <b>not</b> outstanding — it will never clear. And the $3,200 direct deposit credits <b>Accounts Receivable</b>, because Joy Company was paying what it owed.</p></div>
<div class="ex" data-t="Gold Mountain Company (Quiz Yourself)"><p>Bank balance $9,500; service charge $65; interest added $45; deposits not yet recorded by bank $2,700; checks not yet recorded by bank $3,900; book balance $8,320.</p>
${calc([['Balance per bank',9500],['Add: deposits in transit',2700],['Less: outstanding checks','(3,900)'],['=Correct balance','$8,300']])}${calc([['Balance per books',8320],['Add: interest earned',45],['Less: bank service charge','(65)'],['=Correct balance','$8,300']])}
${je([['','Cash',45,''],['','Interest Revenue','',45],['','Miscellaneous (Bank Service) Expense',65,''],['','Cash','',65]])}</div>
<div class="tip"><p>Exercise 4's twist: "a deposit of another entity credited by the bank to the depositor's account" needs <b>no</b> book entry — it's a <b>bank error</b>, fixed on the bank side.</p></div>`}
],
