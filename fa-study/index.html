CH.push({n:9,color:'#00708a',title:'The Statement of Cash Flows',
hook:'Profit is an opinion; cash is a fact. Where the money actually came from, and where it went.',
los:['State the primary purpose of the statement of cash flows.','Classify cash flows as operating, investing or financing, and identify significant noncash activities.','Explain how the corporate life cycle shows up in a company\'s cash flows.','Prepare the operating section by the indirect method.','Prepare the operating section by the direct method.','Use the statement of cash flows to evaluate a company.'],
why:`<p>A company can report a healthy profit and still run out of cash — customers haven't paid yet, money is stuck in inventory, or a big machine was just bought. Lenders and investors know this, so they read the cash-flow statement to see where cash really came from and where it went. Many believe it is <b>harder to manipulate</b> than net income.</p><p>This is the only statement <b>not</b> prepared on the accrual basis (<a class="xl" href="#c1-3">Lesson 1.3</a>). Preparing it means "undoing" accrual accounting — which is why every adjusting entry you learned in Chapter 3 comes back here in reverse.</p>`,
terms:{
'Statement of cash flows':'A statement reporting cash receipts, cash payments and the net change in cash from operating, investing and financing activities during a period.',
'Cash equivalents':'Short-term, highly liquid investments that are readily convertible to known amounts of cash with little risk of change in value.',
'Significant noncash activities':'Important investing and financing transactions that involve no cash (e.g. issuing shares to buy land); disclosed separately.',
'Indirect method':'Computes operating cash flow by starting with net income and adjusting for noncash items and changes in current assets and liabilities.',
'Direct method':'Computes operating cash flow by listing the major classes of operating cash receipts and payments.',
'Product life cycle':'The phases a product (or company) passes through: introductory, growth, maturity and decline.',
'Noncash charges':'Expenses or losses that reduce net income but use no cash, such as depreciation, amortisation and losses on sale.',
'Free cash flow':'Cash from operations left after paying for capital expenditures (and, in some texts, dividends).',
'Capital expenditure ratio':'Cash provided by operations ÷ cash spent on capital expenditures.'},
lessons:[
{t:'Purpose and the three activities',lo:2,h:`
${kt('Statement of cash flows','Cash equivalents','Significant noncash activities')}
<p class="lead">The <b>primary purpose</b> of the statement of cash flows is to provide information about a company's <b>cash receipts, cash payments, and net change in cash</b> from its operating, investing and financing activities during the period — in a format that reconciles beginning and ending cash.</p>
<p>It answers three questions: <b>Where did cash come from? What was it used for? What was the change in the cash balance?</b></p>
<h2>Classification</h2>
${tbl(['Activity','Cash inflows','Cash outflows'],[['<b>Operating</b> — income-statement items','Sales of goods and services; interest received; dividends received','To suppliers; to employees; for taxes; for interest; for other expenses'],['<b>Investing</b> — long-term assets and investments','Sale of PPE; sale of other entities\' debt or equity securities; collection of loans made to others','Purchase of PPE; purchase of other entities\' securities; loans made to others'],['<b>Financing</b> — long-term liabilities and equity','Issuing own shares; issuing debt (bonds, notes)','Dividends to shareholders; repaying debt; buying back own shares']],{cls:'stack'})}
<p><b>Operating activities</b> is the most important category — it shows whether the business can generate enough cash from its operations to continue as a going concern and to grow.</p>
<div class="tip"><p>Rule of thumb: <b>operating</b> = income-statement items and current assets/liabilities; <b>investing</b> = noncurrent assets; <b>financing</b> = long-term liabilities and equity. Interest and dividends <i>received</i>, and interest <i>paid</i>, are operating in the slides because they appear in the income statement. Dividends <i>paid</i> are financing.</p></div>
<div class="deep"><p>The slides quote IAS 7 (PAS 7) for the definitions of investing and financing. Under PAS 7 a company may choose to classify interest and dividends received as operating <i>or</i> investing, and interest and dividends paid as operating <i>or</i> financing — as long as it is consistent. The slides follow the most common choice.</p></div>
<h2>Significant noncash activities</h2>
<p>Some important investing and financing deals involve no cash: issuing shares to buy assets, converting bonds into shares, issuing debt to buy assets, exchanging plant assets. They are <b>not</b> in the body of the statement; they're disclosed in a separate schedule at the bottom or in a note (full disclosure, <a class="xl" href="#c1-4">Lesson 1.4</a>).</p>
<h2>Format</h2>
${calc([['Cash flows from operating activities (list)','XX'],['=Net cash provided (used) by operating activities','XXX'],['Cash flows from investing activities (list)','XX'],['=Net cash provided (used) by investing activities','XXX'],['Cash flows from financing activities (list)','XX'],['=Net cash provided (used) by financing activities','XXX'],['=Net increase (decrease) in cash','XXX'],['Cash at beginning of period','XXX'],['=Cash at end of period','XXX'],['Noncash investing and financing activities (separate schedule)','XXX']])}
<p>Individual investing and financing inflows and outflows are shown <b>separately</b>, not netted.</p>`},
{t:'Life cycle, usefulness and how to prepare it',lo:3,h:`
${kt('Product life cycle','Indirect method','Direct method')}
<p class="lead">Products — and the companies that make them — move through four phases. The phase shows up clearly in the cash-flow pattern.</p>
${tbl(['Phase','What\'s happening','Operating','Investing','Financing'],[['Introductory','Buying assets, starting to produce and sell','−','−','+'],['Growth','Expanding; buying inventory ahead of sales; CFO below net income','− / small +','−','+'],['Maturity','Sales level off; CFO ≈ net income and exceeds investing needs','+','−','− (repay debt, buy back shares)'],['Decline','Demand weakens; selling excess assets','+ but falling','+','−']],{cls:'stack'})}
<h2>Why it's useful</h2>
<p>It helps users evaluate the company's ability to <b>generate future cash flows</b>, to <b>pay dividends and meet obligations</b>, the reasons for the <b>difference between net income and operating cash</b>, and its <b>cash investing and financing</b> transactions. Comparing operating cash with net income reveals the <b>quality of earnings</b>.</p>
<h2>How it's prepared</h2>
<p>Unlike the other statements, it can't be prepared from the adjusted trial balance. It needs <b>changes</b> in balances over the period and it is on a cash basis. Three sources:</p>
<ol><li><b>Comparative balance sheet</b> — the change in each asset, liability and equity account.</li><li><b>Current income statement</b> — to work out operating cash.</li><li><b>Additional information</b> — transaction details.</li></ol>
<ol class="steps"><li>Determine the <b>net increase or decrease in cash</b>.</li><li>Determine net cash from <b>operating</b> activities.</li><li>Determine net cash from <b>investing and financing</b> activities.</li></ol>
<h2>Indirect vs direct</h2>
<p>Both convert accrual net income to cash and give the <b>same</b> operating total; investing and financing sections are <b>identical</b>.</p>
${tbl(['Indirect method','Direct method'],[['Starts with net income and adjusts it','Lists actual cash receipts and payments'],['Most companies use it: easier, focuses on NI vs cash differences, reveals less to competitors','More consistent with the statement\'s purpose; <b>preferred by IFRS</b> (both allowed)'],['—','If used, a separate reconciliation (indirect) schedule must also be given (per the slides)']],{cls:'stack'})}`},
{t:'Indirect method: a first-year company',lo:4,h:`
${kt('Noncash charges')}
<p class="lead">Computer Services Company began on January 1, 1999 by issuing 50,000 shares of $1 par common stock for $50,000.</p>
<div class="ex" data-t="Computer Services Company, 1999 data">${tbl(['Balance sheet','Dec 31, 1999','Jan 1, 1999','Change'],[['Cash','34,000','0','+34,000'],['Accounts receivable','30,000','0','+30,000'],['Equipment','10,000','0','+10,000'],['Accounts payable','4,000','0','+4,000'],['Common stock','50,000','0','+50,000'],['Retained earnings','20,000','0','+20,000']],{num:[1,2,3]})}
${calc([['Revenues',85000],['Operating expenses','(40,000)'],['Income tax expense','(10,000)'],['=Net income','$35,000']])}<p>Additional: a $15,000 dividend was declared and paid; equipment was bought at year-end (no depreciation).</p></div>
<h2>Step 1 — Change in cash</h2><p>$0 → $34,000: <b>increase of $34,000</b>.</p>
<h2>Step 2 — Operating activities</h2>
<p>Start with net income and remove the effect of accruals, using the changes in current assets and current liabilities.</p>
<ul><li><b>Accounts receivable rose $30,000</b>: revenue was $85,000 but only $55,000 was collected. <b>Deduct</b> the increase.</li><li><b>Accounts payable rose $4,000</b>: expenses were $40,000 but only $36,000 was paid. <b>Add</b> the increase.</li></ul>
${tbl(['Accounts Receivable — debit','Credit'],[['Jan 1 balance 0',''],['Revenues 85,000','Receipts from customers 55,000'],['Dec 31 balance 30,000','']])}
${calc([['Net income',35000],['Increase in accounts receivable','(30,000)'],['Increase in accounts payable',4000],['=Net cash provided by operating activities','$9,000']])}
<h2>Step 3 — Investing and financing</h2>
<p>Look at the noncurrent accounts. With no other explanation, <b>assume changes involved cash</b>: Equipment +$10,000 → purchase (investing outflow). Common stock +$50,000 → issuance (financing inflow). Retained earnings +$20,000 = net income $35,000 (already in operating) − dividends $15,000 (financing outflow).</p>
<div class="ex" data-t="Statement of cash flows, 1999 (Illustration 11-12)">${calc([['Net income',35000],['Increase in accounts receivable','(30,000)'],['Increase in accounts payable',4000],['=Net cash provided by operating activities','9,000'],['Purchase of equipment','(10,000)'],['=Net cash used by investing activities','(10,000)'],['Issuance of common stock',50000],['Payment of cash dividends','(15,000)'],['=Net cash provided by financing activities','35,000'],['=Net increase in cash','34,000'],['Cash, beginning','0'],['=Cash, end','$34,000']])}<p>The $34,000 increase agrees with the balance sheet — the check that the statement is complete.</p></div>`},
{t:'Indirect method: the second year',lo:4,h:`
<div class="ex" data-t="Computer Services Company, 2000 data">${tbl(['Balance sheet','2000','1999','Change'],[['Cash','56,000','34,000','+22,000'],['Accounts receivable','20,000','30,000','−10,000'],['Prepaid expenses','4,000','0','+4,000'],['Land','130,000','0','+130,000'],['Building','160,000','0','+160,000'],['Accum. depr. — building','(11,000)','0','+11,000'],['Equipment','27,000','10,000','+17,000'],['Accum. depr. — equipment','(3,000)','0','+3,000'],['Accounts payable','59,000','4,000','+55,000'],['Bonds payable','130,000','0','+130,000'],['Common stock','50,000','50,000','0'],['Retained earnings','144,000','20,000','+124,000']],{num:[1,2,3]})}
${calc([['Revenues',507000],['Operating expenses','(261,000)'],['Depreciation expense','(15,000)'],['Loss on sale of equipment','(3,000)'],['Income tax expense','(89,000)'],['=Net income','$139,000']])}
<p>Additional: (a) $15,000 cash dividend; (b) land acquired by issuing $130,000 of bonds; (c) building bought for $160,000 cash and equipment for $25,000 cash; (d) equipment with book value $7,000 (cost $8,000, accumulated depreciation $1,000) sold for $4,000.</p></div>
<div class="fix"><p>Two slide typos: the 2000 income statement is headed "For the Year Ended December 31, <b>1999</b>" (should be 2000), and the cash increase is shown as "$56,000 − <b>$24,000</b>" (should be $56,000 − $34,000 = $22,000).</p></div>
<h2>Operating adjustments</h2>
${tbl(['Item','Why','Adjustment'],[['Depreciation $15,000 ($11,000 building + $4,000 equipment)','Expense with no cash outflow','<b>Add</b>'],['Loss on sale $3,000','Reduced NI but not cash; the $4,000 proceeds go in investing','<b>Add</b>'],['A/R decreased $10,000','Collected more than revenue','<b>Add</b>'],['Prepaid expenses increased $4,000','Paid more than expensed','<b>Deduct</b>'],['A/P increased $55,000','Expensed more than paid','<b>Add</b>']],{cls:'stack'})}
<div class="tip"><p>Equipment accumulated depreciation: 0 + depreciation − 1,000 (removed on sale) = 3,000, so equipment depreciation was <b>$4,000</b>. 11,000 + 4,000 = the $15,000 on the income statement.</p></div>
<div class="ex" data-t="Statement of cash flows, 2000 (Illustration 11-18)">${calc([['Net income',139000],['Depreciation expense',15000],['Loss on sale of equipment',3000],['Decrease in accounts receivable',10000],['Increase in prepaid expenses','(4,000)'],['Increase in accounts payable',55000],['=Net cash provided by operating activities','218,000'],['Purchase of building','(160,000)'],['Purchase of equipment','(25,000)'],['Sale of equipment',4000],['=Net cash used by investing activities','(181,000)'],['Payment of cash dividends','(15,000)'],['=Net cash used by financing activities','(15,000)'],['=Net increase in cash','22,000'],['Cash, beginning',34000],['=Cash, end','$56,000'],['Noncash: issuance of bonds payable to purchase land','$130,000']])}</div>
<h2>Summary of the indirect method</h2>
${tbl(['Item','Adjustment to net income'],[['Depreciation, amortisation, depletion','Add'],['Loss on sale of assets','Add'],['Gain on sale of assets','Deduct'],['Increase in a current asset (A/R, inventory, prepaid)','Deduct'],['Decrease in a current asset','Add'],['Increase in a current liability (A/P, accrued, taxes payable)','Add'],['Decrease in a current liability','Deduct']])}`},
{t:'Direct method: a first-year company',lo:5,h:`
<p class="lead">The direct method adjusts <b>each income-statement line</b> from accrual to cash and reports the major classes of operating receipts and payments: from customers; to suppliers; to employees and for operating expenses; for interest; for taxes.</p>
<div class="ex" data-t="Juarez Company, 1999 data"><p>Started January 1, 1999 by issuing 300,000 shares of $1 par stock for $300,000.</p>
${tbl(['Balance sheet, Dec 31, 1999','Amount (all increases from 0)'],[['Cash','159,000'],['Accounts receivable','15,000'],['Inventory','160,000'],['Prepaid expenses','8,000'],['Land','80,000'],['Accounts payable','60,000'],['Accrued expenses payable','20,000'],['Common stock','300,000'],['Retained earnings','42,000']],{num:[1]})}
${calc([['Revenues from sales',780000],['Cost of goods sold','(450,000)'],['Operating expenses','(170,000)'],['Income tax expense','(48,000)'],['=Net income','$112,000']])}<p>Dividends of $70,000 were paid in cash; the A/P increase came from merchandise purchases.</p></div>
<h2>The four conversions</h2>
${calc([['Receipts from customers = Revenues − increase in A/R (or + decrease)',''],['Purchases = COGS + increase in inventory (or − decrease)',''],['Payments to suppliers = Purchases − increase in A/P (or + decrease)',''],['Payments for operating expenses = Operating expenses + increase in prepaids − increase in accrued liabilities',''],['Payments for income taxes = Tax expense − increase in taxes payable (or + decrease)','']])}
<div class="ex" data-t="Juarez's operating cash, 1999">${calc([['Receipts from customers = 780,000 − 15,000',765000],['Purchases = 450,000 + 160,000 = 610,000; payments to suppliers = 610,000 − 60,000','(550,000)'],['Operating expenses 170,000 + 8,000 (prepaid ↑) − 20,000 (accrued ↑)','(158,000)'],['Income taxes (no taxes payable)','(48,000)'],['=Net cash provided by operating activities','$9,000']])}</div>
${tbl(['Accounts Payable — debit','Credit'],[['','Jan 1 balance 0'],['Payments to suppliers 550,000','Purchases 610,000'],['','Dec 31 balance 60,000']])}
<div class="ex" data-t="Juarez's complete 1999 statement (Illustration 11-35)">${calc([['Cash receipts from customers',765000],['Cash payments (550,000 + 158,000 + 48,000)','(756,000)'],['=Net cash provided by operating activities','9,000'],['Purchase of land','(80,000)'],['=Net cash used by investing activities','(80,000)'],['Issuance of common stock',300000],['Payment of cash dividends','(70,000)'],['=Net cash provided by financing activities','230,000'],['=Net increase in cash','$159,000']])}</div>`},
{t:'Direct method: the second year',lo:5,h:`
<div class="ex" data-t="Juarez Company, 2000 data">${tbl(['Balance sheet','2000','1999','Change'],[['Cash','191,000','159,000','+32,000'],['Accounts receivable','12,000','15,000','−3,000'],['Inventory','130,000','160,000','−30,000'],['Prepaid expenses','6,000','8,000','−2,000'],['Land','180,000','80,000','+100,000'],['Equipment','160,000','0','+160,000'],['Accum. depr. — equipment','(16,000)','0','+16,000'],['Accounts payable','52,000','60,000','−8,000'],['Accrued expenses payable','15,000','20,000','−5,000'],['Income taxes payable','12,000','0','+12,000'],['Bonds payable','90,000','0','+90,000'],['Common stock','400,000','300,000','+100,000'],['Retained earnings','94,000','42,000','+52,000']],{num:[1,2,3]})}
${calc([['Revenues from sales',975000],['Cost of goods sold','(660,000)'],['Operating expenses','(176,000)'],['Depreciation expense','(18,000)'],['Loss on sale of equipment','(1,000)'],['Income tax expense','(36,000)'],['=Net income','$84,000']])}
<p>Additional: (a) $32,000 cash dividend; (b) bonds issued at face for $90,000 cash; (c) equipment bought for $180,000 cash; (d) equipment costing $20,000 (book value $18,000) sold for $17,000; (e) common stock of $100,000 issued to acquire land.</p></div>
<h2>Operating conversions</h2>
${calc([['Receipts from customers = 975,000 + 3,000 (A/R ↓)',978000],['Payments to suppliers = 660,000 − 30,000 (inventory ↓) + 8,000 (A/P ↓)','(638,000)'],['Payments for operating expenses = 176,000 − 2,000 (prepaid ↓) + 5,000 (accrued ↓)','(179,000)'],['Payments for income taxes = 36,000 − 12,000 (taxes payable ↑)','(24,000)'],['=Net cash provided by operating activities','$137,000']])}
<p><b>Depreciation</b> and the <b>loss on sale</b> are noncash, so they simply don't appear in the direct method. (If operating expenses had included depreciation, you'd subtract it first.)</p>
<div class="fix"><p><b>Correction:</b> the slide's final statement shows net cash from operating activities of <b>$218,000</b>, which is copied from Computer Services Company. Juarez's figure is 978,000 − 841,000 = <b>$137,000</b>. Proof: 137,000 − 163,000 (investing) + 58,000 (financing) = 32,000, the actual increase in cash. With $218,000 the statement would not reconcile.</p></div>
<div class="ex" data-t="Juarez's corrected 2000 statement (Illustration 11-44)">${calc([['Cash receipts from customers',978000],['Payments: suppliers 638,000 + operating expenses 179,000 + taxes 24,000','(841,000)'],['=Net cash provided by operating activities','137,000'],['Purchase of equipment','(180,000)'],['Sale of equipment',17000],['=Net cash used by investing activities','(163,000)'],['Issuance of bonds payable',90000],['Payment of cash dividends','(32,000)'],['=Net cash provided by financing activities','58,000'],['=Net increase in cash','32,000'],['Cash, beginning',159000],['=Cash, end','$191,000'],['Noncash: common stock issued to purchase land','$100,000']])}</div>
<div class="tip"><p>Check with the indirect method: 84,000 + 18,000 + 1,000 + 3,000 + 30,000 + 2,000 − 8,000 − 5,000 + 12,000 = <b>137,000</b>. Both methods must give the same answer — a great way to check your work in an exam.</p></div>`},
{t:'Using cash flows to evaluate a company',lo:6,h:`
${kt('Free cash flow','Capital expenditure ratio')}
<p class="lead">The deck's preview lists free cash flow and the capital expenditure ratio but has no slides on them, so this lesson is brief and uses common textbook definitions (check your readings).</p>
${calc([['Free cash flow = Cash provided by operations − Capital expenditures − Cash dividends',''],['Capital expenditure ratio = Cash provided by operations ÷ Capital expenditures','']])}
<div class="ex" data-t="Computer Services Company, 2000"><p>Operating cash $218,000; capital expenditures (building $160,000 + equipment $25,000) $185,000; dividends $15,000.</p>${calc([['Free cash flow = 218,000 − 185,000 − 15,000','$18,000'],['Capital expenditure ratio = 218,000 ÷ 185,000','1.18 times']])}<p>Operations paid for all of the year's investment with a little left over. (Some textbooks define free cash flow without deducting dividends.)</p></div>
<h2>What to look for</h2>
<ul><li><b>Operating cash vs net income</b> — persistent operating cash well below net income is a warning sign about earnings quality.</li><li><b>Life-cycle pattern</b> — does the mix of operating/investing/financing match the company's phase (Lesson 9.2)?</li><li><b>How investment is funded</b> — by operations (healthy) or by selling assets and borrowing (risky)? This is step 10 of the "eyeball technique" in <a class="xl" href="#c10-7">Lesson 10.7</a>.</li></ul>
<div class="ph"><p>Philippine listed companies (for example, San Miguel Brewery in Chapter 10) present the statement of cash flows under <b>PAS 7</b>; most use the indirect method, just as the slides predict.</p></div>`}
],

hook:'Reading the numbers like an analyst: trends, common-size statements, ratios, DuPont — and a ten-step "eyeball" health check.',
los:['Explain why comparison is needed, the three bases of comparison and the three analytical tools; describe the operating cycle.','Perform horizontal (trend) analysis.','Perform vertical (common-size) analysis.','Compute and interpret liquidity ratios.','Compute and interpret solvency and leverage measures.','Compute profitability ratios and break ROE into its DuPont components.','Apply the eyeball technique and the Altman Z-score.','Discuss the limitations of financial statement analysis.'],
why:`<p>A single number tells you almost nothing. "Cash: $243.8 million" — is that a lot? More than last year? Enough? You only know by <b>comparing</b>. Financial statement analysis is the art of comparing: a company with its own past, with its industry, and with its competitors.</p><p>This chapter merges your two FS Analysis decks: the textbook tools (horizontal, vertical and ratio analysis) and the Ateneo lecture module (operating cycle, leverage, DuPont, the Aurellado "eyeball" technique and Altman's Z-score, applied to <b>San Miguel Brewery</b>). It pulls together everything from Chapters 1–9.</p>`,
terms:{
'Intracompany comparison':'Comparing a company with itself over time.',
'Intercompany comparison':'Comparing a company with other companies, e.g. competitors.',
'Industry average':'A benchmark showing typical results for companies in the same industry.',
'Horizontal analysis':'Trend analysis: the change in each item over time, in amount and as a percentage of a base year.',
'Vertical analysis':'Common-size analysis: each item expressed as a percentage of a base (total assets, or net sales).',
'Ratio analysis':'Expressing the relationship between two financial statement items as a ratio, rate or percentage.',
'Liquidity ratios':'Measures of a company\'s short-term ability to pay maturing obligations.',
'Solvency ratios':'Measures of a company\'s ability to survive over the long term.',
'Profitability ratios':'Measures of a company\'s income or operating success for a period.',
'Acid-test ratio':'(Cash + marketable securities + net receivables) ÷ current liabilities; also called the quick ratio.',
'Inventory turnover ratio':'Cost of goods sold ÷ average inventory.',
'Days in inventory':'365 (or 360) ÷ inventory turnover.',
'Leverage':'Using borrowed money (debt) to increase the return to owners; also "trading on the equity."',
'Debt to total assets ratio':'Total liabilities ÷ total assets.',
'Times interest earned':'Income before interest and taxes ÷ interest expense (interest coverage).',
'Return on assets':'Net income ÷ (average) total assets (ROA).',
'Return on equity':'Net income (available to common shareholders) ÷ (average) shareholders\' equity (ROE).',
'Profit margin':'Net income ÷ net sales.',
'Asset turnover':'Net sales ÷ (average) total assets.',
'Equity multiplier':'Total assets ÷ shareholders\' equity; a measure of financial leverage.',
'DuPont analysis':'Breaking ROE into profit margin × asset turnover × equity multiplier.',
'Earnings per share':'Income available to common shareholders ÷ weighted average common shares outstanding (EPS).',
'Price-earnings ratio':'Market price per share ÷ earnings per share.',
'Payout ratio':'Cash dividends ÷ net income.',
'Weighted average cost of capital':'The average rate a company pays for its funds (debt and equity), weighted by their amounts (WACC).',
'Eyeball technique':'A quick ten-step check of profitability, liquidity and solvency, developed by Prof. E. Aurellado (Ateneo).',
'Altman Z-score':'A formula combining five ratios to predict the likelihood of bankruptcy within about two years.',
'Capital deficiency':'Negative total equity: liabilities exceed assets.'},
lessons:[
{t:'Why analyse — comparisons, tools and the operating cycle',lo:1,h:`
${kt('Intracompany comparison','Industry average','Intercompany comparison','Operating cycle')}
<p class="lead">Every item in a statement tells you only that something exists in a certain amount. Whether it's an increase, or adequate, can only be judged by comparison.</p>
<h2>Three bases of comparison</h2>
${tbl(['Basis','Compares…','Reveals'],[['Intracompany','A company with its own past','Trends and changing relationships'],['Industry averages','A company with its industry','Its relative position'],['Intercompany','A company with specific competitors','Its competitive position']],{cls:'stack'})}
<h2>Three tools</h2>
<p><b>Horizontal analysis</b> (across time), <b>vertical analysis</b> (within one statement), and <b>ratio analysis</b> (relationships between items).</p>
<h2>A quick refresher from the Ateneo module</h2>
<p>"How rich are you?" is a balance-sheet question (<b>Assets = Liabilities + Equity</b>). "How much did you make?" is an income-statement question (<b>Revenue − Cost = Profit</b>). We'll use the module's typical company throughout this chapter:</p>
<div class="ex" data-t="The module's typical company (₱)">${tbl(['Balance sheet','₱','Income statement','₱'],[['Cash','50,000','Sales','1,200,000'],['Receivables','600,000','Cost of sales','(940,000)'],['Inventory','250,000','Gross profit','260,000'],['Current assets','900,000','Selling expenses','(60,000)'],['PPE','2,300,000','Administrative expenses','(100,000)'],['Investments','700,000','EBIT','100,000'],['Total assets','3,900,000','Interest','(30,000)'],['Accounts payable','600,000','Taxes','(21,000)'],['Other payables','100,000','Net income','49,000'],['Long-term debt','2,000,000','',''],['Common stock','1,000,000','',''],['Retained earnings','200,000','','']],{num:[1,3]})}</div>
<h2>The operating cycle</h2>
<p>Cash buys inventory → inventory is sold on credit → receivables are collected → cash again. The <b>operating cycle</b> measures how many days that loop takes.</p>
<figure><svg viewBox="0 0 520 210" role="img" aria-label="Operating cycle"><defs><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="a"/></marker></defs><g text-anchor="middle" font-weight="700" font-size="14"><rect x="190" y="10" width="140" height="42" rx="21" class="a"/><text x="260" y="36" class="wt">Cash</text><rect x="360" y="140" width="150" height="42" rx="21" class="al"/><text x="435" y="166">Inventory</text><rect x="10" y="140" width="170" height="42" rx="21" class="al"/><text x="95" y="166">Accounts receivable</text></g><path d="M332 40c80 10 110 50 105 96M358 162H184M90 138C80 90 120 45 186 34" class="as" stroke-width="2.5" marker-end="url(#a10)"/><g font-size="13" class="mu"><text x="420" y="78">purchase</text><text x="270" y="155" text-anchor="middle">sell</text><text x="70" y="78">collect</text></g></svg><figcaption>Operating cycle = days in inventory + days in receivables.</figcaption></figure>
<div class="ex" data-t="Typical company's operating cycle (360-day year)">${calc([['Inventory turnover = Cost of sales ÷ Inventory = 940,000 ÷ 250,000','3.76 times'],['Days in inventory = 360 ÷ 3.76','95.74 days'],['Receivable turnover = Sales ÷ Receivables = 1,200,000 ÷ 600,000','2 times'],['Days in receivables = 360 ÷ 2','180 days'],['=Operating cycle','275.74 days']])}<p>Cash is tied up for about nine months from purchase to collection — a long time.</p></div>
<div class="fix"><p>Two of the module's slides show inventory as ₱750,000 (with current assets ₱1,400,000); the calculation uses ₱250,000, consistent with the typical balance sheet. Use ₱250,000.</p></div>`},
{t:'Horizontal analysis',lo:2,h:`
${kt('Horizontal analysis')}
<p class="lead"><b>Horizontal (trend) analysis</b> evaluates financial data over a period of time, showing whether each item increased or decreased — in amount and as a percentage.</p>
${calc([['% change since base period = (Current-year amount − Base-year amount) ÷ Base-year amount','']])}
<div class="ex" data-t="Kellogg's net sales trend ($ millions, base = earliest year)">${tbl(['Year','Year 5','Year 4','Year 3','Year 2','Base year'],[['Net sales','6,830.1','6,676.6','7,003.7','6,562.0','6,295.4'],['% of base','108.5%','106.1%','111.3%','104.2%','100%']],{num:[1,2,3,4,5]})}${calc([['Growth over the period = (6,830.1 − 6,295.4) ÷ 6,295.4','≈ 8.5%']])}</div>
<div class="fix"><p>The deck labels these years 2013–2017, but its headers also say "Base Period 1993" and "during 1997", and Kellogg's sales are far larger today. The figures look like Kellogg's 1990s results with updated year labels — treat the years as illustrative.</p></div>
<div class="ex" data-t="Kellogg — two-year comparison (in millions)">${tbl(['','Current','Prior','Change','%'],[['Current assets','1,467.7','1,528.6','(60.9)','(4.0)'],['Plant assets (net)','2,773.3','2,932.9','(159.6)','(5.4)'],['Total assets','4,877.6','5,050.0','(172.4)','(3.4)'],['Current liabilities','1,657.3','2,199.0','(541.7)','(24.6)'],['Long-term liabilities','2,222.8','1,568.6','654.2','41.7'],['Total stockholders\' equity','997.5','1,282.4','(284.9)','(22.2)'],['Net sales','6,830.1','6,676.6','153.5','2.3'],['Cost of goods sold','3,270.1','3,122.9','147.2','4.7'],['Selling & administrative','2,366.8','2,458.7','(91.9)','(3.7)'],['Net income','546.0','531.0','15.0','2.8']],{num:[1,2,3,4]})}
<p><b>Reading it:</b> current liabilities fell 24.6% while long-term liabilities rose 41.7% — Kellogg swapped short-term for long-term debt. Equity fell 22.2% (a large retirement of treasury shares cut retained earnings by $3,025.5M). Sales grew only 2.3% and cost of goods sold grew faster (4.7%), yet net income rose 2.8% mainly because selling and administrative expenses fell 3.7%.</p></div>
<div class="warn"><p>No percentage change can be computed if the base-year amount is <b>zero</b>, or if it is <b>negative</b> and the later amount positive (or vice versa) — e.g. Kellogg's "cumulative effect of accounting change."</p></div>`},
{t:'Vertical (common-size) analysis',lo:3,h:`
${kt('Vertical analysis')}
<p class="lead"><b>Vertical analysis</b> expresses each item as a percentage of a base: <b>total assets</b> for the balance sheet, <b>net sales</b> for the income statement. It shows the relative size of each item.</p>
<div class="ex" data-t="Kellogg, two years">${tbl(['','Current %','Prior %'],[['Current assets','30.1','30.3'],['Plant assets (net)','56.9','58.0'],['Current liabilities','34.0','43.5'],['Long-term liabilities','45.6','31.3'],['Total stockholders\' equity','20.4','25.4'],['Cost of goods sold (% of sales)','47.9','46.8'],['Gross profit','52.1','53.2'],['Selling & administrative','34.6','36.8'],['Net income','8.0','8.0']],{num:[1,2]})}
<p>Kellogg shifted toward <b>heavier reliance on debt</b>: long-term liabilities rose from 31.3% to 45.6% of total liabilities and equity while equity fell from 25.4% to 20.4%. On the income side, COGS rose 1.1 points while S&amp;A fell 2.2 points, leaving net income at 8% of sales.</p></div>
<div class="fix"><p>One slide's narrative says long-term liabilities rose "from 31.1%"; the table shows 31.3%.</p></div>
<h2>Comparing companies of different sizes</h2>
<p>Because everything is a percentage, vertical analysis lets you compare a giant with a smaller rival — hence its other name, <b>common-size analysis</b>.</p>
<div class="case" data-t="Kellogg vs General Mills">${tbl(['% of net sales','Kellogg','General Mills'],[['Cost of goods sold','47.9','41.5'],['Gross profit','52.1','58.5'],['Selling & administrative','34.6','43.2'],['Income from operations','14.8','14.4'],['Net income','8.0','7.9']],{num:[1,2]})}<p>Kellogg's sales are 22% bigger, so raw pesos (dollars) mislead. In percentages, Kellogg makes less per sale at the gross level (higher COGS) but spends much less on selling and administration, so both end up near 8% net margin.</p></div>`},
{t:'Liquidity ratios',lo:4,h:`
${kt('Ratio analysis','Liquidity ratios','Acid-test ratio','Inventory turnover ratio','Days in inventory')}
<p class="lead">A single ratio means little on its own; always compare (intracompany, intercompany, industry). Ratios fall into three groups: <b>liquidity</b>, <b>solvency</b>, <b>profitability</b>. Liquidity ratios interest short-term creditors such as bankers and suppliers.</p>
${tbl(['Ratio','Formula','Measures'],[['Current ratio','Current assets ÷ Current liabilities','Short-term debt-paying ability'],['Acid-test (quick) ratio','(Cash + marketable securities + net receivables) ÷ Current liabilities','Immediate liquidity — excludes inventory and prepaids'],['Current cash debt coverage','Cash from operations ÷ Average current liabilities','Ability to pay current debts from operating cash'],['Receivables turnover','Net credit sales ÷ Average net receivables','Liquidity of receivables'],['Average collection period','365 ÷ Receivables turnover','Days to collect'],['Inventory turnover','Cost of goods sold ÷ Average inventory','Liquidity of inventory'],['Days in inventory','365 ÷ Inventory turnover','Days to sell inventory']],{cls:'stack'})}
<div class="warn"><p>The current ratio ignores <b>what</b> the current assets are — a good ratio may hide slow-moving inventory. The acid-test ratio fixes that by leaving out inventory and prepaid expenses (which may not be readily sold or transferred).</p></div>
<div class="ex" data-t="Typical company">${calc([['Current ratio = 900,000 ÷ 700,000','1.29 : 1'],['Acid-test ratio = (50,000 + 600,000) ÷ 700,000','0.93 : 1']])}<p>The eyeball benchmarks (Lesson 10.7) are about 2:1 and 1:1, so this company is a bit thin on both.</p></div>
<div class="fix"><p>The module shows 1.28 and 0.92 — those are truncated. Rounded properly, 900 ÷ 700 = 1.2857 → <b>1.29</b> and 650 ÷ 700 = 0.9286 → <b>0.93</b>.</p></div>
<div class="ph"><p>San Miguel Brewery, December 31, 2017 (₱ millions, from the deck): current assets 38,953 (cash 26,297; receivables 4,995); current liabilities 12,717. Current ratio = <b>3.06</b>; quick ratio = (26,297 + 4,995) ÷ 12,717 = <b>2.46</b> — very liquid, largely because of its cash pile.</p></div>
<div class="tip"><p>Turnover up = good (faster); days down = good. A collection period should not greatly exceed the credit terms. High inventory turnover means less cash tied up and less obsolescence risk — but too high risks running out of stock. See also <a class="xl" href="#c6-5">Lesson 6.5</a> and <a class="xl" href="#c4-6">Lesson 4.6</a>.</p></div>`},
{t:'Solvency, leverage and the cost of capital',lo:5,h:`
${kt('Solvency ratios','Leverage','Debt to total assets ratio','Times interest earned','Capital deficiency','Weighted average cost of capital')}
<p class="lead">Solvency ratios measure the ability to survive over the long term — of most interest to long-term creditors and shareholders: can the company pay interest when due and repay the debt at maturity?</p>
${tbl(['Ratio','Formula'],[['Debt to total assets','Total debt ÷ Total assets'],['Times interest earned','Income before interest expense and income taxes ÷ Interest expense'],['Cash debt coverage','Cash from operations ÷ Average total liabilities'],['Free cash flow','Cash from operations − capital expenditures − dividends (see Lesson 9.7)']])}
<div class="ex" data-t="Typical company">${calc([['Debt to total assets = (700,000 + 2,000,000) ÷ 3,900,000','69.2%'],['Times interest earned = 100,000 ÷ 30,000','3.33 times']])}<p>Creditors provide about 69% of the assets; operating profit covers interest 3.3 times.</p></div>
<h2>Leverage — the lever and the fulcrum</h2>
<p>The module draws leverage as a lever: a small force on a long lever lifts a heavy weight. With <b>debt</b> as the lever, a company can earn more on owners' money — <b>if</b> it earns more on the borrowed funds than it pays in interest ("trading on the equity at a gain"). If it earns less, leverage magnifies losses ("trading at a loss"). Leverage is a two-way street.</p>
<h2>The cushion: watch equity disappear</h2>
<p>Equity is the creditors' <b>cushion (buffer)</b>. The module shows losses eating it away:</p>
${tbl(['Scenario','Retained earnings (deficit)','Total equity','Long-term debt'],[['Healthy','200,000','1,200,000','2,000,000'],['Losses','(200,000)','800,000','2,000,000 → 2,400,000'],['Heavy losses','(1,400,000)','(400,000)','2,400,000 → 3,600,000']],{num:[1,2,3]})}
<p>Total assets stay at ₱3,900,000 throughout: as losses mount, creditors are funding more and more of the business. Negative equity is <b>capital deficiency</b> — liabilities exceed assets. The lower the debt ratio, the more equity buffer creditors have if the company fails.</p>
<h2>Capital structure and WACC</h2>
<p>Each source of funds has a cost: debt costs <b>interest</b>; capital stock and retained earnings cost <b>dividends</b> (owners' expected return).</p>
<div class="ex" data-t="Weighted average cost of capital">${tbl(['Source','Amount','Rate','Annual cost'],[['Debt','100,000','12%','12,000'],['Capital stock','200,000','20%','40,000'],['Retained earnings','50,000','20%','10,000'],['Total','350,000','','62,000']],{num:[1,2,3],tot:true})}${calc([['WACC = 62,000 ÷ 350,000','17.7%']])}<p><b>Capital budgeting</b> rule from the module: a project's return (IRR) should be at least the WACC — revenue-generating assets must earn more than the financing costs on the other side of the balance sheet.</p></div>
<div class="deep"><p>The module simplifies: in practice interest is tax-deductible, so the after-tax cost of debt is lower, and WACC uses market values. Fine for this course's level.</p></div>`},
{t:'Profitability ratios and DuPont analysis',lo:6,h:`
${kt('Profitability ratios','Return on assets','Return on equity','Profit margin','Asset turnover','Equity multiplier','DuPont analysis','Earnings per share','Price-earnings ratio','Payout ratio')}
<p class="lead">Profitability is the ultimate test of management's effectiveness — it affects a company's ability to borrow, its liquidity and its growth.</p>
${tbl(['Ratio','Formula'],[['Return on common equity (ROE)','(Net income − preferred dividends) ÷ Average common equity'],['Return on assets (ROA)','Net income ÷ Average total assets'],['Profit margin','Net income ÷ Net sales'],['Asset turnover','Net sales ÷ Average total assets'],['Gross profit rate','Gross profit ÷ Net sales'],['Operating expenses to sales','Operating expenses ÷ Net sales'],['Cash return on sales','Cash from operations ÷ Net sales'],['Earnings per share (EPS)','Income available to common ÷ Weighted average common shares'],['Price-earnings (P-E)','Market price per share ÷ EPS'],['Payout ratio','Cash dividends ÷ Net income']],{cls:'stack'})}
<div class="ex" data-t="Typical company (ending balances)">${calc([['ROA = 49,000 ÷ 3,900,000','1.26%'],['ROE = 49,000 ÷ 1,200,000','4.08%']])}</div>
<div class="fix"><p>The module shows ROE = <b>0.04%</b> — a slip: 49,000 ÷ 1,200,000 = 0.0408 = <b>4.08%</b>. (Its ROA of 1.25% is 1.256% truncated; 1.26% rounded.)</p></div>
<h2>How turnover creates income</h2>
<p>The module's restaurant: 50 seats, ₱100 per diner per hour, full and unable to expand. Revenue per hour = ₱5,000. If diners are turned every half-hour, ₱10,000; every 15 minutes, ₱20,000. <b>Same assets, more sales</b> — that is asset turnover.</p>
<h2>DuPont analysis</h2>
<p>DuPont (introduced by E.I. du Pont de Nemours for evaluating managers) breaks ROE into three levers:</p>
${calc([['ROE = Net income ÷ Sales × Sales ÷ Assets × Assets ÷ Equity',''],['ROE = Profit margin × Asset turnover × Equity multiplier',''],['ROA = Profit margin × Asset turnover; so ROE = ROA × Equity multiplier','']])}
<ol><li><b>Profit margin</b> — profit per peso of sales; improve by raising gross margin or cutting expenses.</li><li><b>Asset turnover</b> — sales per peso of assets; improve by selling more with the same assets, or using fewer assets.</li><li><b>Financial leverage</b> (equity multiplier) — how much of the assets are financed by debt; raises ROE when results are positive, but adds risk.</li></ol>
<div class="ex" data-t="DuPont for the typical company">${calc([['Profit margin = 49,000 ÷ 1,200,000','4.083%'],['Asset turnover = 1,200,000 ÷ 3,900,000','0.3077'],['Equity multiplier = 3,900,000 ÷ 1,200,000','3.25'],['=ROE = 4.083% × 0.3077 × 3.25','4.08%']])}<p>Diagnosis: thin margins and very slow asset turnover; only heavy leverage lifts ROE.</p></div>
<div class="ph"><p><b>San Miguel Brewery 2017</b> (₱ millions, ending balances, from the deck's statements): net income 20,711; sales 113,255; total assets 109,283; total equity 60,784.</p>${calc([['Profit margin = 20,711 ÷ 113,255','18.3%'],['Asset turnover = 113,255 ÷ 109,283','1.04'],['Equity multiplier = 109,283 ÷ 60,784','1.80'],['=ROE','≈ 34.1%']])}<p>Much stronger than the typical company: high margins <i>and</i> good turnover, with moderate leverage. Reported EPS was ₱1.31 (₱1.12 the year before).</p></div>
<div class="tip"><p>Profit margin is driven by the <b>gross profit rate</b> and the <b>operating-expenses-to-sales ratio</b>. High-volume businesses (groceries) have low margins but high turnover; low-volume ones (jewellers) the reverse. EPS isn't comparable across companies (share counts differ widely); payout ratios are low in fast-growing firms that reinvest.</p></div>`},
{t:'The eyeball technique and the Altman Z-score',lo:7,h:`
${kt('Eyeball technique','Altman Z-score')}
<p class="lead">The <b>eyeball technique</b> — developed by Prof. Eliseo A. Aurellado of the Ateneo Graduate School of Business and enhanced by Prof. John Michael Angelo Z. Lopo — is a "quick and dirty" health check. It doesn't replace full analysis; it tells you where to look.</p>
<h2>Profitability — steps 1–6</h2>
<ol class="steps"><li>Look at the current bottom line in the statement of comprehensive income. Income or loss?</li><li>Compare it with the previous year.</li><li>Look for significant changes. Why?</li><li>Look at retained earnings. Positive or deficit?</li><li>Look at total stockholders' equity. Positive or capital-deficient?</li><li>Look at cash flow from operating activities. Positive or negative?</li></ol>
<h2>Liquidity and solvency — steps 7–10</h2>
<ol class="steps"><li>Compare current assets with current liabilities. Is the ratio about <b>2:1</b>?</li><li>Compare cash + receivables with current liabilities. About <b>1:1</b>?</li><li>Compare debt with equity. Too much debt?</li><li>Look at investing and financing cash flows. Is cash coming from selling fixed assets and borrowing, with no new capital?</li></ol>
<p>Repeat for the previous year — any significant changes, and why? Then assess the <b>operating cycle</b> (days in inventory + days in receivables, both years), followed by refined ratios (DuPont, common-size, trends), the <b>notes</b>, industry benchmarks and other information.</p>
<div class="case" data-t="Eyeballing San Miguel Brewery, 2017 (₱ millions)">${tbl(['Step','Finding'],[['1–3 Bottom line','Net income 20,711, up from 17,658 (+17%); sales up 16.6%'],['4–5 Equity','Retained earnings 44,086 (positive); total equity 60,784 — no capital deficiency'],['7 Current ratio','38,953 ÷ 12,717 = 3.06 (above 2:1)'],['8 Quick','(26,297 + 4,995) ÷ 12,717 = 2.46 (above 1:1)'],['9 Debt vs equity','Liabilities 48,499 vs equity 60,784 — less debt than equity']],{cls:'stack'})}<p>Verdict: profitable, liquid and solvent. (Step 6 and 10 need the cash-flow statement, which isn't in the deck.)</p></div>
<h2>Altman Z-score</h2>
<p>Developed by Prof. Edward Altman (NYU Stern), the Z-score combines five ratios, derived from empirical data, to predict <b>bankruptcy within about two years</b>. The version for <b>private (manufacturing) companies</b>:</p>
${tbl(['Ratio','× Weight'],[['Working capital ÷ Total assets','0.717'],['Retained earnings ÷ Total assets','0.847'],['EBIT ÷ Total assets','3.107'],['Book value of equity ÷ Total liabilities','0.420'],['Sales ÷ Total assets','0.998']],{num:[1]})}
<p><b>Zones (private manufacturers):</b> 2.9 or above — bankruptcy not likely; 1.23 to 2.9 — grey area; below 1.23 — bankruptcy likely. The deck gives 2.5 and 1.10 as the cut-offs for private general firms.</p>
<div class="ex" data-t="San Miguel Brewery, 2017 — the deck's computation">${tbl(['Component','Deck\'s inputs','Score'],[['X1','38,953 ÷ 109,283 × 0.717','0.26'],['X2','44,086 ÷ 109,283 × 0.847','0.34'],['X3','29,088 ÷ 109,283 × 3.107','0.83'],['X4','(15.36 billion shares × ₱20) ÷ 48,499 × 0.420','2.66'],['X5','113,255 ÷ 109,283 × 0.998','1.03'],['Z','','5.11']],{num:[2],tot:true})}</div>
<div class="fix"><p>Two inputs in the deck don't match its own formulas. <b>X1</b> uses total current assets (38,953) instead of working capital (38,953 − 12,717 = 26,236). <b>X4</b> uses shares × ₱20 (a market-type value) instead of the <b>book</b> value of equity (60,784). Recomputed with the formulas as written:</p>${calc([['X1 = 26,236 ÷ 109,283 × 0.717','0.17'],['X2','0.34'],['X3 (deck uses income before tax 29,088 as its EBIT proxy)','0.83'],['X4 = 60,784 ÷ 48,499 × 0.420','0.53'],['X5','1.03'],['=Z','2.90']])}<p>Still at the "not likely" threshold (2.9), but far closer than 5.11. Using true EBIT (29,088 + interest 2,283 = 31,371) gives X3 = 0.89 and Z ≈ 2.97. Ask your lecturer which version they expect in exams.</p></div>`},
{t:'Limitations of financial statement analysis',lo:8,h:`
<p class="lead">Horizontal, vertical and ratio analysis drive big decisions, but they are only as good as the statements behind them. Five cautions:</p>
${tbl(['Limitation','Why it matters'],[['<b>Estimates</b>','Allowances for bad debts, depreciation, warranty costs and contingent losses are estimates; if they\'re wrong, so are the ratios'],['<b>Cost</b>','Historical cost isn\'t adjusted for inflation; old PPE may be far below market value, so comparisons across years can mislead'],['<b>Alternative accounting methods</b>','FIFO vs LIFO (or average), different depreciation methods — current ratios and margins may not be comparable, and adjusting for differences is hard'],['<b>Atypical data</b>','Year-end often falls at a company\'s lowest activity or inventory point, so year-end balances may not be typical of the year'],['<b>Diversification</b>','Companies operating in many industries are hard to compare with any single industry average']],{cls:'stack'})}
<h2>Earning power and irregular items</h2>
<p>The deck's preview also lists <b>discontinued operations</b>, <b>extraordinary items</b>, <b>changes in accounting principle</b> and <b>comprehensive income</b> — items analysts separate out to judge sustainable "earning power." Kellogg's statement shows one: the <b>cumulative effect of an accounting change</b> (−$18.0M), reported net of tax below income from continuing items.</p>
<div class="fix"><p>Under current Philippine standards: <b>PAS 1 prohibits</b> presenting any item as "extraordinary"; <b>PFRS 5</b> requires discontinued operations to be shown separately; and under <b>PAS 8</b> a change in accounting policy is applied <b>retrospectively</b> (prior years restated), not as a "cumulative effect" line. Other comprehensive income (e.g. San Miguel Brewery's ₱613M in 2017) appears in the statement of comprehensive income below net income.</p></div>
<div class="tip"><p>The module's assignment is excellent exam practice: take a real company's statements (the SEC and the PSE publish them), do horizontal and vertical analysis, assess liquidity, solvency and profitability, and optionally compute the Z-score.</p></div>`}
],

const BOX={tip:['Exam Tip','!'],ex:['Example','E'],case:['Case in Point','C'],warn:['Watch Out','!'],deep:['Going Deeper','+'],ph:['Philippine Angle','P'],fix:['Slide Check','✓'],kt:['Key Terms','K']};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GL={}; // lower term -> {t,d,c}
for(const ch of CH){for(const [t,d] of Object.entries(ch.terms)){const k=t.toLowerCase();if(!GL[k])GL[k]={t,d,c:ch.n}}}
function decorate(html,ch,counter){
  const tp=document.createElement('template');tp.innerHTML=html;const r=tp.content;
  for(const [cls,[lab,ic]] of Object.entries(BOX)){
    for(const el of $$('.'+cls,r)){
      el.classList.add('box');
      if(cls==='kt'){
        const ts=(el.dataset.terms||'').split('|').filter(Boolean);
        el.innerHTML='<dl>'+ts.map(t=>{const g=ch.terms[t]||(GL[t.toLowerCase()]||{}).d||'';return `<dt>${esc(t)}</dt><dd>${g}</dd>`}).join('')+'</dl>';
      }
      let title=lab;
      if(cls==='ex'){counter.ex++;title=`Example ${ch.n}.${counter.ex}`+(el.dataset.t?` — ${el.dataset.t}`:'')}
      else if(el.dataset.t)title+=` — ${el.dataset.t}`;
      el.insertAdjacentHTML('afterbegin',`<div class="bh"><i>${ic}</i>${esc(title)}</div>`);
    }
  }
  for(const t of $$('table',r)){if(!(t.parentElement&&t.parentElement.classList.contains('tw'))){const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)}
    if(t.classList.contains('stack')){const hd=[...(t.rows[0]?.cells||[])].map(c=>c.textContent);for(const row of [...t.rows].slice(1))[...row.cells].forEach((c,i)=>c.dataset.l=hd[i]||'')}}
  const d=document.createElement('div');d.appendChild(r);return d.innerHTML;
}
const SEQ=[];
for(const ch of CH){
  const cnt={ex:0};
  ch.why=decorate(ch.why,ch,{ex:0});
  ch.lessons.forEach((l,i)=>{l.h=decorate(l.h,ch,cnt);l.id=`c${ch.n}-${i+1}`;l.num=`${ch.n}.${i+1}`});
  ch.pages=[{id:`c${ch.n}`,type:'open',ch,label:'Chapter opener'},...ch.lessons.map((l,i)=>({id:l.id,type:'les',ch,l,i,label:`${l.num} ${l.t}`})),{id:`c${ch.n}-review`,type:'rev',ch,label:'Review & Practice'}];
  SEQ.push(...ch.pages);
}
const BYID=Object.fromEntries(SEQ.map((p,i)=>[p.id,Object.assign(p,{idx:i})]));
/* ================= state ================= */
const store={get(k,d){try{const v=localStorage.getItem('fa-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fa-'+k,JSON.stringify(v))}catch(e){}}};
const visited=new Set(store.get('visited',[]));
let mode=store.get('mode','sec');
const best=store.get('best',{});
let CUR=null, renderedChapter=null;
function markVisited(id){if(!visited.has(id)){visited.add(id);store.set('visited',[...visited]);refreshTicks()}}

/* ================= shell ================= */
const app=$('#app');
app.innerHTML=`<header class="bar">
 <a class="home" href="#home" aria-label="Home"><i id="chb">FA</i><span id="bt">Financial Accounting</span></a>
 <div class="wrap-rel"><button class="bbtn" id="mbtn" aria-expanded="false" aria-haspopup="true">☰ <span class="hide-s">Lessons</span></button><div class="pop menu" id="menu" hidden></div></div>

 <button class="bbtn" id="next" aria-label="Next page">›</button>

 <button class="bbtn" id="tbtn" aria-label="Switch to night mode" title="Day / night mode">☾</button>
 <div class="wrap-rel"><button class="bbtn" id="pbtn" aria-expanded="false">PDF</button><div class="pop pdfm" id="pmenu" hidden>

</header>
<div class="layout" id="layout"><nav class="side" id="side" aria-label="Chapter outline"></nav><main id="main"></main></div><div id="pdfsrc" aria-hidden="true" style="position:absolute;left:-9999px;top:0;width:720px"></div>`;

{const saved=store.get('theme',null);applyTheme(saved||curTheme())}

$('#mSec').setAttribute('aria-pressed',mode==='sec');$('#mScr').setAttribute('aria-pressed',mode==='scroll');
/* ================= renderers ================= */
function openerHTML(ch,inScroll){

  <h2>Learning Objectives</h2><ol class="los">${ch.los.map((l,i)=>`<li><b>LO${i+1}</b><span>${l}</span></li>`).join('')}</ol>
  <h2>Why this matters</h2>${ch.why}
  ${inScroll?'':`<a class="start" href="#${first.id}">${d?'Continue':'Start'} chapter →</a>`}
  <div class="toc">${ch.pages.slice(1).map(p=>`<a href="#${p.id}"><span>${p.type==='les'?p.l.num:'✓'}</span><span>${esc(p.type==='les'?p.l.t:p.label)}</span><span class="tick" style="margin-left:auto">${visited.has(p.id)?'✓':''}</span></a>`).join('')}</div>`;
}
function lessonHTML(ch,l){return `<div class="crumb"><span>Chapter ${ch.n} · ${esc(ch.title)}</span>${l.lo?`<span class="lotag">LO${l.lo}</span>`:''}</div><h1 class="lt"><span>${l.num}</span> ${esc(l.t)}</h1>${l.h}`}
function reviewHTML(ch,print){
  const sum=`<h2>Summary</h2>`+ch.sum.map((s,i)=>`<div class="sumlo"><b>LO${i+1}</b><div>${s}</div></div>`).join('');

  if(print)return `<h1 class="lt">Review — Chapter ${ch.n}</h1>${sum}${kt}`;
  return `<div class="crumb"><span>Chapter ${ch.n} · ${esc(ch.title)}</span></div><h1 class="lt"><span>✓</span> Review &amp; Practice</h1>
  <div class="tabs" role="tablist">${['Summary','Key Terms','Multiple Choice','Short Answer','Problems'].map((t,i)=>`<button role="tab" aria-selected="${i===0}" data-tab="${i}">${t}</button>`).join('')}</div>
  <div data-pane="0">${sum.replace('<h2>Summary</h2>','')}</div>
  <div data-pane="1" hidden>${kt.replace('<h2>Key Terms</h2>','')}</div>
  <div data-pane="2" hidden class="noterm"><div class="score" data-score><span>Score: 0 / 0</span><button class="bbtn" data-reset>Reset</button></div>
   ${ch.mcq.map((m,i)=>`<div class="mcq" data-q="${i}"><div class="q">${i+1}. ${m[0]}</div>${m[1].map((o,j)=>`<button class="o" data-o="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<div class="fb" hidden></div></div>`).join('')}</div>
  <div data-pane="3" hidden>${ch.sa.map((s,i)=>`<div class="reveal"><div><b class="sans">Q${i+1}.</b> ${s[0]}</div><details><summary>Show model answer</summary><div class="ans">${s[1]}</div></details></div>`).join('')}</div>
  <div data-pane="4" hidden>${ch.prob.map((s,i)=>`<div class="reveal"><div><b class="sans">Problem ${i+1}.</b> ${s[0]}</div><details><summary>Show worked solution</summary><div class="ans">${s[1]}</div></details></div>`).join('')}</div>`;
}
function pnHTML(p){
  const a=SEQ[p.idx-1],b=SEQ[p.idx+1];
  const lab=q=>q.type==='open'?`Chapter ${q.ch.n}: ${q.ch.title}`:q.type==='rev'?`Chapter ${q.ch.n} Review & Practice`:`${q.l.num} ${q.l.t}`;
  return `<div class="pn">${a?`<a href="#${a.id}"><small>‹ Previous</small>${esc(lab(a))}</a>`:'<span></span>'}${b?`<a class="nx" href="#${b.id}"><small>Next ›</small>${esc(lab(b))}</a>`:''}</div>`;
}
function pageBody(p){return p.type==='open'?openerHTML(p.ch,mode==='scroll'):p.type==='les'?lessonHTML(p.ch,p.l):reviewHTML(p.ch)}
function sideHTML(ch){return `<h4>Chapter ${ch.n}</h4><div class="ct">${esc(ch.title)}</div>`+ch.pages.map(p=>`<a href="#${p.id}" data-id="${p.id}"><span class="tick">${visited.has(p.id)?'✓':''}</span><span>${esc(p.type==='open'?'Opener & objectives':p.label)}</span></a>`).join('')+`<a class="all" href="#home">← All chapters</a>`}
function homeHTML(){
  const tot=SEQ.filter(p=>p.type!=='open').length,done=SEQ.filter(p=>p.type!=='open'&&visited.has(p.id)).length;
  return `<div class="hero"><h1>Financial Accounting, explained from scratch</h1><p>Ten textbook chapters built from your lecture decks — every term explained in plain English, every slide example worked step by step, with practice at the end of each chapter.</p>
  <div class="stats"><div><b>${done} / ${tot}</b>pages read</div><div><b>${CH.reduce((a,c)=>a+c.lessons.length,0)}</b>lessons</div><div><b>${CH.reduce((a,c)=>a+c.mcq.length,0)}</b>practice questions</div></div></div>
  <div class="grid">${CH.map(ch=>{const [d,t]=chProgress(ch);const b=best[ch.n];return `<a class="card" href="#c${ch.n}" style="--c:${ch.color}"><div class="top"><b>${ch.n}</b><span>${esc(ch.title)}</span></div><div class="bot"><p>${esc(ch.hook)}</p><div class="meter" role="img" aria-label="${d} of ${t} pages read"><i style="width:${Math.round(d/t*100)}%"></i></div><div class="row"><span>${d}/${t} pages read</span><span>${b!=null?`Quiz best ${b}/${ch.mcq.length}`:`${ch.lessons.length} lessons`}</span></div></div></a>`}).join('')}</div>`;
}
/* ================= glossary underline + popups ================= */
const termKeys=Object.keys(GL).sort((a,b)=>b.length-a.length);
const TRX=new RegExp('(?<![\\w-])('+termKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?:s|es)?(?![\\w-])','gi');
const SKIP='h1,h2,h3,h4,a,button,.kt,.bh,.gl,svg,summary,.noterm,dt,th,.plate,.crumb,.toc,.lotag,script,style';
function underline(root){
  const used=new Set();
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim().length<3||n.parentElement.closest(SKIP)?2:1});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){
    const s=n.nodeValue;TRX.lastIndex=0;let m,last=0,frag=null;
    while((m=TRX.exec(s))){const k=m[1].toLowerCase();if(used.has(k))continue;used.add(k);
      frag=frag||document.createDocumentFragment();frag.append(s.slice(last,m.index));
      const sp=document.createElement('span');sp.className='gl';sp.tabIndex=0;sp.dataset.k=k;sp.textContent=m[0];frag.append(sp);last=m.index+m[0].length}
    if(frag){frag.append(s.slice(last));n.replaceWith(frag)}
  }
}
const tip=document.createElement('div');tip.className='gtip';tip.hidden=true;tip.setAttribute('role','tooltip');document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GL[el.dataset.k];if(!g)return;tipFor=el;tip.innerHTML=`<b>${esc(g.t)}</b>${g.d}`;tip.hidden=false;
  const r=el.getBoundingClientRect();const tw=Math.min(300,innerWidth-16);tip.style.maxWidth=tw+'px';
  let x=Math.max(8,Math.min(r.left+scrollX,scrollX+innerWidth-tw-8));tip.style.left=x+'px';
  const th=tip.offsetHeight;let y=r.bottom+scrollY+8;if(r.bottom+th+12>innerHeight)y=r.top+scrollY-th-8;tip.style.top=y+'px'}
function hideTip(){tip.hidden=true;tipFor=null}
document.addEventListener('mouseover',e=>{const g=e.target.closest?.('.gl');if(g)showTip(g);else if(tipFor&&!e.target.closest?.('.gtip'))hideTip()});
document.addEventListener('focusin',e=>{const g=e.target.closest?.('.gl');if(g)showTip(g)});
document.addEventListener('click',e=>{const g=e.target.closest('.gl');if(g){if(tipFor===g)hideTip();else showTip(g)}else if(tipFor)hideTip()},true);
addEventListener('scroll',()=>{if(tipFor)hideTip()},{passive:true});
/* ================= review wiring ================= */
function wireReview(root,ch){
  for(const tb of $$('[data-tab]',root))tb.onclick=()=>{for(const b of $$('[data-tab]',root))b.setAttribute('aria-selected',b===tb);for(const p of $$('[data-pane]',root))p.hidden=p.dataset.pane!==tb.dataset.tab};
  const ans={};
  const upd=()=>{const n=Object.keys(ans).length,c=Object.values(ans).filter(Boolean).length;const s=$('[data-score] span',root);if(s)s.textContent=`Score: ${c} / ${n} answered · ${ch.mcq.length} questions`;
    if(n===ch.mcq.length&&(best[ch.n]==null||c>best[ch.n])){best[ch.n]=c;store.set('best',best)}};
  for(const q of $$('.mcq',root)){const i=+q.dataset.q,m=ch.mcq[i];
    for(const b of $$('.o',q))b.onclick=()=>{const j=+b.dataset.o;if(i in ans)return;ans[i]=j===m[2];
      for(const o of $$('.o',q)){o.disabled=true;if(+o.dataset.o===m[2])o.classList.add('ok')}if(j!==m[2])b.classList.add('no');
      const fb=$('.fb',q);fb.hidden=false;fb.innerHTML=`<b class="sans">${j===m[2]?'Correct.':'Not quite — the answer is '+String.fromCharCode(65+m[2])+'.'}</b> ${m[3]}`;upd()}}
  const rs=$('[data-reset]',root);if(rs)rs.onclick=()=>{for(const k in ans)delete ans[k];for(const q of $$('.mcq',root)){for(const o of $$('.o',q)){o.disabled=false;o.classList.remove('ok','no')}const f=$('.fb',q);f.hidden=true}upd()};
}
/* ================= routing ================= */
let io=null;
function setAccent(ch){document.documentElement.style.setProperty('--acc',ch?ch.color:'#0b5d63');$('#chb').textContent=ch?ch.n:'FA';$('#bt').textContent=ch?ch.title:'Financial Accounting';document.title=ch?`Ch ${ch.n} · ${ch.title}`:'Financial Accounting Study Text'}
function updNav(){$('#prev').disabled=!CUR||CUR.idx===0;$('#next').disabled=CUR&&CUR.idx===SEQ.length-1;$('#pbtn').disabled=!CUR;
  for(const a of $$('a[data-id]',side))a.classList.toggle('cur',CUR&&a.dataset.id===CUR.id)}
function route(force){
  const h=location.hash.slice(1);const p=BYID[h];
  if(io){io.disconnect();io=null}
  if(!p){CUR=null;renderedChapter=null;setAccent(null);layout.classList.remove('has-side');side.innerHTML='';main.innerHTML=homeHTML();updNav();scrollTo(0,0);return}
  CUR=p;setAccent(p.ch);layout.classList.add('has-side');
  if(mode==='sec'){
    renderedChapter=null;side.innerHTML=sideHTML(p.ch);
    main.innerHTML=`<article class="page sec" id="s-${p.id}">${pageBody(p)}${pnHTML(p)}</article>`;
    underline($('.sec',main));if(p.type==='rev')wireReview(main,p.ch);
    if(p.type!=='open')markVisited(p.id);updNav();scrollTo(0,0);return;
  }
  if(renderedChapter!==p.ch.n||force){
    renderedChapter=p.ch.n;side.innerHTML=sideHTML(p.ch);
    const last=p.ch.pages[p.ch.pages.length-1];
    main.innerHTML=`<div class="page">`+p.ch.pages.map((q,i)=>`<section class="sec ${i?'chsec':''}" id="s-${q.id}" data-id="${q.id}">${pageBody(q)}</section>`).join('')+pnHTML(last)+`</div>`;
    for(const s of $$('.sec',main))underline(s);wireReview(main,p.ch);
  }
  updNav();
  const el=$('#s-'+p.id);if(el)el.scrollIntoView({block:'start'});
  io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){const q=BYID[e.target.dataset.id];if(q&&q!==CUR){CUR=q;history.replaceState(null,'','#'+q.id);updNav()}if(q&&q.type!=='open')markVisited(q.id)}},{rootMargin:'-30% 0px -60% 0px'});
  for(const s of $$('.sec',main))io.observe(s);
}
addEventListener('hashchange',()=>route());
/* ================= toast ================= */
let tt;function toast(m,ms=3500){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ms)}
/* ================= PDF ================= */
const dlP=(window.claude&&typeof claude.use==='function')?claude.use('downloads').catch(()=>null):Promise.resolve(null);
const REPL={'₱':'P','→':'->','←':'<-','−':'-','≥':'>=','≤':'<=','≈':'~','✓':'v','✗':'x','×':'×','√':'sqrt','Δ':'change in ','·':'·','′':"'",'″':'"',' ':' ',' ':' ',' ':' ','‑':'-','≠':'!=','÷':'÷','½':'1/2','⅓':'1/3','¼':'1/4'};
const FN={R:'Times-Roman',B:'Times-Bold',I:'Times-Italic',H:'Helvetica',HB:'Helvetica-Bold'};
const FID={R:'F1',B:'F2',I:'F3',H:'F4',HB:'F5'};
function norm(s){let o='';for(const c of s){const r=REPL[c];o+=r!=null?r:c}return o}
function code(c){const cp=c.codePointAt(0);if(cp>=32&&cp<127)return cp;const e=PDFENC[cp];return e!=null?e:63}
function tw(s,f,sz){let w=0;const a=PDFW[FN[f]];for(const c of s){const k=code(c);w+=(a[k-32]||500)}return w/1000*sz}
function pstr(s){let o='(';for(const c of s){const k=code(c);if(k===40||k===41||k===92)o+='\\'+String.fromCharCode(k);else if(k<32||k>126)o+='\\'+k.toString(8).padStart(3,'0');else o+=String.fromCharCode(k)}return o+')'}
function hex(c){c=c.replace('#','');if(c.length===3)c=[...c].map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(c.substr(i,2),16)/255)}
function mix(c,t){return hex(c).map(v=>1-(1-v)*t)}
const rgb=a=>a.map(v=>v.toFixed(3)).join(' ');
async function makePDF(scope){
  const p=CUR,ch=p.ch;
  let html='',title='';
  const les=l=>`<h2 class="pl">${l.num} ${esc(l.t)}</h2>${l.h}`;
  const op=()=>`<h2 class="pl">Learning objectives</h2>${ch.los.map((l,i)=>`<p><b>LO${i+1}</b> ${l}</p>`).join('')}`;
  if(scope==='chapter'){html=op()+ch.lessons.map(les).join('')+reviewHTML(ch,true).replace('<h1 class="lt">','<h2 class="pl">').replace('</h1>','</h2>');title=`Ch${String(ch.n).padStart(2,'0')}-${ch.title}`}
  else if(p.type==='open'){html=op()+`<h2 class="pl">Why this matters</h2>`+ch.why;title=`Ch${ch.n}-Opener`}
