<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Accounting Study Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>/*
VOICE: a calm, well-made textbook — patient, plain-spoken, exact with numbers.
IDEA: a bound McGraw-Hill-style chapter: openers, margin notes, numbered examples, ruled ledgers.
PICTURE: each chapter's opener is a coloured title plate with a big chapter numeral; journal entries look like real ledger paper.
COLOUR and TYPE: white page, near-black ink, one accent per chapter; Source Serif 4 body, Archivo headings.
LAYOUT: sticky top bar, left outline on wide screens, 70-character text column with margin boxes floating right.
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14161a);--ink:light-dark(#1b1d22,#e7e6e2);--mut:light-dark(#5d6169,#a2a5ab);--line:light-dark(#dfe1e4,#2e3238);--soft:light-dark(#f4f5f6,#1c1f24);--acc:#0b5d63;--accs:light-dark(color-mix(in srgb,var(--acc) 9%,#fff),color-mix(in srgb,var(--acc) 22%,#14161a));--bar:light-dark(#ffffffee,#14161aee);--sans:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif}
:root{--acct:color-mix(in srgb,var(--acc) 72%,var(--ink))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.62 var(--serif);overflow-x:clip}
h1,h2,h3,h4,.sans,button,select,.bar,.side,.card,.tabs{font-family:var(--sans)}
a{color:var(--acct)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* top bar */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:6px;padding:8px max(2vw,10px);background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:15px}
.bar .home{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .home i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--acc);color:#fff;font-style:normal;font-size:14px;flex:none}
.bar .home span{overflow:hidden;text-overflow:ellipsis}
.bbtn{min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bbtn:hover{border-color:var(--acct)}
.bbtn[disabled]{opacity:.35;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 11px;border:0;background:var(--bg);color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px #0003;z-index:60}
.wrap-rel{position:relative}
.menu{width:min(420px,94vw);max-height:min(72vh,640px);overflow:auto;padding:8px}
.menu details{border-bottom:1px solid var(--line)}
.menu summary{list-style:none;cursor:pointer;padding:9px 8px;font-weight:700;display:flex;gap:8px;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu summary b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;color:#fff;font-size:13px}
.menu a{display:flex;gap:8px;padding:7px 8px 7px 42px;color:var(--ink);text-decoration:none;font-size:14.5px;border-radius:6px}
.menu a:hover,.menu a.cur{background:var(--soft)}
.tick{width:16px;flex:none;color:#1a8a4a;font-weight:800}
.pdfm{width:250px;padding:8px}
.pdfm button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--ink);min-height:44px}
.pdfm button:hover{background:var(--soft)}
.pdfm small{display:block;color:var(--mut);font-size:12.5px}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{display:none}
@media(min-width:1000px){.layout.has-side{grid-template-columns:260px minmax(0,1fr)}.layout.has-side .side{display:block;position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);overflow:auto;padding:22px 10px 40px 18px;border-right:1px solid var(--line);font-size:14px}}
.side h4{margin:0 0 4px;font-size:12.5px;color:var(--mut);font-weight:600}
.side .ct{font-weight:800;font-size:16px;line-height:1.25;margin:0 0 12px;color:var(--acct)}
.side a{display:flex;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;line-height:1.3}
.side a:hover{background:var(--soft)}
.side a.cur{background:var(--accs);font-weight:700;box-shadow:inset 3px 0 var(--acc)}
.side .all{margin-top:16px;color:var(--mut)}
main{padding:clamp(18px,3vw,40px) max(4vw,16px) 80px}
.page{max-width:780px;margin:0 auto}
/* home */
.hero{max-width:1100px;margin:0 auto 26px;display:grid;gap:18px}
.hero h1{font-size:clamp(32px,5vw,50px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mut);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--sans);font-size:14px;color:var(--mut)}
.stats b{color:var(--ink);font-size:20px;display:block}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .top{background:var(--c);color:#fff;padding:16px 18px 14px;display:flex;align-items:flex-end;gap:12px;min-height:96px}
.card .top b{font-size:46px;line-height:.85;font-weight:800;opacity:.95}
.card .top span{font-weight:700;font-size:18px;line-height:1.2}
.card .bot{padding:12px 18px 16px;display:grid;gap:10px;flex:1}
.card .bot p{margin:0;font:15px/1.45 var(--serif);color:var(--mut)}
.meter{height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:9px}
.card .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
/* opener */
.plate{background:var(--acc);color:#fff;border-radius:16px;padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;align-items:end;margin-bottom:26px}
.plate .num{font:800 clamp(72px,12vw,132px)/.8 var(--sans);opacity:.9}
.plate .lab{font:600 14px var(--sans);opacity:.85}
.plate h1{margin:2px 0 6px;font-size:clamp(30px,4.6vw,46px);line-height:1.05;text-wrap:balance}
.plate p{margin:0;font-size:18px;opacity:.95;font-style:italic}
@media(max-width:600px){.plate{grid-template-columns:1fr}.plate .num{font-size:72px}}
.los{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px}
.los li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:baseline}
.los b{font:800 14px var(--sans);color:var(--acct);border:2px solid var(--acc);border-radius:6px;text-align:center;padding:1px 0}
.start{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:700;font-size:17px;text-decoration:none;margin:10px 0 26px}
.toc{border-top:1px solid var(--line);margin-top:8px}
.toc a{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-family:var(--sans)}
.toc a span:first-child{color:var(--acct);font-weight:800;min-width:40px}
/* lesson */
.crumb{font:600 13.5px var(--sans);color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.lotag{color:var(--acct);border:1.5px solid var(--acc);border-radius:5px;padding:0 6px;font-weight:800}
.page h1.lt{font-size:clamp(28px,4vw,40px);line-height:1.08;margin:0 0 18px;text-wrap:balance}
.page h1.lt span{color:var(--acct)}
.page h2{font-size:22px;line-height:1.2;margin:30px 0 8px}
.page h3{font-size:18px;margin:22px 0 6px}
.page p{margin:0 0 14px}
.page ul,.page ol{padding-left:1.3em;margin:0 0 14px}
.page li{margin:3px 0}
.lead{font-size:19px;color:var(--mut)}
/* boxes */
.box{border-radius:10px;padding:12px 16px 4px;margin:18px 0;background:var(--soft);border-left:5px solid var(--bc,#888);display:flow-root}
.box .bh{font:800 13px var(--sans);color:color-mix(in srgb,var(--bc) 72%,var(--ink));margin-bottom:4px;display:flex;gap:7px;align-items:center}
.box .bh i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bc);color:#fff;font-size:12px}
.box p,.box ul,.box ol{font-size:16px}
.tip{--bc:#b5179e}.ex{--bc:var(--acc);background:var(--accs)}.case{--bc:#3d5a80}.warn{--bc:#c1121f}.deep{--bc:#6a4c93}.ph{--bc:#0038a8}.fix{--bc:#b7791f}
.kt{--bc:var(--acc);background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--acc);border-left-width:1px;font-size:14.5px;line-height:1.45}
.kt dl{margin:0 0 8px}.kt dt{font:700 14px var(--sans)}.kt dd{margin:0 0 7px}
@media(min-width:760px){.kt{float:right;width:230px;margin:4px 0 12px 18px;clear:right;padding:10px 12px 2px}}
@media(min-width:1400px){.layout{max-width:1440px}.page{max-width:1040px;padding-right:256px}.kt{margin-right:-256px;width:236px}}
/* tables & entries */
.tw{overflow-x:auto;margin:14px 0 18px;display:flow-root}
table{border-collapse:collapse;width:100%;font:14.5px/1.4 var(--sans)}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
table.je{font-family:var(--sans);background:light-dark(#fbfcfd,#191c21)}
table.je td{border-bottom:1px dashed var(--line)}
table.je td.cr{padding-left:2.2em}
table.je td.ex2{color:var(--mut);font-style:italic;padding-left:2.2em}
.stack td.n{white-space:normal}
figure{margin:18px 0;text-align:center;display:flow-root}
figure svg{max-width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--ink)}svg .a{fill:var(--acc)}svg .al{fill:var(--accs)}svg .as{stroke:var(--acc);fill:none}svg .ln{stroke:var(--mut);fill:none}svg text.wt,svg .w{fill:#fff}svg text.mu{fill:var(--mut)}svg .sf{fill:var(--soft)}svg .st{stroke:var(--mut)}
figcaption{font:13.5px var(--sans);color:var(--mut);margin-top:6px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font:800 14px/28px var(--sans);text-align:center}
.calc{font-family:var(--sans);font-size:15.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0 12px}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.calc div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .t{border-top:1.5px solid var(--ink);font-weight:800;margin-top:3px;padding-top:4px}
.xl{font-family:var(--sans);font-size:14px;font-weight:700;text-decoration:none;border-bottom:1.5px solid}
/* glossary popups */
.gl{border-bottom:1.5px dotted var(--acc);cursor:help}
.gtip{position:absolute;z-index:80;max-width:300px;background:var(--ink);color:var(--bg);font:14px/1.45 var(--sans);padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px #0004;pointer-events:none}
.gtip b{display:block;margin-bottom:2px}
/* prev / next */
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:40px;font-family:var(--sans)}
.pn a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink);min-height:44px}
.pn a:hover{border-color:var(--acct)}
.pn small{display:block;color:var(--mut);font-size:12.5px}
.pn .nx{text-align:right}
/* review */
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line);margin:10px 0 20px}
.tabs button{border:0;background:none;padding:10px 12px;min-height:44px;color:var(--mut);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--acct);border-color:var(--acct)}
.score{position:sticky;top:62px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accs);border-radius:10px;padding:8px 14px;font:700 15px var(--sans);margin-bottom:14px}
.mcq{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.mcq .q{font-weight:600;margin-bottom:8px}
.mcq button.o{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;min-height:44px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--serif)}
.mcq button.o:hover:not([disabled]){border-color:var(--acct)}
.mcq button.ok{border-color:#1a8a4a;background:light-dark(#e8f6ee,#163323)}
.mcq button.no{border-color:#c1121f;background:light-dark(#fdecee,#3a1a1d)}
.mcq .fb{margin-top:8px;font-size:15.5px;padding:8px 12px;border-radius:8px;background:var(--soft)}
.reveal{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.reveal summary{cursor:pointer;font:700 14px var(--sans);color:var(--acct);margin-top:8px;min-height:32px}
.reveal .ans{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.sumlo{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;margin-bottom:12px}
.sumlo b{font:800 14px var(--sans);color:var(--acct);border:2px solid var(--acc);border-radius:6px;text-align:center;height:max-content}
dl.gloss dt{font:700 16px var(--sans);margin-top:10px}dl.gloss dd{margin:2px 0 0}
.chsec{border-top:3px solid var(--acc);margin-top:46px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:15px var(--sans);padding:10px 16px;border-radius:10px;z-index:90;max-width:92vw;box-shadow:0 10px 30px #0004}
@media(max-width:700px){.hide-s{display:none}.bar{gap:4px}.bbtn{padding:0 9px}.seg button{padding:0 8px}}
@media(max-width:600px){body{font-size:16.5px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;font-weight:700}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
@media(max-width:600px){.bar .home span{display:none}.bar .home{margin-right:auto}.bbtn{min-width:40px;padding:0 8px}.seg button{padding:0 7px;font-size:13.5px}.pop{position:fixed;top:58px;left:8px;right:8px;width:auto}.menu{width:auto;max-height:75vh}.pdfm{width:auto}}

#tbtn{font-size:17px}
</style></head><body><div id="app"></div>

los:['Explain what accounting is, who uses it, and how it differs from bookkeeping and auditing.','Distinguish accounting concepts, conventions and principles, and describe GAAP (PAS/PFRS) and the Conceptual Framework.','Explain the five basic assumptions of accounting.','Apply the measurement, revenue recognition, expense recognition and full-disclosure principles.','Describe the accounting constraints and the qualitative characteristics of useful information.','Identify the basic financial statements, their elements, and real versus nominal accounts.'],
why:`<p>Imagine five people each describing the same basketball game, but every one of them uses a different scoring system. Nobody could compare anything. Accounting avoids that chaos by having everyone follow the <b>same set of ground rules</b>. This chapter is those ground rules.</p><p>Your lecturer's slides quote a CPA saying the basic concepts are "the real foundation" of every board-exam subject — and that is not an exaggeration. Every later chapter (adjusting entries, inventory, depreciation, cash flows) is just one of these principles applied to a specific situation. When you get stuck later, you'll usually find the answer by coming back here.</p>`,
terms:{
'Accounting':'An information system that identifies, records and communicates the economic events of an organisation to people who use that information to make decisions.',
'Bookkeeping':'The recording part of accounting — keeping a systematic, chronological record of transactions.',
'Auditing':'An independent examination of financial statements to check that they are presented fairly.',
'GAAP':'Generally Accepted Accounting Principles — the agreed rules, assumptions and procedures for measuring, recording and reporting financial activity.',
'PFRS':'Philippine Financial Reporting Standards — the official accounting standards in the Philippines, adopted from the international standards (IFRS).',
'PAS':'Philippine Accounting Standards — the older-numbered part of the PFRS family (e.g. PAS 1 on presenting financial statements).',
'IFRS':'International Financial Reporting Standards — global accounting standards issued by the IASB, used by over 140 jurisdictions.',
'Conceptual Framework':'The "constitution" of accounting: a coherent set of concepts (purpose, users, qualities, elements) that standard-setters build all the specific standards on.',
'Economic entity':'The assumption that a business is separate from its owners, so only the business\'s own transactions go in its books.',
'Going concern':'The assumption that a business will keep operating long enough to carry out its plans — it is not about to close down.',
'Monetary unit':'The assumption that money is the common measuring stick and that its value is stable (inflation is ignored).',
'Periodicity':'The time-period assumption: a business\'s life can be chopped into artificial periods (month, quarter, year) for reporting.',
'Accrual basis':'Recording revenue when earned and expenses when incurred, regardless of when cash moves.',
'Fiscal year':'Any 12-month accounting period; often used for a year that starts in a month other than January.',
'Calendar year':'A 12-month accounting period running January 1 to December 31.',
'Interim period':'An accounting period shorter than one year, such as a month or a quarter.',
'Historical cost':'Recording assets at what was actually paid for them (their acquisition price).',
'Fair value':'The price at which an asset could be exchanged, or a liability settled, between knowledgeable, willing parties in an arm\'s-length deal.',
'Revenue recognition principle':'Record revenue in the period it is earned — not simply when cash is received.',
'Matching principle':'Record expenses in the same period as the revenues they helped earn.',
'Full disclosure principle':'Financial statements must report all information that would make a difference to users, including notes and supplementary schedules.',
'Materiality':'An item is material if leaving it out or misstating it could change a user\'s decision.',
'Relevance':'Information is relevant if it can make a difference to a decision (it has predictive or confirmatory value).',
'Faithful representation':'Information shows what really happened: it is complete, neutral and free from error.',
'Predictive value':'Information helps users forecast future outcomes.',
'Confirmatory value':'Information helps users check or correct their earlier predictions.',
'Comparability':'Information can be compared across companies and across periods.',
'Verifiability':'Independent people using the same methods would reach the same result.',
'Timeliness':'Information reaches decision-makers in time to influence their decisions.',
'Understandability':'Information is presented clearly enough for a reasonably informed user to understand.',
'Asset':'A resource controlled by the entity as a result of past events, from which future economic benefits are expected.',
'Liability':'A present obligation of the entity, arising from past events, that will require an outflow of resources.',
'Equity':'The owners\' residual interest in the assets after deducting all liabilities (Assets − Liabilities).',
'Real accounts':'Permanent accounts — assets, liabilities and equity. Their balances carry forward and are not closed at period-end.',
'Nominal accounts':'Temporary accounts — revenues, expenses (and drawings). They are closed to zero at the end of each period.',
'Operating cycle':'The time it takes to buy inventory, sell it, and collect the cash.'},
lessons:[
{t:'What accounting is — and who uses it',lo:1,h:`
${kt('Accounting','Bookkeeping','Auditing')}
<p class="lead">Accounting is often called the <b>"language of business."</b> Just as English lets people share ideas, accounting lets a business tell outsiders what it owns, what it owes, and how well it did.</p>
<p>A simple definition: <b>accounting is an information system that identifies, records and communicates the economic events of an organisation to interested users.</b> Notice the three verbs — they happen in that order:</p>
<ol class="steps"><li><b>Identify</b> — decide which events are economic transactions (selling a service, yes; a manager's birthday, no).</li><li><b>Record</b> (measure) — put the event into the books in pesos, in date order.</li><li><b>Communicate</b> — summarise the records into financial statements and explain them.</li></ol>
<div class="tip"><p>A classic quiz item asks which process comes <i>first</i>: identifying, measuring, communicating or interpreting. The answer is <b>identifying</b> — you can't measure something you haven't recognised as a transaction yet.</p></div>
<h2>Bookkeeping vs accounting vs auditing</h2>
${tbl(['','What it does','Everyday comparison'],[['Bookkeeping','Records transactions accurately, in order','Writing every expense in a diary'],['Accounting','Records <i>and</i> classifies, summarises, analyses and interprets','Reading the diary and deciding how to budget next month'],['Auditing','An independent outsider checks that the statements are fair','A friend double-checking your budget before you show it to the bank']],{cls:'stack'})}
<p>So bookkeeping is one part of accounting. Your slides list another description to watch out for: accounting is <b>not</b> an "exact science" — it involves estimates and judgement (you'll see this with depreciation and bad debts).</p>
<h2>Who uses accounting information?</h2>
<p><b>Internal users</b> run the business: owners-managers, department heads, the finance team. <b>External users</b> are outside it: investors, lenders and other creditors (the <i>primary</i> users), plus suppliers, customers, employees and government agencies.</p>
<div class="ph"><p>Government users you will meet in Philippine exam questions: the <b>BIR</b> (Bureau of Internal Revenue — taxes), the <b>SEC</b> (Securities and Exchange Commission — registers and regulates corporations), and the <b>BSP</b> (Bangko Sentral ng Pilipinas — the central bank, which regulates banks). Your slides' quiz describes the BSP as regulating banks and import/export activity. Managers are <i>internal</i> users, so they are the usual "except" answer when a question lists external users.</p></div>
<h2>A very short history</h2>
<p>Double-entry bookkeeping — where every transaction is recorded on two sides — was described in print by the Italian friar <b>Luca Pacioli</b> in 1494, which is why he is called the "father of modern accounting." (Spelling matters on your quizzes: <i>Luca Pacioli</i>.) The slides note that internal and external reporting practices developed further during the <b>Industrial Revolution</b>, when large factories needed outside investors.</p>
<div class="warn"><p>Read quiz options slowly: your course's quizzes like near-identical distractors (Pacioli / Paciolo / Paciole; Florentine / Florentino).</p></div>
<h2>Businesses do three kinds of things</h2>
<p>Every business <b>finances</b> itself (gets money from owners or lenders), <b>invests</b> that money in assets (equipment, buildings), and <b>operates</b> (buys, sells, pays expenses). Keep these three words in mind — they come back as the three sections of the cash-flow statement in <a class="xl" href="#c9-1">Lesson 9.1</a>.</p>`},
{t:'Concepts, conventions, principles — and GAAP',lo:2,h:`
${kt('GAAP','PFRS','PAS','IFRS','Conceptual Framework')}
<p class="lead">Accounting rules come in three layers. Think of building a house: the ground it stands on, the building habits every carpenter follows, and the building code.</p>
${tbl(['Layer','What it is','Examples from the slides'],[['<b>Concepts</b> ("postulates", "assumptions")','Ideas accountants <i>assume</i> to be true before recording anything — the "bedrock"','Separate entity, going concern, time period, accrual, monetary unit'],['<b>Conventions</b>','Practices accepted because they have been used for so long; every transaction has a value received and a value given','Debit and credit; the dual-aspect concept'],['<b>Principles</b>','The rules of first importance; the basis for all detailed procedures','Cost, revenue recognition, matching, full disclosure']],{cls:'stack'})}
<p>Principles are different from <i>procedures, rules and methods</i>: procedures are the "how-to" details of recording, classifying, summarising and presenting a transaction, while principles are the "why."</p>
<h2>GAAP</h2>
<p><b>Generally Accepted Accounting Principles (GAAP)</b> is the umbrella name for the standard principles, assumptions and procedures that accountants use uniformly. They are developed from experience, research and careful study, and become "generally accepted" by agreement in the profession.</p>
<p>Why does GAAP matter? Because an auditor's report says the statements are presented "in conformity with" the applicable framework. If everyone used their own rules, that sentence would mean nothing.</p>
<div class="ph"><p>The GAAP used in the Philippines is the <b>PFRS</b> family, which includes the older-numbered <b>PAS</b> standards (for example, PAS 1 on presenting financial statements, PAS 2 on inventories, PAS 16 on property, plant and equipment). PFRS are adopted from the international standards (<b>IFRS</b>) by the Financial Reporting Standards Council. Your pre-midterm asked what the current Philippine standard is called; because PAS and PFRS are both in force and both come from IFRS, "all of the above" was the intended answer there.</p></div>
<h2>The Conceptual Framework</h2>
<p>The <b>Conceptual Framework for Financial Reporting</b> is the coherent system of concepts that flows from one objective: providing information that helps users make decisions. It is not itself a standard — it is the foundation that standard-setters use to write consistent standards, like a constitution that later laws must respect.</p>
<div class="deep"><p>Your Quiz 1 quoted the <b>2018 revised Conceptual Framework</b>: the primary users of general-purpose financial reports are <b>present and potential investors, lenders and other creditors</b>, who use the information to decide about (1) buying, selling or holding equity or debt, (2) providing or settling loans, and (3) voting on or influencing management's actions. All three statements are true.</p></div>`},
{t:'The five basic assumptions',lo:3,h:`
${kt('Economic entity','Going concern','Monetary unit','Periodicity','Accrual basis')}
<p class="lead">Before recording a single peso, accountants assume five things. If any of them is false, the numbers would be meaningless.</p>
<h2>1. Economic (separate) entity</h2>
<p>The business is treated as separate and distinct from the people who own and run it. If Ms. Atlo owns a clinic and buys groceries for her family, that purchase is <b>not</b> a clinic expense. This is what lets the books show a "true and fair" picture of the business alone.</p>
<h2>2. Going concern</h2>
<p>We assume the business will keep operating long enough to carry out its plans. That's why we can record a 10-year machine at cost and spread that cost over 10 years: we expect the business to still be here to use it. Your slides link this to two conventions:</p>
<ul><li><b>Objectivity</b> — measurements must be definite and verifiable.</li><li><b>Historical cost</b> — supports objectivity by using the actual purchase price.</li></ul>
<div class="warn"><p>If a business is about to liquidate (close down and sell everything), the going-concern assumption no longer holds, and assets would be reported at what they could be sold for instead.</p></div>
<h2>3. Monetary unit (stable money)</h2>
<p>Money is the common measuring stick. Accounting generally ignores inflation and deflation and treats a peso from 2010 as equal to a peso today. Your Quiz 1 calls this the <b>stable monetary unit</b> principle: recording all transactions in one uniform currency.</p>
<h2>4. Periodicity (time period)</h2>
<p>A business's life is divided into artificial periods so we can report results regularly. Every statement must say what date or period it covers.</p>
${tbl(['Type of period','Meaning'],[['Calendar year','12 months, January 1 – December 31'],['Fiscal year','12 months starting in any month other than January (e.g. July 1 – June 30)'],['Interim period','Shorter than a year — a month or a quarter']])}
<h2>5. Accrual basis</h2>
<p>All financial statements <b>except the statement of cash flows</b> are prepared on the accrual basis. Revenue includes income earned but not yet collected (accrued income); expenses include amounts incurred but not yet paid (accrued expenses). This is the idea behind adjusting entries in <a class="xl" href="#c3-1">Lesson 3.1</a>.</p>
<div class="ex" data-t="Accrual basis, from your pre-midterm"><p>ABM Clinic collected ₱15,000 in March for February credit services, ₱40,000 for March cash services, and billed ₱25,000 of March services on credit. What is March revenue?</p>${calc([['March cash services',40000],['March credit services (earned, not yet collected)',25000],['February collections — earned in February, so excluded','—'],['=March revenue','₱65,000']])}</div>
<div class="tip"><p>IAS 1 (PAS 1) requires accrual accounting for every statement <b>except</b> the cash-flow statement. A quiz statement saying the income statement or the statement of changes in equity is excluded is <b>false</b>.</p></div>`},
{t:'The basic principles',lo:4,h:`
${kt('Historical cost','Fair value','Revenue recognition principle','Matching principle','Full disclosure principle')}
<p class="lead">Assumptions tell us what we take for granted. Principles tell us how to measure and when to record.</p>
<h2>1. Measurement principles</h2>
<p><b>Cost (historical cost) principle</b> — assets and liabilities are recorded at their acquisition price. It is verifiable (there's a receipt), so it supports faithful representation.</p>
<p><b>Fair value principle</b> — the amount for which an asset could be exchanged, or a liability settled, between knowledgeable and willing parties in an arm's-length transaction (a deal between strangers, neither under pressure). It is more current but needs more judgement.</p>
<div class="ex" data-t="Cost vs fair value"><p>A clinic bought land for ₱1,000,000. Five years later similar land sells for ₱1,600,000. Under the cost principle the land stays at ₱1,000,000. Under fair value it would be shown at ₱1,600,000. Most items you'll meet in this course use cost.</p></div>
<h2>2. Revenue recognition principle</h2>
<p>Revenue (income) is an increase in economic benefits — inflows of assets or decreases in liabilities — that increases equity, <b>other than</b> contributions from owners. The rule: <b>record revenue when it is earned</b>, which the slides say is generally at the <b>point of sale</b>, measured at the fair value of what is received or receivable.</p>
<p>The slides list exceptions:</p>
<ul><li><b>Earlier recognition</b> — at completion of production, or by percentage of completion (long construction jobs).</li><li><b>Later recognition</b> — when collection is doubtful: cash/profit-recovery, cost-recovery, or installment methods (revenue only as cash comes in).</li></ul>
<div class="fix"><p>The slides describe the older "point of sale" rules. Since 2018, revenue under <b>PFRS 15</b> is recognised when the business <b>satisfies a performance obligation by transferring control</b> of a good or service to the customer — either at a point in time or over time (the modern replacement for percentage-of-completion). For exam questions on this deck, the slide wording still works; just know the current standard uses "transfer of control."</p></div>
<div class="ex" data-t="Unearned revenue — Quiz 1 and pre-midterm"><p>Patient Jay pays ABC Physical Therapy ₱2,000 in December for services to be done in 45 days. ABC has received cash but <b>has not earned it</b>. So ABC debits Cash and credits <b>Unearned Revenue — a liability</b> (ABC owes Jay a service). Crediting Service Revenue now would violate the revenue recognition (realization) principle.</p></div>
<h2>3. Expense recognition (matching) principle</h2>
<p>An expense is an outflow or using-up of assets, or incurring of liabilities, from delivering goods or services. The <b>matching principle</b>: costs incurred to generate this period's revenue should appear as expenses in the <b>same</b> period's income statement. Your slides give three ways to apply it:</p>
${tbl(['Method','When it is used','Examples'],[['Associating cause and effect ("direct matching")','The cost is directly tied to a sale','Cost of sales, sales commissions'],['Systematic and rational allocation','The cost benefits several periods','Depreciation, amortisation'],['Immediate recognition','No future benefit can be identified','Salaries, rent, utilities, interest']],{cls:'stack'})}
<div class="fix"><p>The slide labels the third way just "Expense Recognition"; textbooks and your quizzes call it <b>immediate recognition</b>.</p></div>
<div class="case" data-t="Jose Marie's tax trick (Quiz 1)"><p>Jose Marie overstated expenses and understated revenues to lower taxable income. Reporting expenses that don't belong to the period's revenues breaks the <b>matching principle</b>.</p></div>
<h2>4. Full-disclosure principle</h2>
<p>Statements must report <b>all relevant information</b> about the business's affairs — including important events after the reporting date — usually through the <b>notes to the financial statements</b> and supplementary schedules. Think of the notes as the "fine print" that explains the numbers.</p>`},
{t:'Constraints and qualitative characteristics',lo:5,h:`
${kt('Materiality','Relevance','Faithful representation','Predictive value','Confirmatory value','Comparability','Verifiability','Timeliness','Understandability')}
<p class="lead">What makes accounting information <i>useful</i>? The Conceptual Framework answers with two "must-have" qualities and four "nice-to-have" qualities — limited by two practical constraints.</p>
<h2>Two constraints</h2>
<p><b>Cost constraint</b> (cost-benefit) — the benefit of reporting information should outweigh the cost of producing it. A business won't spend ₱50,000 tracking ₱500 of paper clips.</p>
<p><b>Materiality</b> — an item is material if omitting or misstating it would change a decision. A ₱300 stapler can simply be expensed even though it lasts years; a ₱3 million machine cannot.</p>
<h2>Fundamental qualities (must have)</h2>
<figure><svg viewBox="0 0 640 250" role="img" aria-label="Fundamental and enhancing qualities"><rect x="210" y="8" width="220" height="40" rx="8" class="a"/><text x="320" y="33" text-anchor="middle" class="wt" font-size="15" font-weight="700">Useful information</text>
<rect x="40" y="80" width="250" height="40" rx="8" class="al"/><text x="165" y="105" text-anchor="middle" font-size="15" font-weight="700">Relevance</text>
<rect x="350" y="80" width="250" height="40" rx="8" class="al"/><text x="475" y="105" text-anchor="middle" font-size="15" font-weight="700">Faithful representation</text>
<path d="M320 48v16H165v16M320 64h155v16" class="ln" stroke-width="2"/>
<text x="165" y="142" text-anchor="middle" font-size="13">predictive value</text><text x="165" y="160" text-anchor="middle" font-size="13">confirmatory value</text><text x="165" y="178" text-anchor="middle" font-size="13">(materiality)</text>
<text x="475" y="142" text-anchor="middle" font-size="13">complete</text><text x="475" y="160" text-anchor="middle" font-size="13">neutral</text><text x="475" y="178" text-anchor="middle" font-size="13">free from error</text>
<rect x="20" y="200" width="600" height="40" rx="8" fill="none" class="as" stroke-width="2"/><text x="320" y="225" text-anchor="middle" font-size="14">Enhancing: comparability · verifiability · timeliness · understandability</text></svg><figcaption>The two fundamental qualities and four enhancing qualities.</figcaption></figure>
<p><b>Relevance</b> — information can make a difference in a decision because it has:</p>
<ul><li><b>Predictive value</b> — it helps forecast the future (last year's sales help predict this year's).</li><li><b>Confirmatory value</b> — it helps check or correct earlier predictions ("Was my forecast right?").</li></ul>
<p><b>Faithful representation</b> — the information shows what really happened. Its main purpose, per the slides, is <b>to achieve public trust and confidence</b> in the statements. It must be <b>complete</b>, <b>neutral</b> (no bias) and <b>free from error</b>.</p>
<div class="ex" data-t="Which quality is missing?"><p>Your Exercise 4 asked: "When inventory is misstated, the presentation lacks…?" A misstatement means the numbers don't match reality, so it lacks <b>faithful representation</b>.</p></div>
<h2>Enhancing qualities (nice to have)</h2>
${tbl(['Quality','Plain-English meaning'],[['Comparability','You can compare this company with others, and with its own past years'],['Verifiability','Two independent people would get the same answer — this is what external auditing checks'],['Timeliness','It arrives in time to matter; late information loses relevance'],['Understandability','Presented clearly for a reasonably informed reader']])}
<div class="fix"><p>One slide lists "Decision-usefulness, Relevant-Disclosure, Reporting Format" as qualitative characteristics. These are better read as the <i>purposes</i> the characteristics serve (choosing methods, deciding what to disclose, choosing a presentation). For exams, use the fundamental/enhancing list above.</p></div>`},
{t:'The financial statements and their elements',lo:6,h:`
${kt('Asset','Liability','Equity')}
<p class="lead">Financial statements are formal reports that group the effects of transactions into broad classes according to their economic characteristics.</p>
<h2>The complete set (PAS 1)</h2>
${tbl(['Statement','Other name','What it shows'],[['1. Statement of financial position','Balance sheet','Assets, liabilities and equity <b>at a date</b>'],['2. Statement of comprehensive income','Income statement (profit or loss)','Revenues and expenses <b>for a period</b>'],['3. Statement of changes in equity','Statement of owner\'s equity','How equity moved during the period'],['4. Statement of cash flows','Cash-flow statement','Sources and uses of cash for the period'],['5. Notes','—','Explanations, policies and details']],{cls:'stack'})}
<div class="tip"><p>The statement of financial position shows <b>liquidity, solvency and financial position</b>. It does <b>not</b> show profitability — that's the income statement. This was a quiz "except" item.</p></div>
<h2>The elements</h2>
<p><b>Assets</b> — resources owned or controlled by the entity, resulting from past events, that are expected to bring future benefits. <b>Liabilities</b> — existing obligations from past events that will require an outflow. <b>Equity</b> — the residual interest: what is left for owners after deducting liabilities.</p>
<p class="calc" style="text-align:center;font-weight:700">Assets = Liabilities + Equity</p>
<p><b>Revenue</b> increases assets or decreases liabilities from operations, raising equity — but is not an owner's contribution. <b>Expenses</b> decrease assets or increase liabilities from operations, lowering equity — but are not owner withdrawals or repayments of debt.</p>
<div class="ex" data-t="Using the equation (Quiz 1)"><p>Total assets rose ₱80,000 while total liabilities fell ₱48,000. Since Equity = Assets − Liabilities:</p>${calc([['Change in assets','+80,000'],['Less: change in liabilities','−(−48,000) = +48,000'],['=Change in equity','+₱128,000 increase']])}<p>Second item: cash income of ₱50,000 and expenses paid of ₱26,000 raise equity by the net income, <b>₱24,000</b>.</p></div>
<div class="ex" data-t="Finding a missing asset (Quiz 1)"><p>Vehicles ₱600,000, goodwill ₱120,000, cash ₱30,000; owner's equity ₱1,000,000; unearned revenue ₱500,000; bonds payable ₱50,000. What is land?</p>${calc([['Liabilities + equity (500,000 + 50,000 + 1,000,000)','1,550,000'],['Less: other assets (600,000 + 120,000 + 30,000)','(750,000)'],['=Land','₱800,000']])}<p>₱800,000 wasn't among the choices — so the answer was "None of the above." Don't be afraid of that option when your arithmetic is solid.</p></div>
<h2>Recognition, management's role and limitations</h2>
<p><b>Recognition</b> means recording an item in the statements. The slides give two criteria: it is <b>probable</b> that future benefits will flow, and the item can be <b>measured reliably</b>.</p>
<div class="fix"><p>Those two criteria come from the older Framework. The <b>2018 Conceptual Framework</b> instead asks whether recognising the item gives <b>relevant</b> information and a <b>faithful representation</b>. The idea is similar; the wording changed.</p></div>
<p><b>Management</b> (or the owner) is primarily responsible for the statements: it makes sure they are general-purpose reports and reviews and approves adjustments.</p>
<p><b>Limitations</b> of financial statements: they rely on <b>estimates</b>; <b>historical cost</b> doesn't show current values or the time value of money; and <b>internally developed intangibles</b> (a well-loved brand built over years) are usually not on the balance sheet.</p>`},
{t:'Real and nominal accounts',lo:6,h:`
${kt('Real accounts','Nominal accounts','Operating cycle')}
<p class="lead">Every account is either a "keeper" that carries over to next year, or a "scoreboard" that resets to zero.</p>
${tbl(['','Real (permanent) accounts','Nominal (temporary) accounts'],[['Which accounts','Assets, liabilities, owner\'s equity (capital)','Revenues, expenses (and owner\'s drawings)'],['At period-end','<b>Not closed</b> — balance carries forward','<b>Closed</b> to zero'],['Appear on','Statement of financial position','Income statement (drawings: statement of changes in equity)'],['Analogy','Your savings balance','This season\'s basketball scoreboard']],{cls:'stack'})}
<div class="tip"><p>Trap items from your quizzes: <b>Unearned Revenue</b> is a <i>liability</i> (real), not a revenue (nominal), even though it has "revenue" in its name. A <b>Loss on Sale of Investment</b> is <i>nominal</i>, even though it relates to an asset. Goodwill and cash are real.</p></div>
<h2>Classifying assets: current vs noncurrent</h2>
<p>Assets have a normal <b>debit</b> balance and are split into current and noncurrent. A <b>current asset</b> is cash or a cash equivalent not restricted from current use, or an asset expected to be realised, sold or consumed within the normal <b>operating cycle</b>, or held mainly for trading, or expected to be realised within <b>twelve months</b> of the reporting date.</p>
<div class="ex" data-t="Current assets (pre-midterm)"><p>MEDICAL shows: accounts payable ₱50,000, accounts receivable ₱96,000, cash ₱114,000, office equipment ₱240,000, office supplies ₱24,000, prepaid expense ₱40,000. Current assets?</p>${calc([['Cash',114000],['Accounts receivable',96000],['Office supplies',24000],['Prepaid expense',40000],['=Current assets','₱274,000']])}<p>Office equipment is noncurrent; accounts payable is a liability.</p></div>
<p>The rest of the classified balance sheet (long-term investments, PPE, current and long-term liabilities) is in <a class="xl" href="#c4-5">Lesson 4.5</a>.</p>`}
],

hook:'Debits, credits, journals and ledgers — the machinery that turns a receipt into a number in the books.',
los:['Explain what an account is and how debits and credits work.','Apply the double-entry system and the normal-balance rules to every type of account.','Journalize transactions in the general journal, including compound entries.','Post journal entries to the ledger.','Prepare a trial balance and explain what it can and cannot prove.'],
why:`<p>Chapter 1 gave you the rules. This chapter gives you the <b>tools</b>: the account, the journal, the ledger and the trial balance. Every exam problem — from adjusting entries to bank reconciliations to cash flows — is answered in journal entries, so this is the chapter you must be able to do in your sleep.</p><p>The good news: there are really only two ideas. (1) Every transaction touches <b>at least two accounts</b> with equal debits and credits. (2) Each type of account has a "<b>normal</b>" side where increases go. Master those, and everything else is bookkeeping routine.</p>`,
terms:{
'Account':'An individual record of the increases and decreases in one specific asset, liability, equity, revenue or expense item.',
'T account':'The simplest form of an account: a title, a left (debit) side and a right (credit) side, shaped like the letter T.',
'Debit':'The left side of an account (abbreviated Dr). "To debit" means to enter an amount on the left.',
'Credit':'The right side of an account (abbreviated Cr). "To credit" means to enter an amount on the right.',
'Double-entry system':'Every transaction is recorded with equal debits and credits in at least two accounts, so the accounting equation always balances.',
'Normal balance':'The side (debit or credit) on which an account\'s increases are recorded — and where its balance usually sits.',
'Drawings':'Withdrawals of cash or other assets by the owner for personal use; they reduce equity but are not expenses.',
'Journal':'The book of original entry, where transactions are first recorded in date order.',
'General journal':'The basic journal with columns for date, account titles and explanation, reference, debit and credit.',
'Journalizing':'Entering transaction data in the journal.',
'Simple entry':'A journal entry with exactly one debit and one credit.',
'Compound entry':'A journal entry that involves three or more accounts.',
'Ledger':'The whole group of accounts a company keeps (the "book of final entry").',
'General ledger':'The ledger holding all the asset, liability and equity accounts (including revenues and expenses).',
'Subsidiary ledger':'A ledger with detailed accounts for one group of items, e.g. each customer\'s receivable.',
'Posting':'Transferring amounts from the journal to the correct ledger accounts.',
'Chart of accounts':'The numbered list of all accounts a company uses (e.g. 101 Cash, 301 Capital).',
'Trial balance':'A list of all accounts and their balances at a date, used to prove that total debits equal total credits.'},
lessons:[
{t:'The account, debits and credits',lo:1,h:`
${kt('Account','T account','Debit','Credit')}
<p class="lead">An <b>account</b> is a separate record for one item — Cash, Salaries Expense, Accounts Payable — showing every increase and decrease in it.</p>
<p>In its simplest form an account has three parts: a <b>title</b>, a <b>left (debit) side</b> and a <b>right (credit) side</b>. Drawn on paper it looks like the letter T, so it's called a <b>T account</b>.</p>
<figure><svg viewBox="0 0 420 150" role="img" aria-label="T account"><text x="210" y="24" text-anchor="middle" font-size="17" font-weight="700">Title of Account</text><path d="M40 36h340M210 36v104" class="ln" stroke-width="2.5"/><text x="125" y="66" text-anchor="middle" font-size="14">Left or <tspan font-weight="700">debit</tspan> side</text><text x="295" y="66" text-anchor="middle" font-size="14">Right or <tspan font-weight="700">credit</tspan> side</text><text x="125" y="118" text-anchor="middle" font-size="13" class="mu">Debit balance</text><text x="295" y="118" text-anchor="middle" font-size="13" class="mu">Credit balance</text></svg><figcaption>Illustration 2-1: basic form of an account.</figcaption></figure>
<div class="warn"><p><b>Debit means left. Credit means right.</b> That's all. They do <i>not</i> mean "good" or "bad," "increase" or "decrease." Whether a debit increases or decreases an account depends on the type of account (next lesson). Your bank saying it "credited your account" is from the <i>bank's</i> point of view, which is why everyday usage confuses students.</p></div>
<p>Entering an amount on the left is <b>debiting</b> the account; on the right is <b>crediting</b>. If total debits exceed total credits, the account has a <b>debit balance</b>; the reverse gives a <b>credit balance</b>.</p>
<div class="ex" data-t="Tabular summary vs account form (Illustration 2-2)"><p>The slides show the same Cash transactions two ways. A list of pluses and minuses (tabular summary) becomes a T account with increases on the left and decreases on the right:</p>
${tbl(['Cash — Debit (increases)','Cash — Credit (decreases)'],[['15,000','7,000'],['1,200','600'],['1,500','900'],['600','200'],['','250'],['','1,300'],['18,300','10,250']],{num:[0,1],tot:true})}
${calc([['Total debits',18300],['Less: total credits','(10,250)'],['=Debit balance','8,050']])}</div>
<div class="ex" data-t="Debit, credit, balance (slides 6–8)"><p>The owner invests $15,000 cash: Cash is <b>debited</b> 15,000. Monthly rent of $7,000 is paid: Cash is <b>credited</b> 7,000. Cash now has a <b>debit balance of $8,000</b> (15,000 − 7,000).</p></div>`},
{t:'Double entry and normal balances',lo:2,h:`
${kt('Double-entry system','Normal balance','Drawings')}
<p class="lead">In a <b>double-entry system</b>, every transaction is recorded with <b>equal debits and credits</b> in at least two accounts. So total debits always equal total credits, and Assets = Liabilities + Equity always stays balanced.</p>
<p>Your Quiz 1 put it this way: the purpose of double-entry is "to ensure every transaction will be posted on the debit and credit side with the same amount in at least two accounts." It works like a seesaw — whatever you add to one side, you add the same weight to the other.</p>
<h2>The normal-balance rules</h2>
<p>Every type of account has a <b>normal balance</b>: the side where its <i>increases</i> are recorded. Learn this table and you can journalize anything:</p>
${tbl(['Account type','Increase with a…','Decrease with a…','Normal balance'],[['Assets','Debit','Credit','Debit'],['Liabilities','Credit','Debit','Credit'],['Owner\'s capital','Credit','Debit','Credit'],['Owner\'s drawings','Debit','Credit','Debit'],['Revenues','Credit','Debit','Credit'],['Expenses','Debit','Credit','Debit']])}
<div class="tip"><p>Memory trick — <b>"DEAD CLIC"</b>: <b>D</b>ebits increase <b>E</b>xpenses, <b>A</b>ssets, <b>D</b>rawings; <b>C</b>redits increase <b>L</b>iabilities, <b>I</b>ncome (revenue), <b>C</b>apital. (A memory aid, not from the slides.)</p></div>
<h2>Why expenses and drawings are debits</h2>
<p>Expenses and drawings both <b>reduce</b> owner's equity. Since equity increases on the credit side, anything that reduces it goes on the debit side. Revenues <b>increase</b> equity, so they are credits. This is the <b>expanded accounting equation</b>:</p>
<figure><svg viewBox="0 0 690 150" role="img" aria-label="Expanded accounting equation"><g font-size="14" font-weight="700" text-anchor="middle"><rect x="6" y="20" width="110" height="40" rx="7" class="al"/><text x="61" y="45">Assets</text><text x="133" y="45">=</text><rect x="150" y="20" width="110" height="40" rx="7" class="al"/><text x="205" y="45">Liabilities</text><text x="277" y="45">+</text><rect x="294" y="20" width="80" height="40" rx="7" class="al"/><text x="334" y="45">Capital</text><text x="388" y="45">−</text><rect x="402" y="20" width="84" height="40" rx="7" class="al"/><text x="444" y="45">Drawings</text><text x="499" y="45">+</text><rect x="512" y="20" width="70" height="40" rx="7" class="al"/><text x="547" y="45">Rev.</text><text x="597" y="45">−</text><rect x="610" y="20" width="48" height="40" rx="7" class="al"/><text x="634" y="45">Exp.</text></g>
<g font-size="12.5" text-anchor="middle"><text x="61" y="88">Dr + / Cr −</text><text x="205" y="88">Dr − / Cr +</text><text x="334" y="88">Dr − / Cr +</text><text x="444" y="88">Dr + / Cr −</text><text x="547" y="88">Dr − / Cr +</text><text x="634" y="88">Dr + / Cr −</text></g><text x="330" y="130" text-anchor="middle" font-size="13" class="mu">Illustration 2-7: debit/credit effects on each part of the expanded equation</text></svg></figure>
<div class="ex" data-t="Normal balance (Quiz 1)"><p>"The normal balance of an account is on the side represented by the <b>increases</b> in the account." That's the correct option — not simply "the debit side," because liabilities, capital and revenue normally sit on the credit side.</p></div>
<div class="warn"><p>A quiz item asked whether "Equity increases when dividends are distributed." <b>False</b> — dividends (a corporation's version of drawings) reduce equity.</p></div>`},
{t:'The journal and journalizing',lo:3,h:`
${kt('Journal','General journal','Journalizing','Simple entry','Compound entry')}
<p class="lead">Transactions are not written straight into accounts. They are first recorded in date order in a <b>journal</b> — the "book of original entry" — and only then transferred to the accounts.</p>
<figure><svg viewBox="0 0 600 110" role="img" aria-label="Recording process"><g text-anchor="middle" font-size="14"><rect x="10" y="30" width="160" height="50" rx="9" class="al"/><text x="90" y="52" font-weight="700">1. Analyse</text><text x="90" y="70" font-size="12">source documents</text><rect x="220" y="30" width="160" height="50" rx="9" class="al"/><text x="300" y="52" font-weight="700">2. Journalize</text><text x="300" y="70" font-size="12">enter in journal</text><rect x="430" y="30" width="160" height="50" rx="9" class="al"/><text x="510" y="52" font-weight="700">3. Post</text><text x="510" y="70" font-size="12">transfer to ledger</text></g><path d="M172 55h44M382 55h44" class="as" stroke-width="2.5" marker-end="url(#ar)"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="a"/></marker></defs></svg><figcaption>Illustration 2-9: the recording process.</figcaption></figure>
<p>Why bother with a journal? The slides give three reasons: it shows the <b>complete effect</b> of a transaction in one place; it gives a <b>chronological record</b>; and it helps <b>prevent or locate errors</b>, because debits and credits for each entry can be compared at a glance.</p>
<h2>How to write a journal entry</h2>
<p>A complete entry has: (1) the <b>date</b>, (2) the accounts and amounts to be <b>debited and credited</b>, and (3) a brief <b>explanation</b>.</p>
<ol class="steps"><li>Write the date (year at the top of the column, then month and day).</li><li>Write the <b>debit</b> account at the far left of the Account Titles column, amount in the Debit column.</li><li>On the next line, <b>indent</b> the credit account, amount in the Credit column.</li><li>Add a short explanation underneath; leave a blank line before the next entry.</li><li>Leave the <b>Ref.</b> column blank for now — it's filled in when you post.</li></ol>
<div class="ex" data-t="Journalizing (Illustration 2-10)">${je([['2002 Sept. 1','Cash',15000,''],['','M. Doucet, Capital','',15000],['Invested cash in business.'],['1','Equipment',7000,''],['','Cash','',7000],['Purchased equipment for cash.']])}</div>
<h2>Simple and compound entries</h2>
<p>A <b>simple entry</b> has one debit and one credit. A <b>compound entry</b> has three or more accounts.</p>
<div class="ex" data-t="Compound entry (Illustration 2-11)"><p>On October 2 a delivery truck costing $34,000 is bought with $8,000 cash and a $26,000 note payable.</p>${je([['Oct. 2','Delivery Equipment',34000,''],['','Cash','',8000],['','Note Payable','',26000],['Purchased truck for cash and note payable.']])}<p>Check: debits 34,000 = credits 8,000 + 26,000.</p></div>
<div class="warn"><p>In a compound entry, <b>all debits are listed before any credit</b>. The slides show a wrong version with Cash credited above the debit to Delivery Equipment — that format is incorrect even though the amounts balance.</p></div>
<div class="tip"><p>Your pre-midterm asked what is <i>not</i> part of the general journal: date, debit, credit or <b>account balance</b>. Balances live in the <b>ledger</b>, not the journal.</p></div>`},
{t:'The ledger and posting',lo:4,h:`
${kt('Ledger','General ledger','Subsidiary ledger','Posting','Chart of accounts')}
<p class="lead">The <b>ledger</b> is the entire group of accounts a company keeps. Think of the journal as a diary written day by day, and the ledger as a filing cabinet with one folder per account.</p>
<p>The <b>general ledger</b> holds every account — assets, liabilities and equity (including revenue, expense and drawings, which are parts of equity):</p>
${tbl(['Assets','Liabilities','Owner\'s equity'],[['Cash','Notes Payable','Doucet, Capital'],['Accounts Receivable','Accounts Payable','Doucet, Drawings'],['Supplies','Salaries Payable','Service Revenue'],['Equipment','Interest Payable','Salaries Expense']])}
<div class="ph"><p>Your pre-midterm asked for "an accounting record that contains detailed information about a specific group of a company's accounts." That is a <b>subsidiary ledger</b> — for example, one page per customer that together add up to the Accounts Receivable control account in the general ledger.</p></div>
<h2>Posting</h2>
<p><b>Posting</b> means copying each journal amount to the right ledger account. Each account has a number from the <b>chart of accounts</b> (here, 101 = Cash, 301 = M. Doucet, Capital).</p>
<ol class="steps"><li>In the ledger account being debited, enter the date, the journal page (J1) and the debit amount; update the balance.</li><li>Write the account number (101) in the journal's <b>Ref.</b> column — this shows the line has been posted.</li><li>Repeat for the credit: enter it in account 301 and write 301 in the journal's Ref. column.</li></ol>
<div class="ex" data-t="Posting a journal entry (Illustration 2-14)">${tbl(['General journal — J1','Ref','Debit','Credit'],[['Sep 1 Cash','101','15,000',''],['&nbsp;&nbsp;&nbsp;&nbsp;M. Doucet, Capital','301','','15,000']],{num:[2,3]})}
${tbl(['Ledger: Cash (101) — Date','Ref','Debit','Credit','Balance'],[['Sep 1','J1','15,000','','15,000']],{num:[2,3,4]})}
${tbl(['Ledger: M. Doucet, Capital (301) — Date','Ref','Debit','Credit','Balance'],[['Sep 1','J1','','15,000','15,000']],{num:[2,3,4]})}</div>
<div class="tip"><p>Order of the cycle (Quiz 1): recording entries in a journal is <b>journalizing</b>; transferring them to the ledger is <b>posting</b>. Adjusting and closing come later (Chapters 3–4).</p></div>
<div class="ex" data-t="Working backwards in a ledger account (Quiz 1)"><p>Cash ended with a debit balance of ₱72,000 after debit postings of ₱148,000 and credit postings of ₱172,400. Beginning balance?</p>${calc([['Ending balance',72000],['Add back credits posted',172400],['Less debits posted','(148,000)'],['=Beginning balance','₱96,400']])}<p>Similar: Accounts Receivable had debits of ₱30,000 and credits of ₱14,000. The <b>change</b> is 30,000 − 14,000 = <b>₱16,000 increase</b> (the ₱24,000 beginning balance doesn't affect the change).</p></div>`},
{t:'The trial balance',lo:5,h:`
${kt('Trial balance')}
<p class="lead">A <b>trial balance</b> lists every account and its balance at a given date. Its main purpose: to <b>prove that total debits equal total credits</b> after posting.</p>
<ol class="steps"><li>List the account titles and their balances (debit balances in the left column, credit balances in the right).</li><li>Total both columns.</li><li>Check that the two totals are equal.</li></ol>
<div class="ex" data-t="A trial balance (Illustration 2-28)"><p>Pioneer Advertising Agency, Trial Balance, October 31, 2002:</p>
${tbl(['Account','Debit','Credit'],[['Cash','15,200',''],['Advertising Supplies','2,500',''],['Prepaid Insurance','600',''],['Office Equipment','5,000',''],['Notes Payable','','5,000'],['Accounts Payable','','2,500'],['Unearned Revenue','','1,200'],['C. R. Byrd, Capital','','10,000'],['C. R. Byrd, Drawings','500',''],['Service Revenue','','10,000'],['Salaries Expense','4,000',''],['Rent Expense','900',''],['Totals','$28,700','$28,700']],{num:[1,2],tot:true})}
<p>Notice: every account sits on its normal-balance side — assets, drawings and expenses on the left; liabilities, capital and revenue on the right. Keep this trial balance handy: Chapter 3 adjusts it in <a class="xl" href="#c3-2">Lesson 3.2</a>.</p></div>
<h2>What a trial balance can't tell you</h2>
<p>Balanced totals do <b>not</b> prove the books are correct. The trial balance still balances when:</p>
<ol><li>a transaction is <b>not journalized</b> at all;</li><li>a correct entry is <b>not posted</b>;</li><li>an entry is <b>posted twice</b>;</li><li><b>the wrong accounts</b> are used (e.g. debiting Supplies instead of Equipment);</li><li><b>offsetting errors</b> are made (the same wrong amount on both sides).</li></ol>
<div class="tip"><p>Rule of thumb: if an error affects debits and credits <b>equally</b>, the trial balance can't catch it. It only catches one-sided errors, such as posting a debit as a credit or adding a column wrong.</p></div>
<div class="deep"><p>A practical trick (not on the slides): if the difference between the two columns is divisible by 9, look for a <b>transposition</b> (writing 54 as 45) or slide (500 as 50).</p></div>`}
],
