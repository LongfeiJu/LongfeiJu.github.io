CH.push({n:6,color:'#c0392b',title:'Receivables',
hook:'Selling on credit is easy; getting paid is the hard part. How companies record, value and manage what customers owe.',
los:['Identify the types of receivables and when revenue from a credit sale is recognised.','Record credit sales, sales discounts, and sales returns and allowances, and compute net sales.','Value receivables using the allowance method, including write-offs and recoveries.','Estimate uncollectible accounts using the percentage-of-receivables and aging methods.','Assess how well a company manages its receivables using turnover and collection period.','Account for notes receivable and foreign-currency receivables.'],
why:`<p>A clinic that bills an HMO, a supplier that gives a pharmacy 30 days to pay, a school that lets parents pay tuition in instalments — they have all "sold" something but haven't been paid. That claim is a <b>receivable</b>, and for many businesses it is the largest current asset.</p><p>Two questions drive this chapter: <b>how much will we actually collect?</b> (bad-debt estimates) and <b>how fast?</b> (turnover ratios). Your Exercise 4 had over ten questions on the allowance method alone.</p>`,
terms:{
'Receivable':'A claim for money, goods or services from another party.',
'Accounts receivable':'A current asset: money customers owe for goods or services sold on credit (an informal promise to pay).',
'Notes receivable':'A formal written promise (promissory note) from a customer to pay a sum, usually with interest, on a set date.',
'Sales discount':'A reduction in price for customers who pay within the discount period; a contra-revenue account.',
'Sales returns and allowances':'Goods returned by customers or price reductions given; a contra-revenue account.',
'Contra-revenue':'An account deducted from sales (sales discounts, returns and allowances).',
'Gross sales':'Total sales recorded before deducting discounts and returns.',
'Net sales':'Gross sales minus sales discounts and sales returns and allowances.',
'Bad debt':'An account receivable that will not be collected (uncollectible account).',
'Allowance for bad debts':'A contra-asset account holding the estimated uncollectible amount of receivables (also Allowance for Doubtful Accounts).',
'Net realizable value':'The amount of receivables expected to be collected: Accounts Receivable minus the allowance.',
'Write-off':'Removing a specific worthless account from the books: Dr Allowance, Cr Accounts Receivable.',
'Aging of accounts receivable':'Grouping receivables by how long they have been outstanding and applying a higher loss percentage to older groups.',
'Percentage of sales method':'Estimating bad-debt expense as a percentage of credit sales (income-statement approach).',
'Accounts receivable turnover':'Sales ÷ average accounts receivable — how many times receivables are collected in a year.',
'Average collection period':'365 ÷ receivables turnover — the average number of days to collect a credit sale.',
'Maturity date':'The date on which a note is due to be paid.',
'Dishonored note':'A note not paid at maturity; it is transferred (with interest) to accounts receivable.',
'Foreign currency transaction':'A transaction whose price is set in a currency other than the company\'s own (functional) currency.',
'Exchange gain or loss':'The change in the home-currency value of a foreign-currency receivable or payable between the transaction date and settlement or reporting date.',
'Forward contract':'An agreement to exchange currencies at a set rate on a future date; used to reduce exchange-rate risk.'},
lessons:[
{t:'Types of receivables and revenue recognition',lo:1,h:`
${kt('Receivable','Accounts receivable','Notes receivable')}
<p class="lead">A <b>receivable</b> is a claim for money, goods or services. The two main types:</p>
${tbl(['','Accounts receivable','Notes receivable'],[['Form','Informal — an invoice','Formal written promissory note'],['Interest','Usually none','Usually yes'],['Typical term','30–60 days','Months, sometimes longer'],['Legal claim','Ordinary','Stronger']],{cls:'stack'})}
<h2>When is revenue from a credit sale recognised?</h2>
<p>The deck lists the IAS 18 conditions for selling goods: the seller has transferred the <b>significant risks and rewards</b> of ownership; keeps no managerial involvement or control; the revenue can be <b>measured reliably</b>; it is <b>probable</b> the money will be received; and the costs can be measured reliably. For services, the <b>stage of completion</b> must also be measurable.</p>
<div class="fix"><p><b>IAS 18 is no longer in force.</b> Since January 1, 2018 it has been replaced by <b>IFRS 15 / PFRS 15, Revenue from Contracts with Customers</b>. The modern test is whether the seller has <b>transferred control</b> of the goods or services (satisfied a performance obligation), using a five-step model: identify the contract → identify the performance obligations → determine the price → allocate the price → recognise revenue as each obligation is satisfied. For most simple credit sales the answer is the same: at delivery.</p></div>
<div class="ph"><p>Your pre-midterm asked about the "inventory of a service provider" — under PFRS 15-era terms, costs of services not yet billed are <b>unbilled services</b> (older texts: work in progress). Your exercise key used "unbilled services."</p></div>`},
{t:'Credit sales, discounts, returns and net sales',lo:2,h:`
${kt('Sales discount','Sales returns and allowances','Contra-revenue','Gross sales','Net sales')}
<p class="lead">Under a perpetual system, every sale needs <b>two entries</b>: one for the selling price, one to move the cost out of inventory.</p>
<div class="ex" data-t="Hot Pot's jam sales (amounts in NT$)"><p>Hot Pot sells 30 jars of jam for cash and 20 on credit at NT$10 each. The jars cost NT$400 in total.</p>${je([['','Cash',300,''],['','Accounts Receivable',200,''],['','Sales Revenue','',500],['Sold 30 jars for cash and 20 on credit.'],['','Cost of Goods Sold',400,''],['','Inventory','',400],['To record the cost of goods sold.'],['Later','Cash',200,''],['','Accounts Receivable','',200],['Collected the credit sale.']])}</div>
<h2>Sales discounts</h2>
<p>The seller's side of a purchase discount. <b>Sales Discounts</b> is a <b>contra-revenue</b> account: it has a debit balance and is deducted from sales.</p>
<div class="ex" data-t="Customer pays within 2/10"><p>If the NT$200 credit sale had terms 2/10, n/30 and the customer paid in time:</p>${je([['','Cash',196,''],['','Sales Discounts (200 × 2%)',4,''],['','Accounts Receivable','',200]])}</div>
<h2>Sales returns and allowances</h2>
<p>Also a contra-revenue account. If returned goods are resaleable, a second entry puts their <b>cost</b> back into inventory.</p>
<div class="ex" data-t="Returns, then a discounted collection"><p>Before any collections, customers return goods sold for NT$150: NT$100 from cash customers (refunded) and NT$50 from credit customers. The goods cost NT$120.</p>${je([['','Sales Returns and Allowances',150,''],['','Cash','',100],['','Accounts Receivable','',50],['','Inventory',120,''],['','Cost of Goods Sold','',120]])}
<p>The remaining NT$150 receivable is then collected within the discount period: discount = (200 − 50) × 2% = NT$3.</p>${calc([['Sales revenue',500],['Less: sales discounts','(3)'],['Less: sales returns and allowances','(150)'],['=Net sales','NT$347']])}</div>
<div class="fix"><p>The slide's explanation line says "NT$50 from <i>cash</i> customers" twice; the second should read <b>credit</b> customers (that's why Accounts Receivable is credited for 50).</p></div>
${calc([['Gross sales',''],['− Sales discounts',''],['− Sales returns and allowances',''],['=Net sales','']])}
<div class="ex" data-t="Hendrix Company (Quiz Yourself)"><p>Credit sales $100,000; cash sales $40,000; cost of goods sold $112,000. Credit customers took $2,700 of discounts when paying $90,000 of their accounts. $4,500 of goods (cost $3,600) was returned by cash customers.</p>${je([['','Cash',40000,''],['','Accounts Receivable',100000,''],['','Sales','',140000],['','Cost of Goods Sold',112000,''],['','Inventory','',112000],['','Cash',87300,''],['','Sales Discounts',2700,''],['','Accounts Receivable','',90000],['','Sales Returns',4500,''],['','Cash','',4500],['','Inventory',3600,''],['','Cost of Goods Sold','',3600]])}${calc([['Gross sales',140000],['Less: sales discounts','(2,700)'],['Less: sales returns','(4,500)'],['=Net sales','$132,800']])}</div>`},
{t:'Bad debts and the allowance method',lo:3,h:`
${kt('Bad debt','Allowance for bad debts','Net realizable value','Write-off')}
<p class="lead">Some customers never pay. The question is <b>when</b> to record that loss.</p>
${tbl(['','Direct write-off method','Allowance method'],[['Records the loss…','when a specific account is found worthless','at period-end, by estimate, before the loss is known'],['GAAP?','<b>No</b> — violates matching','<b>Yes</b>'],['Balance-sheet receivable','At full amount (overstated)','At net realizable value']],{cls:'stack'})}
<h2>Step 1 — Estimate and record at year-end</h2>
<div class="ex" data-t="Recording the estimate"><p>Because of an economic downturn, Hot Pot estimates its receivables are impaired by NT$4,500.</p>${je([['Dec 31','Bad Debt Expense',4500,''],['','Allowance for Bad Debts','',4500],['To record estimated bad debts for the year.']])}<p>Bad Debt Expense is a <b>selling expense</b> on the income statement. The Allowance is a <b>contra-asset</b> deducted from Accounts Receivable.</p></div>
<h2>Step 2 — Write off a specific account</h2>
<div class="ex" data-t="Writing off Jake Palmer"><p>In 2018, Jake Palmer's NT$1,500 account is identified as uncollectible.</p>${je([['2018','Allowance for Bad Debts',1500,''],['','Accounts Receivable','',1500],['Wrote off Jake Palmer\'s account.']])}
${tbl(['','Before write-off','After write-off'],[['Accounts receivable','50,000','48,500'],['Less: allowance','4,500','3,000'],['Net realizable value','45,500','45,500']],{num:[1,2],tot:true})}<p>The write-off changes <b>neither</b> net receivables <b>nor</b> income — the expense was already recorded when estimated.</p></div>
<h2>Step 3 — Recovery of an account written off</h2>
<div class="ex" data-t="Jake Palmer pays after all"><p>Two entries: reinstate the account, then record the collection.</p>${je([['','Accounts Receivable',1500,''],['','Allowance for Bad Debts','',1500],['Reinstated account previously written off.'],['','Cash',1500,''],['','Accounts Receivable','',1500],['Collected in full.']])}</div>
<div class="tip"><p>Exercise 4 favourites: a write-off under the allowance method has <b>no effect on net income</b> (under direct write-off it <b>decreases</b> income). A recovery <b>increases the allowance</b> and has <b>no effect on bad-debt expense or net income</b>.</p></div>`},
{t:'Estimating uncollectible accounts',lo:4,h:`
${kt('Aging of accounts receivable','Percentage of sales method')}
<p class="lead">How do we arrive at the estimate? Two families of methods.</p>
${tbl(['Approach','Method','Focus','What you compute'],[['Income-statement','Percentage of (credit) sales','Matching expense to sales','The <b>expense</b> directly'],['Balance-sheet','Percentage of total receivables','Valuing receivables','The required <b>ending allowance</b>'],['Balance-sheet','Aging the receivables','Valuing receivables (more accurate)','The required <b>ending allowance</b>']],{cls:'stack'})}
<div class="warn"><p>With the <b>balance-sheet</b> methods you compute the <b>target balance</b> of the allowance, then record only the amount needed to reach it — so the existing balance matters. With the <b>percentage-of-sales</b> method the result <i>is</i> the expense; the existing allowance balance is ignored.</p></div>
<div class="ex" data-t="Percentage of total receivables"><p>Hot Pot estimates 12% of its NT$50,000 year-end receivables is uncollectible. Required allowance = 50,000 × 12% = NT$6,000 (so the collectible value is NT$44,000).</p>
${je([['(a) Allowance had a 0 balance','Bad Debt Expense',6000,''],['','Allowance for Bad Debts','',6000],['(b) Allowance had a NT$2,000 credit balance','Bad Debt Expense',4000,''],['','Allowance for Bad Debts','',4000]])}<p>In (b), 6,000 − 2,000 = 4,000 is enough to bring the allowance up to 6,000.</p></div>
<h2>Aging the receivables</h2>
<p>Each receivable is grouped by how long it is <b>past due</b>; older groups get higher loss percentages, because the longer a debt is unpaid, the less likely it will be paid.</p>
<div class="ex" data-t="Hot Pot's aging schedule (Exhibit 7.3)">${tbl(['Age','Balance','% uncollectible','Estimate'],[['Current','23,000','1.5%','345'],['1–30 days past due','9,990','4%','400'],['31–60 days','12,260','20%','2,452'],['61–90 days','2,250','40%','900'],['91–120 days','1,000','60%','600'],['Over 120 days','1,500','80%','1,200'],['Total','50,000','','5,897']],{num:[1,2,3],tot:true})}
<p>With an existing NT$2,000 credit balance in the allowance:</p>${je([['Dec 31','Bad Debt Expense',3897,''],['','Allowance for Bad Debts','',3897],['To bring the allowance to NT$5,897 (5,897 − 2,000).']])}</div>
<div class="ex" data-t="Solving for the expense (Quiz Yourself)"><p>Credit sales $500,000; allowance at start $14,500; write-offs during the year $12,300; aging says $16,000 will be uncollectible. Use the allowance "T-account":</p>${calc([['Beginning allowance + Expense − Write-offs = Ending allowance',''],['14,500 + Expense − 12,300 = 16,000',''],['=Bad debt expense','$13,800']])}</div>
<div class="ex" data-t="Percentage of sales (added illustration)"><p>If a company instead used 1% of the same $500,000 credit sales, the expense would simply be <b>$5,000</b>, whatever the allowance balance. (Not on your slides; added so you can compare the approaches.)</p></div>
<h2>Presentation</h2>
<p>Hot Pot's partial balance sheet shows Accounts receivable NT$10,000, less Allowance NT$500 = <b>NT$9,500</b>; its income statement shows Bad debt expense NT$500 under operating expenses.</p>`},
{t:'How well are receivables managed?',lo:5,h:`
${kt('Accounts receivable turnover','Average collection period')}
<p class="lead">Two ratios tell you how quickly a company turns its receivables into cash.</p>
${calc([['Accounts receivable turnover = Sales revenue ÷ Average accounts receivable',''],['Average collection period = 365 ÷ Accounts receivable turnover','']])}
<p>Average receivables = (beginning + ending) ÷ 2. A <b>higher</b> turnover and a <b>shorter</b> collection period mean faster collection.</p>
<div class="case" data-t="A supermarket vs an electronics maker">${tbl(['','Carrefour','Philips'],[['Sales (€ millions)','76,495','24,244'],['Average receivables (€ millions)','2,265','4,602'],['Turnover','34 times','5.3 times'],['Collection period','10.7 days','68.9 days']],{num:[1,2]})}<p>Carrefour sells mostly for cash or card to shoppers, so it collects in under 11 days. Philips sells on credit to businesses and waits over two months. Neither is "bad" — always compare with the industry and the company's own credit terms.</p></div>
<div class="ex" data-t="Google, 2015 (Quiz Yourself)">${calc([['Average receivables = (11,556 + 9,383) ÷ 2','$10,469.5 million'],['Turnover = 74,989 ÷ 10,469.5','7.16 times'],['=Collection period = 365 ÷ 7.16','≈ 51 days']])}</div>
<div class="tip"><p>Rule of thumb from Chapter 10: the collection period should not greatly exceed the <b>credit terms</b>. A 51-day collection period with 30-day terms suggests slow-paying customers or loose credit policy. Some exam problems use 360 days instead of 365 — follow the question.</p></div>`},
{t:'Notes receivable',lo:6,h:`
${kt('Maturity date','Dishonored note')}
<p class="lead">A <b>promissory note</b> is a formal credit instrument with a stronger legal claim than an invoice. Companies often accept one to replace an overdue account.</p>
<ul><li><b>Face amount</b> — the amount written on the note.</li><li><b>Issuance date</b> and <b>due (maturity) date</b>.</li><li><b>Interest rate</b> — usually stated per year.</li></ul>
${calc([['Interest revenue = Face value × Annual rate × Term of the note (in years)','']])}
<div class="ex" data-t="HoHo Tea Co. (amounts in £)"><p>May 1, 2017: HoHo Tea accepts a 90-day, 12% note from CoMo Computer to settle CoMo's £5,000 account. (The slide treats 90 days as 3 months.)</p>${je([['May 1','Notes Receivable — CoMo',5000,''],['','Accounts Receivable — CoMo','',5000],['Settled account with a note.']])}
${calc([['Interest = 5,000 × 12% × 3/12','£150']])}${je([['Jul 30','Cash',5150,''],['','Notes Receivable — CoMo','',5000],['','Interest Revenue','',150],['Received face amount plus interest.']])}</div>
<h2>Dishonored notes</h2>
<p>If the maker doesn't pay at maturity, the note is <b>dishonored</b>. It's moved to Accounts Receivable for <b>face plus interest</b> — the company has still earned the interest and still has a claim.</p>
${je([['Jul 30','Accounts Receivable — CoMo',5150,''],['','Notes Receivable — CoMo','',5000],['','Interest Revenue','',150],['Transferred dishonored note to accounts receivable.']])}
<div class="ex" data-t="Pearl Company (Quiz Yourself)"><p>Aug 1: Pearl accepts a two-month, 12% note for Rock Company's $1,000 account. Interest = 1,000 × 12% × 2/12 = $20.</p>${je([['Aug 1','Notes Receivable — Rock',1000,''],['','Accounts Receivable — Rock','',1000],['Oct 1','Cash',1020,''],['','Notes Receivable — Rock','',1000],['','Interest Revenue','',20]])}
<p>If instead the note is dishonored and the bank charges Pearl a $5 fee, Pearl passes the fee on to Rock:</p>${je([['Oct 1','Accounts Receivable — Rock',1025,''],['','Notes Receivable — Rock','',1000],['','Interest Revenue','',20],['','Cash','',5]])}</div>`},
{t:'Foreign-currency receivables',lo:6,h:`
${kt('Foreign currency transaction','Exchange gain or loss','Forward contract')}
<p class="lead">If a sale is priced in another currency, the seller doesn't know how many of its own pesos (or dollars) it will receive until the customer pays. That is a <b>foreign currency transaction</b>.</p>
<p>The rules: record the sale at the exchange rate <b>on the date of sale</b>; then any change in the rate before settlement (or a reporting date in between) is an <b>exchange gain or loss</b>.</p>
<div class="ex" data-t="American Company sells to Korea"><p>American Company sells goods for ₩20,000,000 (Korean won), payment due July 12. It prepares quarterly statements on June 30.</p>
${tbl(['Date','US$ per ₩1','US$ value of receivable','Gain / (loss)'],[['Apr 23 (sale)','0.0010','20,000','—'],['Jun 30 (statements)','0.0007','14,000','(6,000)'],['Jul 12 (collected)','0.0008','16,000','2,000']],{num:[1,2,3]})}
${je([['Apr 23','Accounts Receivable (fc)',20000,''],['','Sales Revenue','',20000],['Jun 30','Foreign Exchange Loss',6000,''],['','Accounts Receivable (fc)','',6000],['Jul 12','Cash',16000,''],['','Accounts Receivable (fc)','',14000],['','Foreign Exchange Gain','',2000]])}
<p>Second quarter: sales $20,000, exchange loss $6,000, receivable $14,000. Third quarter: cash collected $16,000, exchange gain $2,000. Over the whole deal: <b>net exchange loss of $4,000</b> (expected $20,000, received $16,000).</p></div>
<div class="fix"><p>The slide text says the sale was on <b>March 23</b>, but the rate table and entry use <b>April 23</b>. The amounts are the same either way; use the date in the table.</p></div>
<h2>Reducing the risk</h2>
<ul><li>Price the sale in your <b>own currency</b> (then the customer bears the risk).</li><li>Enter a <b>forward contract</b> — agree today on the rate for the future exchange. A forward contract is an example of a <b>derivative</b>.</li></ul>
<div class="ph"><p>For a Philippine company, the "home" (functional) currency is usually the peso, so a sale priced in US dollars creates the same kind of exchange gain or loss as the peso–dollar rate moves (PAS 21).</p></div>`}
],

hook:'From the stockroom to cost of goods sold: counting, costing and controlling the goods a business sells or makes.',
los:['Define inventory and describe merchandise and manufacturing inventories and their cost flows.','Compare the periodic and perpetual inventory systems and record purchases and sales under each.','Determine which goods and which costs belong in inventory, including purchase discounts.','Apply FIFO, LIFO, weighted-average and specific identification under periodic and perpetual systems.','Describe materials control procedures, documents and the accounting entries for materials.','Compute the economic order quantity, order point and safety stock.','Account for spoiled units, defective units, scrap and waste.'],
why:`<p>For a pharmacy, a bakery or a manufacturer, inventory is often the biggest current asset — and cost of goods sold the biggest expense. Get inventory wrong and both the balance sheet and profit are wrong at the same time.</p><p>This chapter, built from your "Accounting for Materials" deck, covers two halves: the <b>financial-accounting</b> side (periodic vs perpetual, cost-flow methods — heavily tested on your pre-midterm) and the <b>cost-accounting</b> side (how a factory controls, orders and accounts for raw materials, including EOQ and spoilage).</p>`,
terms:{
'Inventory':'Assets held for sale in the ordinary course of business, in production for sale (work in process), or to be used up in production (raw materials and supplies).',
'Merchandise inventory':'Goods bought ready-made for resale.',
'Raw materials':'Materials on hand that will be used to make products.',
'Work in process':'Partly finished products still in production (WIP).',
'Finished goods':'Completed products ready for sale.',
'Periodic inventory system':'No running record of inventory; ending inventory is found by physical count and cost of goods sold is computed at period-end.',
'Perpetual inventory system':'A continuous record of inventory, updated with every purchase and sale; cost of goods sold is recorded at each sale.',
'Cost of goods sold':'The cost of the inventory sold during the period (COGS).',
'Cost of goods available for sale':'Beginning inventory plus net purchases.',
'FOB shipping point':'Ownership passes to the buyer when goods leave the seller; the buyer pays freight.',
'FOB destination':'Ownership passes when goods reach the buyer; the seller pays freight.',
'Consignment':'Goods held by a dealer (consignee) for sale on behalf of the owner (consignor); they remain the consignor\'s inventory.',
'Freight-in':'Transportation cost on goods purchased; part of inventory cost.',
'Gross method':'Recording purchases at the full invoice price; discounts taken are recorded when paid.',
'Net method':'Recording purchases at the price net of the cash discount; discounts not taken are recorded as interest/discounts lost.',
'FIFO':'First-in, first-out: the oldest costs go to cost of goods sold; ending inventory is at the newest costs.',
'LIFO':'Last-in, first-out: the newest costs go to cost of goods sold; ending inventory is at the oldest costs. Not permitted under PFRS/IFRS.',
'Weighted average':'Cost of goods available for sale ÷ units available; one average unit cost for the period (periodic).',
'Moving average':'A new average unit cost computed after every purchase (perpetual).',
'Specific identification':'Each unit is tracked at its own actual cost.',
'Purchase requisition':'Form used by the storekeeper to tell the purchasing agent that materials are needed.',
'Purchase order':'The order, prepared by the purchasing agent, that authorises the supplier to ship materials.',
'Receiving report':'Form the receiving clerk uses to count and identify materials received.',
'Materials requisition':'Form authorised factory staff use to withdraw materials from the storeroom.',
'Debit-credit memorandum':'Document used when a shipment does not match the order and/or the invoice.',
'Economic order quantity':'EOQ — the order size that minimises total ordering and carrying costs.',
'Ordering cost':'Costs of placing and receiving orders: purchasing staff, communication, record-keeping.',
'Carrying cost':'Costs of holding stock: storage, handling, interest, insurance, taxes, theft, obsolescence.',
'Lead time':'The time between placing an order and receiving the materials.',
'Order point':'The stock level at which a new order should be placed: daily usage × lead time (plus safety stock).',
'Safety stock':'Extra inventory kept as a cushion against stock-outs.',
'Spoiled units':'Units that fail production standards and are sold for salvage value or discarded.',
'Defective units':'Units that fail standards but can be reworked into good or irregular units.',
'Scrap':'Leftover material that cannot be reused for the same purpose but may be sold or used elsewhere.',
'Waste':'Leftover material with no use or resale value, which may cost money to dispose of.',
'Gross profit ratio':'Gross profit ÷ net sales.',
'Inventory turnover':'Cost of goods sold ÷ average inventory.'},
lessons:[
{t:'What inventory is and how its cost flows',lo:1,h:`
${kt('Inventory','Merchandise inventory','Raw materials','Work in process','Finished goods')}
<p class="lead"><b>Inventory</b> is assets a company (1) intends to <b>sell</b> in the normal course of business, (2) has <b>in production</b> for future sale, or (3) uses up in <b>producing</b> goods to be sold.</p>
${tbl(['Merchandiser','Manufacturer'],[['One account: <b>Merchandise Inventory</b> — goods bought ready for resale','Three accounts: <b>Raw Materials</b>, <b>Work in Process</b>, <b>Finished Goods</b>']])}
<p>Inventory control is a key feature of any cost-accounting system: inventory includes raw materials, work in progress, finished and semi-finished products, spare parts and by-products.</p>
<h2>Manufacturing cost flow</h2>
<figure><svg viewBox="0 0 660 200" role="img" aria-label="Manufacturing inventory cost flow"><defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="a"/></marker></defs>
<g text-anchor="middle" font-size="13" font-weight="700"><rect x="10" y="20" width="130" height="44" rx="8" class="al"/><text x="75" y="47">Raw Materials</text>
<rect x="10" y="80" width="130" height="44" rx="8" class="al"/><text x="75" y="107">Direct Labor</text>
<rect x="10" y="140" width="130" height="44" rx="8" class="al"/><text x="75" y="160">Manufacturing</text><text x="75" y="176">Overhead</text>
<rect x="250" y="80" width="130" height="44" rx="8" class="a"/><text x="315" y="107" class="wt">Work in Process</text>
<rect x="420" y="80" width="110" height="44" rx="8" class="a"/><text x="475" y="107" class="wt">Finished Goods</text>
<rect x="560" y="80" width="94" height="44" rx="8" class="al"/><text x="607" y="100">Cost of</text><text x="607" y="116">Goods Sold</text></g>
<path d="M142 42c60 0 60 50 104 54M142 102h104M142 162c60 0 60-50 104-54M382 102h34M532 102h24" class="as" stroke-width="2" marker-end="url(#a7)"/>
<g font-size="11.5" class="mu"><text x="188" y="54">(4) used</text><text x="182" y="96">(5) applied</text><text x="188" y="160">(6) applied</text><text x="399" y="142" text-anchor="middle">(7) completed</text><text x="543" y="142" text-anchor="middle">(8) sold</text></g></svg><figcaption>(1)–(3) costs are incurred; (4)–(6) they enter production; (7) finished units transfer out; (8) sold units become cost of goods sold.</figcaption></figure>
<div class="ph"><p>Exercise items based on <b>PAS 2</b>: inventories include materials or supplies consumed in production <i>or in rendering services</i>; a property developer's lots held for sale <b>are</b> inventory; a factory's machinery is <b>not</b> (it's PPE); a brokerage's shares held for resale are inventory for that business.</p></div>`},
{t:'Periodic versus perpetual systems',lo:2,h:`
${kt('Periodic inventory system','Perpetual inventory system','Cost of goods sold','Cost of goods available for sale')}
<p class="lead">Two systems measure ending inventory and cost of goods sold (COGS).</p>
${tbl(['Event','Periodic','Perpetual'],[['Purchase of inventory','Dr <b>Purchases</b>','Dr <b>Inventory</b>'],['Sale of inventory','Record the sale only — no COGS entry','Record the sale <b>and</b> Dr COGS / Cr Inventory'],['Returns, freight, discounts','Separate accounts (Purchase Returns, Freight-in, Purchase Discounts)','Directly in Inventory'],['End of period','Physical count → compute COGS','No separate COGS computation needed (count still taken to check)']],{cls:'stack'})}
<h2>The periodic COGS model</h2>
${calc([['Beginning inventory',''],['+ Net purchases',''],['=Cost of goods available for sale',''],['− Ending inventory (from physical count)',''],['=Cost of goods sold','']])}
<div class="ex" data-t="Matrix, Inc. — both systems"><p>Matrix buys $600,000 of merchandise on account and sells goods costing $540,000 for $820,000 on account. Beginning inventory was $120,000; the year-end count shows $180,000.</p>
<p><b>Perpetual</b></p>${je([['','Inventory',600000,''],['','Accounts Payable','',600000],['','Accounts Receivable',820000,''],['','Sales','',820000],['','Cost of Goods Sold',540000,''],['','Inventory','',540000]])}
<p><b>Periodic</b></p>${je([['','Purchases',600000,''],['','Accounts Payable','',600000],['','Accounts Receivable',820000,''],['','Sales','',820000],['No COGS entry at the time of sale.']])}
${calc([['Beginning inventory',120000],['Plus: purchases',600000],['Cost of goods available for sale',720000],['Less: ending inventory','(180,000)'],['=Cost of goods sold','$540,000']])}
${je([['12/31','Cost of Goods Sold',540000,''],['','Inventory (ending)',180000,''],['','Inventory (beginning)','',120000],['','Purchases','',600000],['Year-end entry to record COGS.']])}</div>
<div class="ex" data-t="A perpetual stock card"><p>Item "Super X", unit cost ₱200, storage room:</p>${tbl(['Date','Explanation','Qty in','Qty out','On hand','Balance (₱)'],[['Jan 1','Beginning','','','8','1,600'],['Jan 31','Sold','','5','3','600'],['Feb 5','Purchased','10','','13','2,600'],['Mar 6','Sales return','','(1)','12','2,400']],{num:[2,3,4,5]})}<p>Recap: purchases 10 units (₱2,000); COGS 4 units net (₱800); ending 12 units (₱2,400).</p></div>
<h2>Pros and cons</h2>
<p><b>Perpetual advantages:</b> continuous inventory amounts; COGS without a count; data for min/max stock levels and for quantities at each location; a basis for measuring theft; records sales at both price and cost; easily computerised. <b>Disadvantages:</b> time-consuming, costly, more clerical work.</p>
<p><b>Periodic disadvantages:</b> requires a full physical count each time statements are prepared; weak control for purchasing.</p>
<div class="tip"><p>Pre-midterm/exercise items: "In a periodic system COGS is determined by subtracting ending inventory from goods available for sale" ✓. "Perpetual… does NOT provide COGS information needed to record sales at both price and cost" is the <b>EXCEPT</b> option. And a perpetual business <b>still does</b> physical counts (to detect shrinkage) — "cannot conduct a count" is false.</p></div>`},
{t:'What goes into inventory?',lo:3,h:`
${kt('FOB shipping point','FOB destination','Consignment','Freight-in','Gross method','Net method')}
<p class="lead">General rule: inventory includes <b>all goods the company owns on the inventory date, wherever they are</b>. Two tricky groups: goods in transit and goods on consignment.</p>
${tbl(['Situation','Whose inventory?'],[['In transit, <b>FOB shipping point</b>','Buyer\'s — ownership passed when shipped'],['In transit, <b>FOB destination</b>','Seller\'s — until it arrives'],['Goods <b>on consignment</b> (held by a dealer for the owner)','The owner\'s (consignor), not the dealer\'s'],['Goods sold but held for the customer','The customer\'s']])}
<div class="ex" data-t="General Pharmacy (pre-midterm Q22)"><p>The year-end count of ₱600,000 included the items below. What should ending inventory be?</p>
${calc([['Inventory as counted',600000],['In transit TO a customer, FOB destination — still ours: keep','0'],['In transit FROM supplier, FOB destination — not ours yet','(62,000)'],['Held on consignment from Unilab — Unilab\'s','(22,500)'],['Paid for and held at a patient\'s request — sold','(94,000)'],['Goods carried at selling price ₱150,000 (cost + 20%): cost = 150,000 ÷ 1.20 = 125,000','(25,000)'],['=Correct ending inventory','₱396,500']])}</div>
<h2>Costs included in inventory</h2>
<p>Inventory cost = invoice price + freight-in − purchase returns − purchase discounts. Under PAS 2 cost also includes import duties and <i>non-recoverable</i> taxes, and (for manufacturers) conversion costs including <b>fixed production overhead</b>.</p>
<div class="warn"><p><b>Not</b> inventory cost (Exercise 4): trade discounts (deducted), <b>recoverable</b> purchase taxes (e.g. input VAT), <b>storage of finished goods</b>, abnormal waste, administrative costs and <b>selling costs</b> — these are expenses.</p></div>
<h2>Gross vs net method for purchase discounts</h2>
<div class="ex" data-t="Matrix: $20,000 on 2/10, n/30, partly paid late">${tbl(['Date','Gross method','Net method'],[['10/5 purchase','Purchases 20,000 / A/P 20,000','Purchases 19,600 / A/P 19,600'],['10/14 pay $14,000 of invoice in time','A/P 14,000 / Purchase Discounts 280 / Cash 13,720','A/P 13,720 / Cash 13,720'],['11/4 pay $6,000 late','A/P 6,000 / Cash 6,000','A/P 5,880 + Interest Expense 120 / Cash 6,000']],{cls:'stack'})}
<p>The <b>net</b> method treats a missed discount as a financing cost — the purchase only ever "cost" 98%. Your Exercise 4 asked which methods may be used: <b>both</b> net and gross.</p></div>
<div class="ex" data-t="Net method, perpetual system"><p>Matrix buys $6,000 on 2/10, n/30; pays $160 freight-in; returns $200 of damaged goods; sells everything for $8,300.</p>${je([['','Inventory (6,000 × 98%)',5880,''],['','Accounts Payable','',5880],['','Inventory',160,''],['','Cash','',160],['','Accounts Payable',200,''],['','Inventory','',200],['','Accounts Receivable',8300,''],['','Sales Revenue','',8300],['','Cost of Goods Sold',5840,''],['','Inventory','',5840]])}<p>COGS = 5,880 + 160 − 200 = $5,840. Under periodic, the same total appears as Purchases 5,880 − Returns 200 + Freight-in 160 = net purchases 5,840.</p></div>
<div class="fix"><p>Strictly, under the net method the returned goods were recorded at net, so the return would be $196 (200 × 98%). The slide uses $200 for simplicity.</p></div>
<div class="ex" data-t="Cost-flow purchase with freight (pre-midterm Q23)"><p>See <a class="xl" href="#c5-3">Lesson 5.3</a> for the trade-discount-plus-cash-discount calculation (₱315,000).</p></div>`},
{t:'Cost-flow methods under the periodic system',lo:4,h:`
${kt('FIFO','LIFO','Weighted average','Specific identification')}
<p class="lead">When identical units are bought at different prices, which cost goes to COGS and which stays in ending inventory? The <b>cost-flow assumption</b> decides — and the physical flow of goods doesn't have to match it.</p>
<div class="tip"><p>Pre-midterm Q2: the primary purpose of a flow assumption is to <b>determine which unit costs are assigned to inventory and which to cost of goods sold</b>.</p></div>
<div class="ex" data-t="Yore Frame, Inc. — September data"><p>A count on September 30 shows 600 frames on hand, so 1,950 − 600 = 1,350 were sold.</p>${tbl(['Date','Units','Unit cost','Total'],[['Beginning inventory','800','$22.00','$17,600'],['Sep 3 purchase','300','24.00','7,200'],['Sep 15 purchase','250','25.00','6,250'],['Sep 21 purchase','200','27.00','5,400'],['Sep 29 purchase','400','28.00','11,200'],['Goods available for sale','1,950','','$47,650']],{num:[1,2,3],tot:true})}</div>
<h2>FIFO — first in, first out</h2>
<p>The oldest costs are sold first; ending inventory is the <b>most recent</b> purchases.</p>
${calc([['Ending inventory: 400 × $28 + 200 × $27 = 11,200 + 5,400','$16,600'],['=COGS: 47,650 − 16,600','$31,050']])}
<h2>LIFO — last in, first out</h2>
<p>The newest costs are sold first; ending inventory is the <b>oldest</b> costs.</p>
${calc([['Ending inventory: 600 × $22 (from beginning inventory)','$13,200'],['=COGS: 47,650 − 13,200 (= 200 × 22 + all purchases 30,050)','$34,450']])}
<h2>Weighted average</h2>
${calc([['Average unit cost = 47,650 ÷ 1,950','$24.4359'],['Ending inventory: 600 × 24.4359','$14,661.54'],['=COGS: 1,350 × 24.4359','$32,988.46']])}
<h2>Specific identification</h2>
<p>Each item is tracked at its own cost (cars, jewellery). Accurate — but if items are identical, management could pick which costs to "sell," so <b>income can be manipulated</b>.</p>
<h2>When prices are rising</h2>
${tbl(['','FIFO','LIFO'],[['COGS','Lower (older, cheaper costs)','Higher (newer costs)'],['Ending inventory','Close to current replacement cost','Old, low costs'],['Net income and taxes','Higher','Lower'],['Allowed under PFRS/IFRS?','Yes','<b>No</b>']],{cls:'stack'})}
<div class="fix"><p>The slide says LIFO "is not officially endorsed" by PFRS/IFRS. More precisely, <b>PAS 2 prohibits LIFO</b>; only FIFO, weighted average and specific identification are allowed. LIFO still appears in exams (and is allowed under US GAAP), so you must be able to compute it.</p></div>`},
{t:'Cost-flow methods under the perpetual system',lo:4,h:`
${kt('Moving average')}
<p class="lead">Under perpetual, costs are assigned <b>at each sale</b>, so the timing of sales matters. Yore Frame's sales were: <b>600 units on Sep 1, 300 on Sep 10, 450 on Sep 30</b>.</p>
<h2>FIFO perpetual — same answer as periodic</h2>
${tbl(['Sale','Oldest units on hand at that moment','COGS'],[['Sep 1 — 600','600 @ $22 (beginning)','13,200'],['Sep 10 — 300','200 @ $22 + 100 @ $24','6,800'],['Sep 30 — 450','200 @ $24 + 250 @ $25','11,050'],['Total','','31,050']],{num:[2],tot:true})}
<p>Units left: <b>200 @ $27 + 400 @ $28 = $16,600</b>. COGS <b>$31,050</b> — identical to periodic FIFO.</p>
<h2>LIFO perpetual — differs from periodic</h2>
${tbl(['Sale','Newest units on hand at that moment','COGS'],[['Sep 1 — 600','600 from beginning inventory @ $22','13,200'],['Sep 10 — 300','all 300 from the Sep 3 purchase @ $24','7,200'],['Sep 30 — 450','400 @ $28 (Sep 29) + 50 @ $27 (Sep 21)','12,550'],['Total','','32,950']],{num:[2],tot:true})}
${calc([['Ending inventory: 200 @ $22 + 250 @ $25 + 150 @ $27 = 4,400 + 6,250 + 4,050','$14,700']])}
<h2>Moving average</h2>
<p>A new average is computed after every purchase:</p>
${tbl(['Date','Event','Units','Unit cost','Balance'],[['Beginning','','800','22.000','17,600.00'],['Sep 1','Sold 600 @ 22.000 (13,200)','200','22.000','4,400.00'],['Sep 3','Bought 300 @ 24','500','23.200','11,600.00'],['Sep 10','Sold 300 @ 23.200 (6,960)','200','23.200','4,640.00'],['Sep 15–29','Bought 250, 200, 400','1,050','26.181','27,490.00'],['Sep 30','Sold 450 @ 26.181 (11,781.45)','600','26.181','15,708.55']],{num:[2,3,4]})}
${calc([['New average after Sep 3 = 11,600 ÷ 500','$23.200'],['New average after Sep 29 = 27,490 ÷ 1,050','$26.181'],['=COGS = 13,200 + 6,960 + 11,781.45','$31,941.45']])}
<h2>Summary (perpetual)</h2>
${tbl(['','Average','FIFO','LIFO'],[['Cost of goods sold','31,941','31,050','32,950'],['Ending inventory','15,709','16,600','14,700'],['Total (always = goods available)','47,650','47,650','47,650']],{num:[1,2,3],tot:true})}
<div class="tip"><p>FIFO gives the <b>same</b> results under periodic and perpetual. LIFO and average generally do <b>not</b>, because the "last-in" or "average" at the moment of each sale depends on the timing of purchases.</p></div>

<h2>Two inventory ratios</h2>
${calc([['Gross profit ratio = Gross profit ÷ Net sales',''],['Inventory turnover = Cost of goods sold ÷ Average inventory','']])}
<p>Low turnover versus the industry suggests excess or wrong inventory. Inventory write-downs and changes in inventory method are ways earnings can be manipulated, reducing <b>earnings quality</b>. See <a class="xl" href="#c10-4">Lesson 10.4</a>.</p>`},
{t:'Controlling and accounting for materials',lo:5,h:`
${kt('Purchase requisition','Purchase order','Receiving report','Materials requisition','Debit-credit memorandum')}
<p class="lead">In a factory, raw materials are cash in another form. Effective cost control needs: assigned duties, a list of who may approve spending, goals, reports comparing goals to actual, corrective action, and follow-up.</p>
<p><b>Physical control:</b> limited access to storage areas, segregation of duties, accurate recording. <b>Investment control:</b> keep enough stock, of enough variety, without tying up working capital needed elsewhere.</p>
<h2>The people</h2>
${tbl(['Person','Responsibility'],[['Purchasing agent','Buys raw materials'],['Receiving clerk','Receives incoming shipments'],['Storeroom keeper','Has charge of materials after receipt; keeps bin cards'],['Production supervisor','Runs the department that uses the materials']])}
<h2>The paper trail</h2>
<ol class="steps"><li>Stock reaches its <b>re-order point</b> → storekeeper prepares a <b>purchase requisition</b>.</li><li>Purchasing chooses the best supplier (quality, price) and issues a <b>purchase order</b>.</li><li>Goods arrive → receiving clerk counts them on a <b>receiving report</b> and compares with the PO. The <b>vendor's invoice</b> is checked against both. A <b>debit-credit memorandum</b> is used if they don't match.</li><li>A foreman needs materials → presents a <b>materials requisition</b>; storekeeper checks authorisation, issues, updates the bin card. Unused items come back with a <b>returned materials report</b>.</li><li>Accounting prices the requisition (FIFO, average…) and charges the job or overhead.</li></ol>
<h2>Materials accounting entries</h2>
${je([['','Materials',"xx",''],['','Accounts Payable','',"xx"],['Purchased from vendor.'],['','Work in Process (direct materials)',"xx",''],['','Factory Overhead Control (indirect materials)',"xx",''],['','Materials','',"xx"],['Issued to production.'],['','Accounts Payable',"xx",''],['','Cash','',"xx"],['Paid the vendor.'],['','Finished Goods',"xx",''],['','Work in Process','',"xx"],['Transferred completed work.'],['','Accounts Receivable',"xx",''],['','Sales','',"xx"],['','Cost of Goods Sold',"xx",''],['','Finished Goods','',"xx"],['Sold finished goods on account.']])}
<div class="tip"><p>The Materials account in the general ledger is supported by a <b>stores (materials) ledger</b> with one account per item — a subsidiary ledger (<a class="xl" href="#c2-4">Lesson 2.4</a>). Exercise 4: Work in Process does <b>not</b> track all direct-material <i>purchases</i> — only materials <i>issued</i> to jobs.</p></div>`},
{t:'How much to order, and when: EOQ, order point, safety stock',lo:6,h:`
${kt('Economic order quantity','Ordering cost','Carrying cost','Lead time','Order point','Safety stock')}
<p class="lead">Order too often and you drown in ordering costs; order too much at once and you pay to store it. The <b>economic order quantity (EOQ)</b> is the order size that minimises the two together.</p>
<p><b>Ordering costs:</b> purchasing/receiving/inspection wages, communication, accounting and record-keeping. <b>Carrying costs:</b> storage and handling, interest on money tied up, insurance and taxes, theft, deterioration and obsolescence, records. A third cost, <b>stock-out cost</b>, is lost sales, lost goodwill and expensive rush orders.</p>
<h2>Tabular method</h2>
<div class="ex" data-t="Annual demand 10,000 units; ₱10 per order; carrying cost ₱0.80 per unit per year">${tbl(['Order size','No. of orders','Ordering cost','Average inventory','Carrying cost','Total cost'],[['100','100','1,000','50','40','1,040'],['300','33','330','150','120','450'],['500','20','200','250','200','<b>400</b>'],['700','14','140','350','280','420'],['900','11','110','450','360','470']],{num:[0,1,2,3,4,5]})}
<p>Orders = demand ÷ order size; average inventory = order size ÷ 2; carrying cost = average inventory × ₱0.80. The minimum total is at 500 units. Ordering and carrying costs move in <b>opposite directions</b>.</p></div>
<h2>Formula method</h2>
${calc([['EOQ = √(2 × O × Q ÷ C)',''],['O = cost per order; Q = annual units required; C = carrying cost per unit per year','']])}
<div class="ex" data-t="Formula, same data">${calc([['EOQ = √(2 × 10,000 × 10 ÷ 0.80) = √250,000','500 units']])}</div>
<div class="ex" data-t="Part X"><p>Annual use 5,000 units; ordering cost $10; unit cost $0.50; carrying cost 10% of unit cost.</p>${calc([['C = 0.50 × 10%','$0.05'],['EOQ = √(2 × 5,000 × 10 ÷ 0.05) = √2,000,000','≈ 1,414 units']])}</div>
<figure><svg viewBox="0 0 480 240" role="img" aria-label="EOQ cost curves"><path d="M50 20v180h410" class="ln" stroke-width="1.5"/><path d="M60 40 C120 150 220 175 450 182" class="ln" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M60 192 L450 70" class="as" stroke-width="2.5"/><path d="M70 60 C140 150 190 120 230 118 C300 116 380 88 450 52" class="as" stroke-width="3.5"/><path d="M228 118v82" class="ln" stroke-dasharray="3 4"/><circle cx="228" cy="118" r="5" class="a"/><text x="232" y="216" font-size="12" text-anchor="middle">EOQ</text><text x="455" y="48" font-size="12" text-anchor="end">Total cost</text><text x="455" y="88" font-size="12" text-anchor="end">Carrying cost</text><text x="440" y="176" font-size="12" text-anchor="end">Ordering cost</text><text x="60" y="16" font-size="12">Cost</text><text x="455" y="216" font-size="12" text-anchor="end">Units per order</text></svg><figcaption>Ordering cost falls as order size grows; carrying cost rises; total cost is lowest at the EOQ.</figcaption></figure>
<h2>Order point and safety stock</h2>
${calc([['Order point = Daily usage × Lead time (days)',''],['Daily usage 300 × lead time 4 days','1,200 units'],['Add: safety stock',800],['=Revised order point','2,000 units']])}
<p>When stock falls to 1,200 units (or 2,000 with safety stock), order <b>1,414</b> units (the EOQ). Lead time is the gap between placing and receiving an order.</p>`},
{t:'Spoiled units, defective units, scrap and waste',lo:7,h:`
${kt('Spoiled units','Defective units','Scrap','Waste')}
${tbl(['Item','Meaning'],[['<b>Spoiled units</b>','Fail standards; sold for salvage value or thrown away'],['<b>Defective units</b>','Fail standards but can be reworked into good units or "irregulars"'],['<b>Scrap</b>','Leftover material not reusable for the same purpose; may be sold for a small amount'],['<b>Waste</b>','Leftover with no use or resale value; may cost money to dispose of']])}
<h2>Spoiled units: two treatments</h2>
<p><b>Charged to all production</b> — spoilage is normal to the process (within the company's limit). An allowance is built into the factory overhead rate; the loss goes to Factory Overhead Control, so the job's unit cost doesn't rise. <b>Charged to the specific job</b> — the job's exacting specifications caused it; the loss stays in the job, raising the cost of its good units. Abnormal spoilage (above the limit) goes to a <b>loss account</b>.</p>
<div class="ex" data-t="Job 3056: 4,000 units at ₱40 each"><p>Unit costs: direct materials ₱15, direct labor ₱13, overhead ₱12 (including a ₱1 allowance for spoiled work). 200 units (a normal number) were rejected and sold for ₱18 each.</p>
<p><b>1. Loss charged to all production</b></p>${je([['a','Work in Process (4,000 × 40)',160000,''],['','Materials (× 15)','',60000],['','Payroll (× 13)','',52000],['','Factory Overhead Applied (× 12)','',48000],['b','Spoiled Goods (200 × 18)',3600,''],['','Factory Overhead Control (loss)',4400,''],['','Work in Process (200 × 40)','',8000],['c','Finished Goods (3,800 × 40)',152000,''],['','Work in Process','',152000]])}
<p><b>2. Loss charged to the specific job</b> — the overhead rate excludes the ₱1 allowance (₱11):</p>${je([['a','Work in Process',156000,''],['','Materials','',60000],['','Payroll','',52000],['','Factory Overhead Applied (× 11)','',44000],['b','Spoiled Goods',3600,''],['','Work in Process','',3600],['c','Finished Goods',152400,''],['','Work in Process','',152400]])}
<p>Good units now cost 152,400 ÷ 3,800 = <b>₱40.11</b> each, slightly above ₱40.</p></div>
<h2>Defective units</h2>
<div class="ex" data-t="Reworking 300 defective units"><p>Rework costs: materials ₱2,000, labor ₱4,000, overhead ₱2,000 (total ₱8,000).</p>${tbl(['','Charged to all production','Charged to the job'],[['Rework entry','Dr Factory Overhead Control 8,000 / Cr Materials 2,000, Payroll 4,000, FOH Applied 2,000','Dr Work in Process 8,000 / Cr the same three'],['Transfer to finished goods','160,000 (4,000 × ₱40)','164,000 (156,000 + 8,000)']],{cls:'stack'})}</div>
<h2>Scrap and waste</h2>
${tbl(['Situation','Entry'],[['Scrap traceable to a job','Dr Scrap Materials / Cr Work in Process'],['Scrap not traceable to a job','Dr Scrap Materials / Cr Factory Overhead Control'],['Scrap from factory supplies / value unknown until sold','Dr Cash / Cr Scrap Revenue (Miscellaneous Income)'],['Waste disposal, all jobs','Dr Factory Overhead Control / Cr Accounts Payable'],['Waste disposal, specific job','Dr Work in Process — Job / Cr Accounts Payable']],{cls:'stack'})}
<div class="warn"><p>Scrap or waste above a predetermined normal rate signals inefficiency; management should investigate. Disposal costs are expected to rise as landfills fill up.</p></div>`}
],

CH.push({n:8,color:'#36454f',title:'Property, Plant & Equipment and Intangibles',
hook:'Machines, buildings, patents and goodwill: what they cost, how their cost is spread over the years, and what happens when they go.',
los:['Distinguish expenditures that are capitalised from those that are expensed, and name the types of long-lived assets.','Determine the cost of property, plant and equipment.','Compute depreciation by the straight-line, declining-balance, sum-of-the-years\'-digits and units-of-production methods.','Account for changes in estimates, disposals, impairment, exchanges and group depreciation.','Account for natural resources (depletion) and describe tax depreciation incentives.','Account for intangible assets, goodwill, leasehold improvements, deferred charges and R&D, and analyse long-lived assets.'],
why:`<p>A hospital's MRI machine, a delivery van, a bakery's oven, a drug patent — they cost a lot and help earn revenue for years. Charging the whole cost to expense in the year of purchase would make that year look terrible and every later year look too good. So accountants <b>capitalise</b> the cost (record it as an asset) and spread it over the years of use.</p><p>The deck calls this "amortization" in its broadest sense: matching the cost of capital assets with the revenues they help produce. Your Exercise 5 (PPE) was the toughest quiz so far — most missed items were about <b>what goes into cost</b> and <b>partial-year depreciation</b>, so those get extra worked examples here.</p>`,
terms:{
'Capitalise':'To record an expenditure as an asset because it will benefit future periods.',
'Capital expenditure':'Spending that benefits future periods and is added to an asset\'s cost (e.g. a betterment).',
'Revenue expenditure':'Spending that benefits only the current period and is expensed (e.g. ordinary repairs).',
'Property, plant and equipment':'Tangible assets used in operations for more than one period (PPE, also "fixed assets").',
'Intangible asset':'A long-lived asset with no physical substance, such as a patent, copyright or trademark.',
'Betterment':'An improvement that makes an asset better than when bought; capitalised.',
'Basket purchase':'Buying several assets for one price; the cost is split by their relative fair values.',
'Depreciable amount':'Cost minus residual value — the total to be depreciated over the asset\'s life.',
'Residual value':'The estimated amount an asset will be worth at the end of its useful life (salvage value).',
'Useful life':'The period over which an asset is expected to be used, or the number of units it is expected to produce (service life).',
'Obsolescence':'Loss of usefulness because of changes in technology or tastes.',
'Deterioration':'The physical process of wearing out.',
'Straight-line method':'Depreciation = (cost − residual value) ÷ useful life; equal each year.',
'Declining-balance method':'Depreciation = book value × a fixed rate; double-declining uses 2 × the straight-line rate.',
'Sum-of-the-years\' digits':'An accelerated method: (cost − residual) × remaining life ÷ SYD, where SYD = n(n+1)/2.',
'Units-of-production method':'Depreciation per unit = cost ÷ estimated total units (less residual), times units produced.',
'Accelerated depreciation':'Methods that charge more depreciation in early years and less later.',
'Half-year convention':'Taking half a year\'s depreciation in the years of acquisition and disposal.',
'Change in accounting estimate':'A revision of useful life or residual value; it affects current and future depreciation only.',
'Impairment':'When an asset\'s recoverable benefits fall below its book value, requiring a write-down.',
'Group depreciation':'Depreciating similar assets as one pool rather than item by item.',
'Natural resources':'Assets such as oil reserves, mineral deposits and timber that are physically used up.',
'Depletion':'Allocating the cost of a natural resource to the units extracted.',
'Goodwill':'The excess of the price paid for a business over the fair value of its identifiable net assets.',
'Leasehold improvements':'Improvements made to leased property; they revert to the owner and are amortised over the shorter of their life or the lease.',
'Deferred charges':'Costs (such as start-up costs) carried forward to be amortised over future periods.',
'Research and development':'Costs to develop new knowledge or products, or improve processes.',
'MACRS':'The US Modified Accelerated Cost Recovery System for tax depreciation.'},
lessons:[
{t:'Long-lived assets: asset or expense?',lo:1,h:`
${kt('Capitalise','Capital expenditure','Revenue expenditure','Property, plant and equipment','Intangible asset','Betterment')}
<p class="lead">Every expenditure buys a benefit. If the benefit is used up <b>this period</b>, it's an <b>expense</b>. If it will be enjoyed in <b>future periods</b>, it is <b>capitalised</b> — recorded as an asset and expensed gradually.</p>
<p>The deck's analogy: think of a capital asset as a <b>bundle of services</b>. Like a prepaid expense (<a class="xl" href="#c3-3">Lesson 3.3</a>), its cost is expensed as the company uses up the services.</p>
<h2>Types of long-lived assets and how their cost is written off</h2>
${tbl(['Type','Examples','Cost written off by…'],[['Land','Lot under a building','<b>Nothing</b> — not depreciated'],['Plant and equipment','Buildings, machines, vehicles','<b>Depreciation</b>'],['Natural resources','Oil wells, mines, timber','<b>Depletion</b>'],['Limited-life intangibles','Patents, copyrights','<b>Amortisation</b>'],['Indefinite-life intangibles, goodwill','Renewable broadcast licence; goodwill','No amortisation — <b>impairment tests</b>'],['Deferred charges','Some start-up costs','Amortisation (see Lesson 8.6)'],['Research and development','Lab costs','Not capitalised under the slides\' GAAP — expensed']],{cls:'stack'})}
<h2>Asset or expense? Practical rules</h2>
<ul><li><b>Small items</b> may be expensed even if they last years (materiality, <a class="xl" href="#c1-5">Lesson 1.5</a>) — but a <b>large purchase of small items</b> (500 office chairs) is capitalised.</li><li><b>Repairs and maintenance</b> keep an asset working as before → expense (revenue expenditure).</li><li><b>Betterments</b> make the asset better than when purchased → capitalise (capital expenditure).</li><li><b>Replacements</b> depend on how the "asset unit" is defined: replacing a whole engine may be capitalised; replacing a small part is expensed.</li></ul>
<div class="ex" data-t="Windshield wiper (pre-midterm Q8)"><p>A new windshield wiper on a delivery vehicle is routine maintenance — a <b>revenue expenditure</b>, expensed immediately.</p></div>
<div class="ex" data-t="Land isn't depreciated (Exercise 5)"><p>"Land ₱10,000, salvage value ₱1,000, useful life 9 years — depreciable amount and annual depreciation?" Both are <b>₱0</b>: land has an unlimited life and is never depreciated. Don't be tricked by the extra numbers.</p></div>`},
{t:'What goes into the cost of PPE',lo:2,h:`
${kt('Basket purchase')}
<p class="lead">The cost of PPE is <b>all expenditures necessary to get the asset ready for its intended use</b> — the price plus every reasonable cost of bringing it to its location and condition.</p>
${tbl(['Included in cost','Not included (expense)'],[['Purchase price, less trade and cash discounts','Repairs after it\'s in use'],['Import duties, non-refundable purchase taxes','Recoverable taxes (input VAT)'],['Freight, handling, delivery','Interest/charges from paying on instalment (beyond cash price)'],['Installation, assembly, testing and trial runs','Training staff, opening ceremonies, admin overhead'],['Professional fees (engineers, architects)','Costs after the asset is ready for use']],{cls:'stack'})}
<p><b>Self-constructed assets:</b> all construction costs — materials, direct labour and overhead. <b>Acquired for something other than cash:</b> record at the fair market value of what is given or received. <b>Basket purchase</b> (several assets for one price, e.g. land and building): allocate the total by the assets' relative fair values.</p>
<div class="ex" data-t="Romy Company's computer (Exercise 5)"><p>List price ₱152,000; trade discount ₱56,000; installation and assembly ₱3,200; delivery and handling ₱6,400; 2% purchase discount.</p>${calc([['List price less trade discount (152,000 − 56,000)',96000],['Less 2% cash discount','(1,920)'],['Net purchase price',94080],['Add installation and assembly',3200],['Add initial delivery and handling',6400],['=Cost of the computer','₱103,680']])}<p>This is the asset's cost on the statement of financial position — none of it is an expense at purchase.</p></div>
<div class="ex" data-t="Imported equipment (Exercise 5)"><p>Peso price ₱330,000; import duties ₱10,000; non-refundable purchase taxes ₱15,000; transport ₱2,000; installation, testing and trial runs ₱4,000.</p>${calc([['Purchase price',330000],['Import duties',10000],['Non-refundable taxes',15000],['Transport',2000],['Installation, testing, trial runs',4000],['=Initial cost','₱361,000']])}<p>All five items are needed to make the machine ready for use, so all are capitalised (PAS 16).</p></div>
<div class="ex" data-t="Buying on instalment (Exercise 5)"><p>Machinery bought for ₱50,000 down plus 24 monthly payments of ₱25,000 (₱650,000 in total). Its <b>cash-equivalent price is ₱550,000</b> — that is the cost. The extra ₱100,000 is interest, expensed over the payment period. With a 10-year life and ₱25,000 residual value: (550,000 − 25,000) ÷ 10 = <b>₱52,500</b> per year.</p></div>
<div class="warn"><p>Your Exercise 5 calls residual value "impairment value" in some items. Read it as <b>residual (salvage) value</b> — the amount deducted before dividing by useful life.</p></div>`},
{t:'Depreciation methods',lo:3,h:`
${kt('Depreciable amount','Residual value','Useful life','Obsolescence','Deterioration','Straight-line method','Declining-balance method','Sum-of-the-years\' digits','Units-of-production method','Accelerated depreciation')}
<p class="lead"><b>Depreciation</b> is the systematic allocation of an asset's cost to the periods in which it provides benefit — the gradual conversion of cost into expense. It is a cost consumed, not a fall in market value.</p>
<h2>Three judgements</h2>
<ol><li><b>Service (useful) life</b> — the <i>shorter</i> of physical life (until it wears out: <b>deterioration</b>) and the time until it becomes obsolete (<b>obsolescence</b>).</li><li><b>Residual value</b> at the end of that life. Net cost to depreciate = cost − residual value.</li><li><b>Method</b> of allocation.</li></ol>
${je([['Each year','Depreciation Expense',200,''],['','Accumulated Depreciation','',200],['$1,000 asset, straight-line over 5 years (slide 7-15).']])}
<h2>The four methods, applied to the slide's $1,000, 5-year asset (no residual value)</h2>
${calc([['Straight-line = (Cost − Residual) ÷ Life',''],['Double-declining balance = Book value × (2 × 1/Life)',''],['Sum-of-the-years\' digits = (Cost − Residual) × Remaining life ÷ SYD, where SYD = n(n+1)/2',''],['Units of production = (Cost − Residual) ÷ Total units × Units this period','']])}
<div class="ex" data-t="Comparing methods (figures extend the slide's example)">${tbl(['Year','Straight-line','Double-declining (40%)','SYD (SYD = 15)'],[['1','200','400.00','333.33 (5/15)'],['2','200','240.00','266.67 (4/15)'],['3','200','144.00','200.00 (3/15)'],['4','200','86.40','133.33 (2/15)'],['5','200','129.60*','66.67 (1/15)'],['Total','1,000','1,000.00','1,000.00']],{num:[1,2,3],tot:true})}
<p>DDB rate = 2 × 1/5 = 40% of the <b>book value</b> at the start of each year (residual value is <i>not</i> deducted first): 1,000 × 40% = 400; (1,000 − 400) × 40% = 240; and so on. *In the last year the remaining book value is charged so the asset ends at its residual value (zero here).</p>
<p>Units of production (added illustration): if the asset can make 10,000 units and makes 2,500 this year, depreciation = 1,000 ÷ 10,000 × 2,500 = <b>$250</b>.</p></div>
<p>DDB and SYD are <b>accelerated</b> methods: more expense early, less later. Theoretically, choose the method that gives the best <b>matching</b> of cost with benefits.</p>
<h2>Partial years</h2>
<div class="ex" data-t="Maegan Chua's machine (Exercise 5)"><p>Bought January 1, 2022 for ₱504,000; <b>placed in service March 1</b>; shipping ₱4,000; installation and testing ₱6,000; life 10 years; residual value ₱34,000. Depreciation for 2022?</p>${calc([['Cost = 504,000 + 4,000 + 6,000',514000],['Less residual value','(34,000)'],['Depreciable amount',480000],['Annual depreciation = 480,000 ÷ 10',48000],['=2022: 48,000 × 10/12 (March–December)','₱40,000']])}<p>Depreciation begins when the asset is <b>available for use</b> (March 1), not when it was bought.</p></div>
<div class="tip"><p>Exercise 5, Q19: which is true? "If carrying amount is less than residual value, depreciation is not charged" — <b>true</b>. An asset needn't be depreciated (land), the charge needn't be constant (accelerated methods), and the <i>total cost</i> isn't fully depreciated when there is a residual value.</p></div>`},
{t:'Estimates, disposals, impairment and exchanges',lo:4,h:`
${kt('Half-year convention','Change in accounting estimate','Impairment','Group depreciation')}
<h2>Depreciation miscellany</h2>
<ul><li><b>Changes in estimated life</b> are common. They affect the <b>current and future</b> depreciation only — past years are not restated.</li><li><b>Fully depreciated assets</b> stay on the balance sheet (cost and accumulated depreciation) until disposed of.</li><li><b>Half-year convention</b>: half a year's depreciation in the year bought and the year sold.</li><li><b>Disclosure</b>: depreciation for the year, original cost and accumulated depreciation by category.</li><li><b>Accumulated depreciation</b> doesn't represent any tangible thing or fund — it's the part of original cost already expensed. Replacing the asset is a separate financing decision.</li></ul>
<div class="ex" data-t="Revising a useful life (added illustration)"><p>The $1,000 straight-line asset has book value $600 after 2 years. Management now expects 4 more years (not 3). New depreciation = 600 ÷ 4 = <b>$150</b> a year from year 3. Years 1–2 are left as they were.</p></div>
<h2>Disposals</h2>
<ol class="steps"><li>Record depreciation up to the date of sale.</li><li>Remove the asset's cost and its accumulated depreciation.</li><li>Gain or (loss) = selling price − book value; report it in this period's income statement.</li></ol>
<div class="ex" data-t="Selling equipment (from the Cash-Flow deck)"><p>Computer Services sold equipment costing $8,000 with accumulated depreciation $1,000 (book value $7,000) for $4,000.</p>${je([['','Cash',4000,''],['','Accumulated Depreciation',1000,''],['','Loss on Sale of Equipment',3000,''],['','Equipment','',8000]])}<p>In the cash-flow statement the $4,000 is an investing inflow and the $3,000 loss is added back to net income (<a class="xl" href="#c9-4">Lesson 9.4</a>).</p></div>
<div class="ex" data-t="Typhoon damage (Exercise 5)"><p>A flood destroyed a building with a book value of ₱260,000; insurance paid ₱200,000. Loss = 260,000 − 200,000 = <b>₱60,000</b> (before tax). The ₱200,000 received is reported in the statement of cash flows as an <b>investing inflow</b> — it is in effect the proceeds of disposing of PPE.</p></div>
<h2>Impairment</h2>
<p>An asset is impaired if the remaining benefits it will generate (the slides use the sum of future cash flows) are <b>less than its book value</b>. If the company will keep the asset, write it down to <b>fair value</b>; if it will sell it, write it down to the <b>lower of cost and fair value less costs of disposal</b>.</p>
<div class="fix"><p>The slides describe the US GAAP test. Under <b>PAS 36</b>, an asset is written down to its <b>recoverable amount</b> = the <i>higher</i> of (a) fair value less costs of disposal and (b) value in use (the present value of its future cash flows). The loss goes to profit or loss.</p></div>
<h2>Exchanges and trade-ins</h2>
<p>The slides' rule: for a <b>similar</b> asset (same type or function), record the new asset at <b>cash paid + book value of the old asset</b> with <b>no gain or loss</b>; for a <b>dissimilar</b> asset, record the new asset at <b>fair value</b> and recognise a gain or loss on the old one.</p>
<div class="fix"><p>Under <b>PAS 16</b> the test is not "similar vs dissimilar" but whether the exchange has <b>commercial substance</b> (changes the company's future cash flows). Most exchanges do, so the new asset is recorded at fair value with a gain or loss recognised. Without commercial substance, the old asset's book value carries over.</p></div>
<h2>Group depreciation</h2>
<p>Similar assets (e.g. 200 identical laptops) are depreciated as one pool. When one is disposed of, <b>no gain or loss</b> is recognised: credit the asset for its original cost, debit cash for the proceeds, and debit accumulated depreciation for the difference.</p>`},
{t:'Natural resources and tax depreciation',lo:5,h:`
${kt('Natural resources','Depletion','MACRS')}
<h2>Natural resources and depletion</h2>
<p>Natural resources (oil, minerals, timber) are measured at cost like other assets. Their cost is expensed as the resource is physically removed — <b>depletion</b> — usually by the units-of-production method:</p>
${calc([['Depletion for the period = (Cost of reserve ÷ Estimated total units) × Units extracted','']])}
<div class="ex" data-t="Depletion (added illustration)"><p>An oil field costing ₱50 million holds an estimated 1 million barrels. Depletion per barrel = ₱50. If 120,000 barrels are extracted this year, depletion = <b>₱6 million</b>.</p></div>
<p><b>Oil exploration costs</b> — two methods allowed under US GAAP: the <b>full-cost</b> method capitalises all exploration costs as the value of reserves found; the <b>successful-efforts</b> method capitalises only the costs of successful wells.</p>
<p><b>Accretion</b> — increase in value from natural growth (timber, crops) — is not recognised until the product is sold; costs incurred are capitalised.</p>
<h2>Tax depreciation: MACRS and the investment tax credit</h2>
<p>These slides come from a US textbook. <b>MACRS</b> lets US companies use rapid depreciation for <i>tax</i> to encourage investment: it ignores residual value, combines declining-balance with the half-year convention, and switches to straight-line later; the IRS publishes percentage tables. The <b>investment tax credit</b> (a tax credit equal to a percentage of an asset's cost) is noted as "currently not in the tax code."</p>
<div class="ph"><p>MACRS and the IRS are <b>US only</b>. In the Philippines, tax depreciation follows the National Internal Revenue Code and BIR regulations, and tax incentives for new investment are granted under Philippine incentive laws administered by bodies such as the BOI and PEZA. Your course's point is the general idea: tax depreciation can differ from book (PFRS) depreciation. Check your readings for any specific Philippine rates — they are not in these slides.</p></div>`},
{t:'Intangible assets and analysing long-lived assets',lo:6,h:`
${kt('Goodwill','Leasehold improvements','Deferred charges','Research and development')}
<p class="lead">Intangible assets are intellectual property with no physical substance. A key rule: <b>internally developed</b> intangibles are generally <b>expensed as incurred</b>; <b>acquired</b> ones are <b>capitalised</b>.</p>
<h2>Three categories</h2>
${tbl(['Category','Examples','Accounting'],[['Limited useful life','Patents, copyrights','Record at cost if purchased; amortise over useful life (which may be shorter than legal life), following the pattern of benefits — straight-line if no pattern'],['Indefinite useful life','Renewable broadcast licence','Not amortised; tested for impairment and written down if impaired'],['Goodwill','Arises when one company buys another','Not amortised; annual impairment test; write-downs charged to income']],{cls:'stack'})}
${calc([['Goodwill = Purchase price of company − Fair value of its net assets',''],['Net assets = tangible + recognised intangible assets − liabilities assumed','']])}
<div class="ex" data-t="Goodwill (added illustration)"><p>A company pays ₱12 million for a clinic whose identifiable assets have a fair value of ₱15 million and liabilities ₱5 million. Net assets = ₱10 million; goodwill = <b>₱2 million</b> — the price of reputation, location and loyal patients.</p></div>
<h2>Other long-lived costs</h2>
<p><b>Leasehold improvements</b> (e.g. renovating a rented clinic) revert to the owner at the end of the lease, so amortise over the <b>shorter</b> of useful life or lease term (including a likely renewal).</p>
<p><b>Deferred charges</b> — start-up costs in the pre-operating period: expensed, or capitalised and amortised over a short period (rarely over 5 years), per the slides.</p>
<p><b>Research and development</b>: the slides' GAAP expenses R&D because future benefits are uncertain (conservatism, objectivity), though matching argues for capitalising. R&D done for a customer under contract is inventory until sold. <b>Software</b>: expense costs until technological feasibility, capitalise from then until release; amortise at the greater of straight-line or the revenue ratio.</p>
<div class="fix"><p>Under <b>PAS 38</b>: <b>research</b> costs are always expensed, but <b>development</b> costs are capitalised once specific criteria are met (technical feasibility, intention and ability to complete and use or sell, probable benefits, resources, reliable measurement). <b>Start-up costs</b> must be <b>expensed</b> — they cannot be deferred under PAS 38.</p></div>
<h2>Analysing non-monetary assets</h2>
${calc([['Average age of depreciable assets = Accumulated depreciation ÷ Annual depreciation expense',''],['Depreciation period (years) = Original cost ÷ Annual depreciation expense',''],['Annual spending on an intangible = Annual amortisation + increase in the asset\'s balance (or − decrease)','']])}
<div class="ex" data-t="Using Computer Services Company's building (Ch. 9 data)"><p>Building cost $160,000; accumulated depreciation $11,000; depreciation for the year $11,000.</p>${calc([['Average age = 11,000 ÷ 11,000','1 year'],['Implied depreciation period = 160,000 ÷ 11,000','≈ 14.5 years']])}</div>`}
],
