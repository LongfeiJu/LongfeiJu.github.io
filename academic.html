<script src="site.js"></script>
<script>
(function () {
  var T = site.T, esc = site.esc, shownZh = 0;
  function check() { document.getElementById('empty-zh').hidden = !(site.lang() === 'zh' && shownZh === 0); }
  site.onLang(check);
  site.load('content/academic.json').then(function (d) {
    var el = document.getElementById('intro'); if (site.has(d.intro)) el.outerHTML = T(d.intro, 'p', 'id="intro"');
    var items = d.items || [];
    shownZh = items.filter(function (x) { return x.show_in_chinese; }).length;
    document.getElementById('items').innerHTML = items.map(function (x) {
      var det = (x.details || []).filter(function (r) { return site.has(r.value); }).map(function (r) { return T(r.label, 'dt') + T(r.value, 'dd'); }).join('');
      var file = x.file ? '<a class="btn" href="' + esc(x.file) + '" target="_blank" rel="noopener" data-zh="阅读全文 ↗">Read the full paper ↗</a>' : '';
      return '<article class="paper' + (x.show_in_chinese ? '' : ' en-only') + '"><div class="main">'
        + (site.has(x.kind) ? T(x.kind, 'div', 'class="eyebrow"') : '') + T(x.title, 'h2')
        + (site.has(x.question) ? '<div class="qlabel" data-zh="研究问题">Research question</div>' + T(x.question, 'blockquote') : '')
        + (site.has(x.summary) ? T(x.summary, 'p') : '') + (file ? '<div>' + file + '</div>' : '')
        + '</div><aside>' + (det ? '<dl>' + det + '</dl>' : '') + (site.has(x.note) ? T(x.note, 'p', 'class="note"') : '') + '</aside></article>';
    }).join('');
    site.scan(); check();
  }).catch(function () {});
})();
</script>
</body>
