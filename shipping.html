<style>
/* Layout: full-screen 3D scene; a navy glass lesson card on the left (bottom sheet on phones); top bar with home link, lesson menu and language. */
:root{
  --navy:#0f2340; --navy-2:#1d3a63; --ink:#eef3f8; --soft:#a9bbcf; --line:rgba(255,255,255,.14);
  --acc:#f2a541; --red:#e2574c; --ok:#5cc28a;
  --card:rgba(11,25,46,.84);
  --f-display:"Newsreader","Noto Serif SC",Georgia,serif;
  --f-body:"IBM Plex Sans","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1626;color:var(--ink);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:fixed;inset:0;background:#0b1626;opacity:0;pointer-events:none;transition:opacity .45s;z-index:4}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1626;z-index:20;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:rgba(11,25,46,.72);border:1px solid rgba(255,255,255,.25);padding:4px 7px;border-radius:3px;transition:opacity .25s;backdrop-filter:blur(4px)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:rgba(255,255,255,.55)}
.lbl.acc{border-color:var(--acc);color:#ffd9a3}
.lbl.red{border-color:var(--red);color:#ffc2bd}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.tbtn{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:4px;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}
.tbtn:hover{border-color:rgba(255,255,255,.4)}
.tbtn:focus-visible,.btn:focus-visible,.menu a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top .sp{flex:1}
.count{font:500 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--soft);background:var(--card);border:1px solid var(--line);padding:9px 11px;border-radius:4px;backdrop-filter:blur(8px)}
.menu{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:11;width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:rgba(11,25,46,.96);border:1px solid var(--line);border-radius:6px;padding:6px;display:none}
.menu.open{display:block}
.menu a{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:8px 10px;color:var(--ink);text-decoration:none;font-size:14px;border-radius:4px}
.menu a span{font:500 11px/1.6 var(--f-mono);color:var(--soft)}
.menu a:hover{background:rgba(255,255,255,.07)}
.menu a[aria-current="true"]{background:rgba(242,165,65,.15)}
.menu a[aria-current="true"] span{color:var(--acc)}

/* lesson card */
.card{position:fixed;z-index:6;left:max(18px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:18px;width:min(410px,calc(100vw - 36px));
  display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card-in{overflow:auto;padding:22px 24px 10px;flex:1;scrollbar-width:thin}
.kick{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between;gap:10px}
.card h1,.card h2{font:400 34px/1.06 var(--f-display);margin:10px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.card h1{font-size:44px}
.card p{margin:0 0 12px;font-size:15px;line-height:1.6;color:#dbe4ee}
.card p b{color:#fff;font-weight:600}
.card .note{font:12px/1.5 var(--f-mono);color:var(--soft)}
dl.kv{margin:6px 0 14px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.kv dt,dl.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
dl.kv dt{font:500 11px/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding-right:14px}
dl.kv dd{color:#fff}
dl.kv dd em{font-style:normal;color:var(--acc)}
.terms{margin:4px 0 14px;display:grid;gap:8px}
.terms div{border-left:2px solid var(--acc);padding:2px 0 2px 10px;font-size:13.5px;line-height:1.45;color:#dbe4ee}
.terms b{display:block;color:#fff;font-weight:600;font-size:13px}
table.who{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:12.5px}
table.who th{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.who td{padding:7px 4px;border-bottom:1px solid var(--line);color:#dbe4ee}
table.who td.o{color:#9fd0ff} table.who td.c{color:#ffd9a3}
.foot{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid rgba(255,255,255,.3);padding:11px 14px;border-radius:4px;cursor:pointer}
.btn:hover:not(:disabled){border-color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1c1306}
.foot .dots{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.foot .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.foot .dots i.on{background:var(--acc);width:16px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chips button{font:500 11.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--acc);color:#1c1306;border-color:var(--acc)}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin:4px 0 10px;font-size:13px}
.calc label{color:var(--soft);font:500 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.calc input[type=number]{width:120px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:4px;padding:7px 8px;font:13px var(--f-mono);text-align:right}
.calc input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.res{border:1px solid var(--acc);border-radius:6px;padding:10px 12px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res span{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.res b{font:400 24px/1 var(--f-display);color:#fff}
.res.bad{border-color:var(--red)} .res.good{border-color:var(--ok)}
.gauge{margin:6px 0 12px}
.gbar{position:relative;height:16px;border-radius:3px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4f8fc0,#76b3d6);transition:background .3s}
.gbar i.over{background:linear-gradient(90deg,#c0574c,#e2574c)}
.gbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc)}
.gmeta{display:flex;justify-content:space-between;font:500 11px/1.6 var(--f-mono);color:var(--soft);margin-top:4px}
.phase{font:500 12px/1.5 var(--f-mono);color:#fff;min-height:3em;margin:6px 0 10px;padding:8px 10px;border-radius:4px;background:rgba(255,255,255,.05)}
.phase.bad{background:rgba(226,87,76,.18)}
.bl{background:#f4efe3;color:#2a2418;border-radius:4px;padding:12px 12px 10px;margin:4px 0 14px;font:11px/1.4 var(--f-mono);position:relative}
.bl h4{margin:0 0 6px;font:600 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.bl .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.bl .g div{border-bottom:1px dotted #b9ad94;padding:2px 0}
.bl .g div span{display:block;font-size:8.5px;color:#7c6f55;text-transform:uppercase;letter-spacing:.06em}
.bl .st{position:absolute;font:600 9px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid;border-radius:3px;padding:3px 5px;transform:rotate(-8deg);background:rgba(244,239,227,.85)}
.hint{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 13px;pointer-events:none;backdrop-filter:blur(8px);transition:opacity .4s}
.toggle{display:none}
a.inl{color:var(--acc)}
@media (max-width:760px){
  .card{top:auto;left:0;right:0;bottom:0;width:auto;height:48vh;border-radius:12px 12px 0 0;border-left:0;border-right:0;border-bottom:0}
  .card.min{height:auto}
  .card.min .card-in{display:none}
  .card-in{padding:16px 18px 8px}
  .card h1{font-size:32px}.card h2{font-size:26px;margin:6px 0 10px}
  .card p{font-size:14.5px}
  .toggle{display:inline-block}
  .hint{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px));right:auto;left:50%;transform:translateX(-50%)}
  .lbl{font-size:9.5px;padding:3px 5px}
  .count{display:none}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

{const pa=ocean.geometry.attributes.position;for(let i=0;i<pa.count;i++){const x=pa.getX(i)/4500,z=pa.getZ(i)/4500;pa.setX(i,Math.sign(x)*Math.pow(Math.abs(x),2.2)*4500);pa.setZ(i,Math.sign(z)*Math.pow(Math.abs(z),2.2)*4500);}}

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.65,metalness:.08,...o});

  yellow:M(0xe2b23a),grey:M(0x8b9096),dark:M(0x23272c,{side:THREE.DoubleSide}),orange:M(0xe0632a),red:M(0xb23a2e),black:M(0x15181c),concrete:M(0x9c9b94,{roughness:.9}),

{key:'cover',scene:'sea',preset:'golden',cam:[160,62,175],tgt:[-110,22,-38],dist:[60,620],rot:true,
 kick:T2('Shipping, explained','航运入门'),title:T2('How the world moves by sea','世界如何经由海路运转'),cover:true,
 body:T2(`<p>A guided tour of the shipping business: the ships, the contracts that hire them, the money, the law and the risks, from the quay to the open ocean.</p><p><b>Drag</b> to look around, scroll or pinch to zoom, and use <b>Next</b> to sail to the next stop.</p><p class="note">Built from my notes for SMU's shipping business course. Simplified for learning, not legal or investment advice.</p>`,
 `<p>一次航运业务的导览：船舶本身、租船合同、运费与资金、法律与风险，从码头一路驶向远洋。</p><p><b>拖动</b>画面环顾四周，滚轮或双指缩放，点击<b>下一站</b>前往下一处。</p><p class="note">根据我在新加坡管理大学航运课程中的笔记整理。为学习而简化，并非法律或投资建议。</p>`),
 labels:[[T2('Ship-to-shore cranes','岸桥'),()=>V(-40,62,-64)],[T2('Container ship · ≈ 300 m','集装箱船 · 约 300 米'),()=>boxBerth.localToWorld(V(60,40,0)),'acc']]},
{key:'why',scene:'sea',preset:'day',cam:[SEA.x-240,38,150],tgt:[SEA.x,12,0],dist:[90,700],rot:true,drift:7,
 kick:T2('01 · The big picture','01 · 全局'),title:T2('Why the world ships','为什么世界依赖海运'),
 body:T2(`<p>Shipping is a <b>derived demand</b>: nobody wants a voyage for its own sake. They want the iron ore, grain, oil or trainers it carries, so freight markets rise and fall with trade.</p><p>Close to <b>95% of world trade by volume</b> moves by sea, because one large ship carries cargo at a tiny cost per tonne. Freight is usually only a few percent of a product's shelf price, and per tonne-km a ship emits far less CO₂ than a truck or plane.</p>`,
 `<p>航运是一种<b>派生需求</b>：没有人为了航行本身而需要航运，人们需要的是船上的铁矿石、粮食、石油或运动鞋，所以运费市场随贸易起伏。</p><p>按体量计，近 <b>95% 的世界贸易</b>经由海运，因为一艘大船的每吨运输成本极低。运费通常只占商品零售价的百分之几；按每吨公里计算，船舶的碳排放远低于卡车和飞机。</p>`),
 terms:[[T2('Tonne-mile','吨海里'),T2('One tonne carried one nautical mile. Longer routes mean more tonne-miles, so more ships are needed for the same cargo.','一吨货物运输一海里。航线越长，吨海里越多，运同样的货就需要更多船。')]]},
{key:'fleet',scene:'sea',preset:'day',cam:[SEA.x+360,130,430],tgt:[SEA.x,0,0],dist:[120,1500],rot:false,drift:7,widget:'ships',
 kick:T2('02 · Ships','02 · 船舶'),title:T2('The fleet','船队'),
 body:T2(`<p><b>Bulk carriers</b> carry loose cargo such as ore, coal and grain. <b>Tankers</b> carry crude oil and refined products. <b>Container ships</b> carry boxes, counted in TEU (twenty-foot equivalent units). Bigger ships are cheaper per tonne, but fewer ports and canals can take them.</p>`,
 `<p><b>散货船</b>运输矿石、煤炭、粮食等散装货物；<b>油轮</b>运输原油和成品油；<b>集装箱船</b>运输集装箱，以 TEU（二十英尺标准箱）计数。船越大，每吨成本越低，但能停靠的港口和通过的运河也越少。</p>`),
 kv:[[T2('Handysize','灵便型'),T2('22–38k dwt · flexible','2.2–3.8 万载重吨 · 灵活')],[T2('Supramax','超灵便型'),T2('50–61k dwt · own cranes','5–6.1 万载重吨 · 自带吊机')],[T2('Panamax','巴拿马型'),T2('65–81k dwt','6.5–8.1 万载重吨')],[T2('Capesize','好望角型'),T2('140–180k dwt · ore & coal','14–18 万载重吨 · 矿石与煤')],[T2('Tankers','油轮'),T2('MR · Aframax · Suezmax · VLCC','MR · 阿芙拉型 · 苏伊士型 · VLCC')]]},
{key:'measure',scene:'sea',preset:'day',cam:[SEA.x+150,8,SEA.z+430],tgt:[SEA.x+40,4,SEA.z+300],dist:[50,600],rot:false,drift:7,
 kick:T2('03 · Ships','03 · 船舶'),title:T2('Weight, volume and the load line','重量、容积与载重线'),
 body:T2(`<p><b>Deadweight (DWT)</b> is the weight a ship can carry: cargo, fuel, water and stores. <b>Gross and net tonnage</b> (GT, NT) measure enclosed <i>volume</i>, not weight, and are used to charge port and canal dues.</p><p>The <b>load line</b> on the hull marks how deep the ship may legally sit, which changes with the season and with salt or fresh water.</p>`,
 `<p><b>载重吨（DWT）</b>是船舶能装载的重量：货物、燃油、淡水和物料。<b>总吨和净吨</b>（GT、NT）衡量的是封闭<i>容积</i>而非重量，用于计算港口和运河费用。</p><p>船体上的<b>载重线</b>标出船舶依法可以吃水的最大深度，随季节以及海水或淡水而变化。</p>`),

{key:'choke',scene:'globe',cam:[21.7,6.7,12.6],tgt:[0,0,0],dist:[13,60],rot:false,
 kick:T2('04 · Geography','04 · 地理'),title:T2('Chokepoints','咽喉要道'),
 body:T2(`<p>A handful of canals and straits carry a huge share of world trade, and they also cap ship size, which is why classes are named after them.</p><p>When one closes, ships take the long way. Attacks in the Red Sea pushed many Asia–Europe services around the <b>Cape of Good Hope</b>, adding roughly 10–14 days. Longer voyages tie up more ships, so freight rates rise.</p>`,
 `<p>少数运河与海峡承载着很大一部分世界贸易，同时也限制了船舶尺寸，所以许多船型以它们命名。</p><p>一旦通道受阻，船舶只能绕远路。红海遇袭事件迫使许多亚欧航线改绕<b>好望角</b>，航程增加约 10–14 天。航程变长会占用更多船舶，运价随之上涨。</p>`),

{key:'charter',scene:'sea',preset:'overcast',cam:[ANCH.x+260,46,ANCH.z+250],tgt:[ANCH.x+40,8,ANCH.z+40],dist:[60,900],rot:true,
 kick:T2('05 · Chartering','05 · 租船'),title:T2('Hiring a ship: charter parties','租用船舶：租船合同'),
 body:T2(`<p>A <b>charter party</b> (C/P) is the contract to hire a ship, usually on a standard BIMCO form. Shipbrokers bring owners and charterers together and earn a commission.</p><p>Under a <b>voyage charter</b> the owner performs one voyage for freight per tonne. Under a <b>time charter</b> the charterer hires the ship by the day and directs where it goes. Under a <b>bareboat charter</b> the charterer takes the ship over completely, crew and all.</p>`,
 `<p><b>租船合同</b>（C/P）是租用船舶的合同，通常采用 BIMCO 标准格式。船舶经纪人撮合船东和租家，并赚取佣金。</p><p><b>航次租船</b>下，船东完成一个航次，按每吨收取运费；<b>定期租船</b>下，租家按天租船并决定船去哪里；<b>光船租赁</b>下，租家完全接管船舶，包括配备船员。</p>`),
 widget:'who',labels:[[T2('Ship at anchor','锚泊船'),()=>bulkAnch.localToWorld(V(0,32,0))],[T2('Tug','拖轮'),()=>tug.localToWorld(V(0,10,0))],[T2('Pilot boat','引航艇'),()=>pilot.localToWorld(V(0,6,0)),'acc']]},
{key:'laytime',scene:'sea',preset:'day',cam:[470,62,120],tgt:[300,14,-40],dist:[60,700],rot:true,widget:'laytime',
 kick:T2('06 · Chartering','06 · 租船'),title:T2('Laytime and demurrage','装卸时间与滞期费'),
 body:T2(`<p>On arrival the master tenders a <b>Notice of Readiness</b> (NOR). Once she is an "arrived ship" (at the agreed place, ready in every way and at the charterer's disposal), <b>laytime</b> starts: the time allowed to load or discharge.</p><p>Run over and the charterer pays <b>demurrage</b> to the owner. Finish early and the owner may pay <b>despatch</b>, often half the demurrage rate. Slide to see the money move.</p>`,
 `<p>船舶抵港后，船长递交<b>准备就绪通知书</b>（NOR）。一旦成为"到达船"（抵达约定地点、各方面准备就绪、可供租家使用），<b>装卸时间</b>开始计算，即合同允许的装货或卸货时间。</p><p>超时由租家向船东支付<b>滞期费</b>；提前完成，船东可能支付<b>速遣费</b>，通常为滞期费率的一半。拖动滑块看看金额如何变化。</p>`),
 labels:[[T2('Shiploader','装船机'),()=>V(300,38,-60),'acc'],[T2('Bulk carrier alongside','靠泊散货船'),()=>bulkBerth.localToWorld(V(40,26,0))]]},
{key:'freight',scene:'sea',preset:'sunset',cam:[SEA.x+300,26,SEA.z+520],tgt:[SEA.x+40,8,SEA.z+300],dist:[60,900],rot:true,drift:7,widget:'tce',
 kick:T2('07 · Freight','07 · 运费'),title:T2('Pricing the voyage','为航次定价'),
 body:T2(`<p>Owners compare very different jobs with the <b>time charter equivalent</b> (TCE): earnings per day after voyage costs such as fuel, port charges and commission.</p><p>Tanker freight is quoted in <b>Worldscale</b> points, a percentage of a published flat rate. Dry bulk rates are tracked by the <b>Baltic Exchange</b> indices (BDI, BCI, BPI…), and both sides can lock in future rates with <b>forward freight agreements</b> (FFAs), which are cash-settled and involve no ship.</p>`,
 `<p>船东用<b>等价期租租金</b>（TCE）比较不同的生意：扣除燃油、港口费和佣金等航次成本后的每日收入。</p><p>油轮运费以 <b>Worldscale</b> 点数报价，即公布基准费率的百分比。干散货运价由<b>波罗的海交易所</b>指数（BDI、BCI、BPI 等）追踪，双方还可以用<b>远期运费协议</b>（FFA）锁定未来运价；FFA 以现金结算，不涉及实际船舶。</p>`)},
{key:'bl',scene:'sea',preset:'day',cam:[40,46,72],tgt:[-110,26,-46],dist:[50,600],rot:false,widget:'bl',
 kick:T2('08 · Law','08 · 法律'),title:T2('The bill of lading','提单'),
 body:T2(`<p>When the box goes on board, the carrier issues a <b>bill of lading</b> (B/L). It does three jobs at once:</p><p><b>1. Receipt</b> for the goods, recording quantity and condition. <b>2. Evidence</b> of the contract of carriage. <b>3. Document of title</b>: whoever holds an original "to order" bill can claim the cargo, so it can be sold while the ship is still at sea.</p>`,
 `<p>集装箱装船后，承运人签发<b>提单</b>（B/L）。它同时承担三项功能：</p><p><b>1. 货物收据</b>，记录数量和状况；<b>2. 运输合同的证明</b>；<b>3. 物权凭证</b>：持有"凭指示"正本提单的人可以提货，所以货物在海上时就可以转卖。</p>`),
 kv:[[T2('Shipped / received','已装船 / 收货待运'),T2('issued after / before loading','装船后 / 装船前签发')],[T2('Straight / order','记名 / 指示'),T2('named consignee / negotiable','指定收货人 / 可转让')],[T2('Clean / claused','清洁 / 不清洁'),T2('no remarks / damage noted','无批注 / 注明货损')],[T2('Hague-Visby','海牙-维斯比规则'),T2("the carrier's minimum duties",'承运人的最低责任')]],

{key:'insure',scene:'sea',preset:'storm',cam:[STORM.x+230,46,STORM.z+200],tgt:[STORM.x,6,STORM.z],dist:[70,700],rot:true,drift:5,
 kick:T2('09 · Risk','09 · 风险'),title:T2('Insurance','保险'),
 body:T2(`<p>A ship is covered by a stack of policies. <b>Hull & Machinery</b> (H&M) pays for damage to the ship itself. <b>P&I clubs</b> cover the owner's liabilities to others: cargo claims, pollution, injury. Cargo owners insure on the <b>Institute Cargo Clauses</b>: (A) is "all risks", (B) and (C) cover only named perils. War, piracy and strikes are usually bought separately.</p>`,
 `<p>一艘船由一整套保单覆盖。<b>船壳与机器险</b>（H&M）赔付船舶本身的损坏；<b>保赔协会</b>（P&I）承保船东对他人的责任，如货损索赔、污染和人身伤害。货主按<b>协会货物条款</b>投保：(A) 为"一切险"，(B) 和 (C) 只承保列明风险。战争、海盗和罢工通常另行投保。</p>`),
 terms:[[T2('Insurable interest','可保利益'),T2('You must stand to lose money if the goods are lost, at the time of the loss.','损失发生时，你必须会因货物灭失而蒙受经济损失。')],[T2('Utmost good faith','最大诚信'),T2('Disclose every material fact to the insurer.','向保险人披露所有重要事实。')],[T2('Proximate cause','近因'),T2('The dominant cause of the loss decides whether it is covered.','损失的主导原因决定是否在承保范围内。')],[T2('General average','共同海损'),T2('Everyone with a stake shares a sacrifice made to save the voyage.','为挽救航程而作出的牺牲，由各利益方共同分摊。')]]},
{key:'liquefy',scene:'sea',preset:'overcast',cam:[LIQ.x+34,66,LIQ.z+58],tgt:[LIQ.x+6,0,LIQ.z],dist:[60,600],rot:false,widget:'moist',
 kick:T2('10 · Cargo risk','10 · 货物风险'),title:T2('When cargo turns to liquid','当货物变成液体'),
 body:T2(`<p>Some bulk cargoes, such as iron ore fines and nickel ore, are <b>Group A</b> under the IMSBC Code. Hold too much water and the ship's rolling and engine vibration can turn them into slurry.</p><p>The limit is the <b>Transportable Moisture Limit</b> (TML), and shippers must certify the cargo is below it before loading. Watch the meter: once moisture passes the TML, the ore liquefies, slides to one side, and the ship lists and capsizes, often within minutes.</p>`,
 `<p>铁矿粉、镍矿等部分散货在《国际海运固体散装货物规则》（IMSBC）中属于 <b>A 类</b>货物。含水过多时，船舶的横摇和主机振动会把它们变成泥浆。</p><p>上限是<b>适运水分限</b>（TML），托运人必须在装货前证明货物含水率低于该值。看看水分表：一旦超过 TML，矿石液化、涌向一侧，船舶倾侧并倾覆，往往只需几分钟。</p>`),
 labels:[[T2('Open hatch · iron ore','开启的舱口 · 铁矿石'),()=>oreShip.localToWorld(V(holdX,OH.deckY+4,0)),'acc']]},
{key:'piracy',scene:'globe',cam:[25.6,2.5,13.6],tgt:[0,0,0],dist:[13,60],rot:false,
 kick:T2('11 · Security','11 · 安全'),title:T2('Piracy','海盗'),
 body:T2(`<p>In law, <b>piracy</b> (UNCLOS Art. 101) is violence or robbery for private ends on the <b>high seas</b>. The same attack inside a country's 12-nautical-mile territorial sea is "armed robbery" under that country's own law.</p><p>Piracy costs money even when no ship is boarded: <b>diversions</b>, extra <b>war-risk premiums</b>, kidnap & ransom cover and <b>armed guards</b>. Reports are tracked by the IMB Piracy Reporting Centre and, in Asia, ReCAAP.</p>`,
 `<p>在法律上，<b>海盗行为</b>（《联合国海洋法公约》第 101 条）是指在<b>公海</b>上为私人目的实施的暴力或抢劫。同样的袭击若发生在一国 12 海里领海之内，则按该国法律属于"武装抢劫"。</p><p>即使船舶未被登船，海盗也会带来成本：<b>绕航</b>、额外的<b>战争险保费</b>、绑架与赎金保险以及<b>武装护卫</b>。相关报告由国际海事局海盗报告中心以及亚洲的 ReCAAP 追踪。</p>`),
 kv:[[T2('War-risk premium','战争险附加保费'),T2('e.g. 0.1575% of hull value for a Red Sea call','例：红海挂靠按船壳价值 0.1575%')],[T2('On a US$29m ship','以 2,900 万美元船为例'),T2('<em>≈ US$46k</em> before discounts','折扣前<em>约 4.6 万美元</em>')]]},
{key:'ethics',scene:'sea',preset:'dusk',cam:[260,95,330],tgt:[-60,20,-80],dist:[80,1200],rot:true,
 kick:T2('12 · Ethics','12 · 职业道德'),title:T2('Trust is the business','信任就是生意'),
 body:T2(`<p>Deals worth millions are agreed by phone or chat before anything is signed, so shipping runs on trust. The classic traps: inventing a rival offer to push the price, taking <b>secret commissions</b>, leaking a client's confidential terms, and <b>backdating a bill of lading</b> to meet a letter-of-credit deadline, which is fraud.</p><p>Know your role. A <b>principal</b> is liable under the contract; an <b>agent</b> mainly for its own negligence.</p><p class="note">That's the tour. <a class="inl" href="projects.html">More projects →</a></p>`,
 `<p>价值数百万的交易往往在签约前就通过电话或聊天敲定，所以航运业建立在信任之上。常见陷阱：编造竞争报价来抬价、收取<b>秘密佣金</b>、泄露客户的保密条款，以及为赶上信用证期限而<b>倒签提单</b>，这属于欺诈。</p><p>明确自己的角色：<b>委托人</b>须承担合同责任；<b>代理人</b>主要只对自身过失负责。</p><p class="note">导览结束。<a class="inl" href="projects.html">更多项目 →</a></p>`)},
];

const cur={};const tmpC=new THREE.Color();
function lerpPreset(a,b,t){  const out={};for(const k in b){if(['sun','hs','hg','fog','deep','scat','skyR','hor'].includes(k)){out[k]=new THREE.Color(a[k]).lerp(new THREE.Color(b[k]),t);}else out[k]=lerp(a[k],b[k],t);}return out;}
function applyPreset(p){
  const phi=THREE.MathUtils.degToRad(90-p.el),th=THREE.MathUtils.degToRad(p.az);sunDir.setFromSphericalCoords(1,phi,th);
  const u=sky.material.uniforms;u.turbidity.value=p.turb;u.rayleigh.value=p.ray;u.mieCoefficient.value=.005;u.mieDirectionalG.value=.82;u.sunPosition.value.copy(sunDir);
  renderer.toneMappingExposure=p.exp;sun.color.copy(p.sun);sun.intensity=p.si*Math.max(.15,clamp(p.el/8+.4));hemi.color.copy(p.hs);hemi.groundColor.copy(p.hg);hemi.intensity=p.hi;
  sea.fog.color.copy(p.fog);sea.fog.near=p.fn;sea.fog.far=p.ff;
  oceanU.uSun.value.copy(sunDir);oceanU.uSunCol.value.copy(p.sun);oceanU.uDeep.value.copy(p.deep);oceanU.uScat.value.copy(p.scat);oceanU.uSky.value.copy(p.skyR);oceanU.uHor.value.copy(p.hor);
  oceanU.uFog.value.copy(p.fog);oceanU.uFogNear.value=p.fn;oceanU.uFogFar.value=p.ff;oceanU.uAmp.value=p.amp;
  rain.material.opacity=.45*p.rain;glowMat.opacity=p.lamp;wakeMat.uniforms.uOn.value=1;
  Object.assign(cur,p);}
const asPreset=n=>{const p=PRE[n],o={};for(const k in p)o[k]=['sun','hs','hg','fog','deep','scat','skyR','hor'].includes(k)?new THREE.Color(p[k]):p[k];return o;};

const labelsEl=document.getElementById('labels');let LBL=[];
function setLabels(list){labelsEl.innerHTML='';LBL=(list||[]).map(([t,fn,cls])=>{const el=document.createElement('div');el.className='lbl'+(cls?' '+cls:'');el.textContent=L_(t);labelsEl.appendChild(el);return{el,fn,t};});}
function globeLabels(items,cls){return items.map(([en,zh,la,lo])=>[T2(en,zh),()=>globe.localToWorld(ll(la,lo,GR*1.01)),cls,true]);}
const tv=V(),cd=V();
function updateLabels(){const W=innerWidth,H=innerHeight;for(const l of LBL){const p=l.fn();let a=1;
  if(active===globeScene){cd.copy(camera.position).sub(p).normalize();const d=p.clone().normalize().dot(cd);a=clamp((d-.15)/.25);}
  tv.copy(p).project(camera);if(tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05)a=0;
  l.el.style.opacity=a*(moving?0:1);if(a<=0){l.el.style.display='none';continue;}l.el.style.display='';
  l.el.style.transform=`translate(${((tv.x*.5+.5)*W).toFixed(1)}px,${((-tv.y*.5+.5)*H-14).toFixed(1)}px) translate(-50%,-100%)`;}}

const $=id=>document.getElementById(id);
const cardIn=$('cardIn'),card=$('card');let idx=0,moving=false,liqT=0,liqPlay=false;
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function widgetHTML(w){
  if(w==='ships')return `<div class="chips" role="group">${[['box',T2('Container ship','集装箱船')],['bulk',T2('Bulk carrier','散货船')],['tank',T2('Tanker','油轮')],['all',T2('All three','全部')]].map(([k,t],i)=>`<button type="button" data-ship="${k}" aria-pressed="${i===3}">${L_(t)}</button>`).join('')}</div>`;
  if(w==='who'){const O=L_(T2('Owner','船东')),C=L_(T2('Charterer','租家'));const rows=[[T2('Finance & capital','融资与资本'),O,O,O],[T2('Crew & maintenance','船员与维护'),O,O,C],[T2('Fuel & port costs','燃油与港口费'),O,C,C]];
    return `<table class="who"><tr><th>${L_(T2('Who pays?','谁来付？'))}</th><th>${L_(T2('Voyage','航次'))}</th><th>${L_(T2('Time','期租'))}</th><th>${L_(T2('Bareboat','光租'))}</th></tr>${rows.map(r=>`<tr><td>${L_(r[0])}</td>${r.slice(1).map(v=>`<td class="${v===O?'o':'c'}">${v}</td>`).join('')}</tr>`).join('')}</table><p class="note">${L_(T2('Common forms: GENCON (voyage), NYPE (time), BARECON (bareboat).','常用格式：GENCON（航次）、NYPE（期租）、BARECON（光租）。'))}</p>`;}
  if(w==='laytime')return `<div class="calc"><label>${L_(T2('Laytime allowed','允许装卸时间'))}</label><span class="note">${L_(T2('50,000 t ÷ 5,000 t/day = 10 days','50,000 吨 ÷ 5,000 吨/天 = 10 天'))}</span>
    <label for="lt">${L_(T2('Days actually used','实际用时（天）'))}</label><b id="ltv"></b><input id="lt" type="range" min="6" max="16" step=".5" value="13"></div><div class="res" id="ltr"><span id="ltl"></span><b id="lta"></b></div><p class="note">${L_(T2('Demurrage US$20,000/day · despatch US$10,000/day (illustrative)','滞期费 2 万美元/天 · 速遣费 1 万美元/天（示例）'))}</p>`;
  if(w==='tce')return `<div class="calc">${[['tq',T2('Cargo (t)','货量（吨）'),60000],['tr',T2('Freight (US$/t)','运费（美元/吨）'),24],['tc',T2('Voyage costs (US$)','航次成本（美元）'),620000],['td',T2('Voyage days','航次天数'),35]].map(([id,t,v])=>`<label for="${id}">${L_(t)}</label><input id="${id}" type="number" value="${v}" min="0">`).join('')}</div>
    <div class="res" id="tcer"><span>TCE · ${L_(T2('US$ per day','美元/天'))}</span><b id="tcev"></b></div><p class="note">TCE = (${L_(T2('freight revenue − voyage costs','运费收入 − 航次成本'))}) ÷ ${L_(T2('voyage days','航次天数'))}</p>`;
  if(w==='bl')return `<div class="bl" aria-hidden="true"><h4>Bill of Lading</h4><div class="g"><div><span>Shipper</span>Lion City Exports Pte</div><div><span>Consignee</span>To order</div><div><span>Vessel</span>MV Straits Pioneer</div><div><span>Port of loading</span>Singapore</div><div><span>Description</span>1 × 40' HC · machinery</div><div><span>Port of discharge</span>Rotterdam</div></div>
    <span class="st" style="color:#1f7a3d;right:10px;top:36px">${L_(T2('1 · Receipt','1 · 收据'))}</span><span class="st" style="color:#1f4f8a;left:12px;bottom:12px">${L_(T2('2 · Contract','2 · 合同'))}</span><span class="st" style="color:#b23a2e;right:14px;bottom:10px">${L_(T2('3 · Title','3 · 物权'))}</span></div>`;
  if(w==='moist')return `<div class="gauge"><div class="gmeta"><span>${L_(T2('Moisture content','含水率'))}</span><span id="mv">7.0%</span></div><div class="gbar"><i id="mi"></i><u style="left:${10/14*100}%"></u></div><div class="gmeta"><span>0%</span><span style="color:var(--acc)">TML 10%</span><span>14%</span></div></div><div class="phase" id="ph"></div><button class="btn" type="button" id="replay">${L_(UI.replay)}</button>`;
  return '';}
function renderCard(){const l=LESSONS[idx],last=idx===LESSONS.length-1;
  let h=`<div class="kick"><span>${L_(l.kick)}</span></div>${l.cover?`<h1>${L_(l.title)}</h1>`:`<h2>${L_(l.title)}</h2>`}${L_(l.body)}`;
  if(l.widget)h+=widgetHTML(l.widget);
  if(l.kv)h+=`<dl class="kv">${l.kv.map(([a,b])=>`<dt>${L_(a)}</dt><dd>${L_(b)}</dd>`).join('')}</dl>`;
  if(l.terms)h+=`<div class="terms">${l.terms.map(([a,b])=>`<div><b>${L_(a)}</b>${L_(b)}</div>`).join('')}</div>`;
  if(l.legend)h+=`<p class="note">${L_(l.legend)}</p>`;
  cardIn.innerHTML=h;cardIn.scrollTop=0;
  $('prev').disabled=idx===0;$('next').textContent=L_(l.cover?UI.start:last?UI.done:UI.next);
  $('count').textContent=String(idx+1).padStart(2,'0')+' / '+LESSONS.length;
  $('dots').innerHTML=LESSONS.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('');
  $('menu').querySelectorAll('a').forEach((a,i)=>a.setAttribute('aria-current',i===idx?'true':'false'));
  wire(l);}
function wire(l){
  if(l.widget==='ships')cardIn.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>{cardIn.querySelectorAll('[data-ship]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const k=b.dataset.ship,o={box:boxSea,bulk:bulkSea,tank:tanker}[k];if(!o){flyTo(V(...l.cam),V(...l.tgt));return;}const p=o.position;flyTo(V(p.x+190,46,p.z+(k==='tank'?-200:200)),V(p.x,10,p.z));});
  if(l.widget==='laytime'){const s=$('lt'),f=()=>{const d=+s.value,diff=d-10;$('ltv').textContent=d+' '+L_(T2('days','天'));const r=$('ltr');
    if(diff>0){$('ltl').textContent=L_(T2('Charterer pays demurrage','租家支付滞期费'));$('lta').textContent='US$ '+fmt(diff*20000);r.className='res bad';}
    else if(diff<0){$('ltl').textContent=L_(T2('Owner pays despatch','船东支付速遣费'));$('lta').textContent='US$ '+fmt(-diff*10000);r.className='res good';}
    else{$('ltl').textContent=L_(T2('Exactly on time','正好用完'));$('lta').textContent='US$ 0';r.className='res';}};s.oninput=f;f();}
  if(l.widget==='tce'){const f=()=>{const q=+$('tq').value,r=+$('tr').value,c=+$('tc').value,d=Math.max(1,+$('td').value);const v=(q*r-c)/d;$('tcev').textContent='US$ '+fmt(v);$('tcer').className='res '+(v<0?'bad':'good');};['tq','tr','tc','td'].forEach(i=>$(i).oninput=f);f();}
  if(l.widget==='moist'){$('replay').onclick=()=>{liqT=0;liqPlay=true;};}}
function buildMenu(){$('menu').innerHTML=LESSONS.map((l,i)=>`<a href="#${l.key}" data-i="${i}"><span>${String(i).padStart(2,'0')}</span>${L_(l.title)}</a>`).join('');
  $('menu').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();toggleMenu(false);go(+a.dataset.i);});}
function toggleMenu(o){$('menu').classList.toggle('open',o);$('menuBtn').setAttribute('aria-expanded',o);}
$('menuBtn').onclick=()=>toggleMenu(!$('menu').classList.contains('open'));
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx===LESSONS.length-1?0:idx+1);
$('minBtn').onclick=()=>{card.classList.toggle('min');$('minBtn').textContent=L_(card.classList.contains('min')?UI.show:UI.hide);resize();};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key==='Escape')toggleMenu(false);});
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-Hans':'en';$('langBtn').textContent=lang==='zh'?'EN':'中文';$('menuBtn').textContent=L_(UI.lessons);$('home').textContent=L_(UI.home);$('hint').textContent=L_(UI.hint);
  $('minBtn').textContent=L_(card.classList.contains('min')?UI.show:UI.hide);buildMenu();renderCard();for(const l of LBL)l.el.textContent=L_(l.t);}
$('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang();};

/* ================= navigation & camera flights ================= */
let fly=null;
function flyTo(pos,tgt,dur){const from={p:camera.position.clone(),t:controls.target.clone()};const d=from.p.distanceTo(pos);
  fly={from,to:{p:pos.clone(),t:tgt.clone()},t0:performance.now(),dur:dur||(reduce?1:clamp(d/1600,1.1,3.2))*1000,lift:d>1200?Math.min(900,d*.18):0};moving=true;controls.enabled=false;}
let presetFrom=asPreset('golden'),presetTo=asPreset('golden'),presetT=1;
function go(i,instant){i=clamp(i,0,LESSONS.length-1);const prev=LESSONS[idx];idx=i;const l=LESSONS[i];
  try{history.replaceState(null,'','#'+l.key)}catch(e){}
  renderCard();setLabels(l.key==='choke'?globeLabels(CHOKE,'acc'):l.key==='piracy'?globeLabels(ZONES,'red'):l.labels);
  pins.visible=l.key==='choke';viaSuez.visible=viaCape.visible=l.key==='choke';zoneG.visible=l.key==='piracy';
  if(l.key==='liquefy'){liqT=0;liqPlay=true;}
  controls.minDistance=l.dist[0];controls.maxDistance=l.dist[1];controls.autoRotate=!!l.rot&&!reduce;
  controls.maxPolarAngle=l.scene==='globe'?Math.PI:Math.PI*.47;
  const swap=(l.scene==='globe')!==(active===globeScene);
  const doMove=()=>{if(l.scene==='sea'){presetFrom=Object.assign({},cur);presetTo=asPreset(l.preset);presetT=instant?1:0;if(instant)applyPreset(presetTo);}
    targetDrift=l.drift||0;
    if(instant||swap){camera.position.set(...l.cam);controls.target.set(...l.tgt);controls.update();moving=false;controls.enabled=true;if(l.scene==='sea')refreshEnv();}
    else flyTo(V(...l.cam),V(...l.tgt));};
  if(swap&&!instant){const f=$('fade');f.style.opacity=1;moving=true;setTimeout(()=>{active=l.scene==='globe'?globeScene:sea;if(l.scene==='sea'){applyPreset(asPreset(l.preset));presetT=1;}doMove();f.style.opacity=0;},reduce?0:460);}
  else{active=l.scene==='globe'?globeScene:sea;doMove();}
  $('hint').style.opacity=1;clearTimeout(go.h);go.h=setTimeout(()=>$('hint').style.opacity=0,4200);}
let targetDrift=0,drift=0;
controls.addEventListener('start',()=>{controls.autoRotate=false;$('hint').style.opacity=0;});

/* ================= per-frame updates ================= */
function updateFlight(now){if(!fly)return;const k=clamp((now-fly.t0)/fly.dur),e=ease(k);
  camera.position.lerpVectors(fly.from.p,fly.to.p,e);camera.position.y+=Math.sin(Math.PI*e)*fly.lift;controls.target.lerpVectors(fly.from.t,fly.to.t,e);
  if(k>=1){fly=null;moving=false;controls.enabled=true;if(active===sea)refreshEnv();}}
const craneLoop=t=>{const c=cranes[1],p=(t%14)/14,ph=[[0,.16],[.16,.42],[.42,.58],[.58,.86],[.86,1]];
  // phases: lift from quay, travel out, lower to ship, rise empty, travel back
  const quay=-82,ship=-40,hi=38,lowQ=7.5,lowS=boxBerth.userData.boxTop+boxBerth.position.y+17;let z,y,carry=true;
  if(p<.16){z=quay;y=lerp(lowQ,hi,ease(p/.16));}else if(p<.42){z=lerp(quay,ship,ease((p-.16)/.26));y=hi;}else if(p<.58){z=ship;y=lerp(hi,lowS,ease((p-.42)/.16));}
  else if(p<.86){carry=false;z=lerp(ship,quay,ease((p-.58)/.28));y=lerp(lowS,hi,ease(seg(p,.58,.66)));}else{carry=false;z=quay;y=lerp(hi,lowQ+2,ease((p-.86)/.14));}
  c.trolley.position.z=z;c.spreader.position.set(0,y,z);c.box.visible=carry;const top=54;c.cable.position.set(0,(top+y)/2,z);c.cable.scale.y=Math.max(.1,top-y);};
const liqPhase=[[0,T2('Loaded: moisture below the TML. The cargo is a firm heap.','装货完成：含水率低于 TML，货堆稳固。')],[2.2,T2('Rain while loading and engine vibration: moisture creeps up…','装货时下雨、主机振动：含水率慢慢上升…')],
  [5,T2('Above the TML. Rolling squeezes water out and the ore turns to slurry.','超过 TML。横摇把水挤出，矿石变成泥浆。'),1],[8,T2('The slurry slides to the low side and stays there. The ship lists.','泥浆涌向低的一侧并停留，船舶倾侧。'),1],
  [11.5,T2('Past the point of no return: she capsizes.','越过临界点：船舶倾覆。'),1],[14.5,T2('Lost in minutes, with little time to send a distress call.','几分钟内沉没，几乎来不及发出求救。'),1]];
function updateLiquefaction(t,dt){
  if(liqPlay)liqT+=dt;const T_=liqT;
  const moist=lerp(7,12.8,ease(seg(T_,1.5,6.5))),liq=ease(seg(T_,5,8)),shift=ease(seg(T_,7.5,11.5)),cap=ease(seg(T_,11.5,14.5)),sink=ease(seg(T_,13.5,19));
  // roll: wave rolling grows, then a growing list, then capsize
  const osc=Math.sin(t*1.05)*THREE.MathUtils.degToRad(4+7*liq)*(1-cap);
  const list=THREE.MathUtils.degToRad(24*shift+130*cap);fOre.extraRoll=list+osc;fOre.extraY=-34*sink-3*cap;fOre.bob=.9*(1-cap);
  const phi=oreShip.rotation.x;
  // ore surface: dry heap → liquid surface that stays level in the world (so it slides as she rolls)
  const pa=oreGeo.attributes.position,sa=slurryGeo.attributes.position,c=oreFloor+HD*.62,tilt=Math.tan(clamp(phi*.85+.35*shift,-1.2,1.2));
  for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),u=x/(HL/2),w=z/(HW/2);
    const heap=oreFloor+HD*(.42+.36*(1-w*w)*(1-.45*u*u));const flat=c+z*tilt;let y=lerp(heap,flat,liq);y=clamp(y,oreFloor+.3,OH.deckY-.6);pa.setY(i,y);sa.setY(i,Math.min(y+.25+.12*Math.sin(x*.5+t*2.5+z*.3)*liq,OH.deckY-.4));}
  pa.needsUpdate=true;sa.needsUpdate=true;oreGeo.computeVertexNormals();
  mat.ore.color.setHex(0x6b4433).lerp(tmpC.setHex(0x3a2820),seg(moist,8,12));mat.ore.roughness=lerp(.95,.28,seg(moist,8.5,12));
  mat.slurry.opacity=.5*liq*(1-sink);
  // HUD
  if(LESSONS[idx].key==='liquefy'&&$('mi')){$('mi').style.width=(moist/14*100).toFixed(1)+'%';$('mi').className=moist>10?'over':'';$('mv').textContent=moist.toFixed(1)+'%';
    let ph=liqPhase[0];for(const p of liqPhase)if(T_>=p[0])ph=p;const el=$('ph');if(el.dataset.k!==String(ph[0])){el.dataset.k=ph[0];el.textContent=L_(ph[1]);el.className='phase'+(ph[2]?' bad':'');}}
  // bubbles & foam
  const ba=seg(T_,12.5,14)*(1-seg(T_,22,26));bubbles.material.opacity=ba*.9;foamRing.material.opacity=ba*.22;
  if(ba>0){const o=oreShip.position;for(let i=0;i<bubN;i++){const s=bubSeed[i],ph=(s[2]+t*.25*s[3])%1;const cx=Math.cos(fOre.yaw),sx=Math.sin(fOre.yaw);
    bubArr[i*3]=o.x+s[0]*cx+s[1]*sx;bubArr[i*3+1]=lerp(-30,.8,ph)+waveH(o.x,o.z,t)*.5;bubArr[i*3+2]=o.z-s[0]*sx+s[1]*cx;}bubGeo.attributes.position.needsUpdate=true;
    foamRing.position.set(o.x,.6+waveH(o.x,o.z,t),o.z);foamRing.scale.setScalar(60+50*seg(T_,13,24));}}
function updateRain(){if(rain.material.opacity<.01)return;const c=camera.position,t=performance.now()/1000;
  for(let i=0;i<RN;i++){const s=rainSeed[i];const y=(((s[1]-t*60)%140)+140)%140;const x=c.x+s[0]+t*-4,z=c.z+s[2];rainArr.set([x,y,z,x-1.2,y+5,z],i*6);}rainGeo.attributes.position.needsUpdate=true;}
let flash=0;

/* ================= loop ================= */
function resize(){const W=innerWidth,H=innerHeight,nar=narrowQ();renderer.setSize(W,H,false);camera.aspect=W/H;
  const cw=Math.min(410,W-36)+18,ch=card.classList.contains('min')?70:H*.48;
  camera.setViewOffset(W,H,nar?0:-cw/2,nar?ch/2:0,W,H);camera.updateProjectionMatrix();}
addEventListener('resize',resize);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  updateFlight(now);
  if(active===sea){
    if(presetT<1){presetT=Math.min(1,presetT+dt/(fly?fly.dur/1000:1.2));applyPreset(lerpPreset(presetFrom,presetTo,ease(presetT)));}
    drift+=(targetDrift-drift)*dt*.8;oceanU.uDrift.value+=drift*dt;oceanU.uTime.value=t;
    ocean.position.x=Math.round(camera.position.x/40)*40;ocean.position.z=Math.round(camera.position.z/40)*40;
    for(const f of floaters){updateFloat(f,t);if(f.wake){const o=f.obj;f.wake.m.position.set(o.position.x-Math.cos(f.yaw)*(o.userData.L/2+f.wake.len/2-6),.35,o.position.z+Math.sin(f.yaw)*(o.userData.L/2+f.wake.len/2-6));f.wake.m.rotation.y=f.yaw;f.wake.m.visible=drift>1;}}
    fTug.x=ANCH.x+140*Math.cos(t*.03);fTug.z=ANCH.z+140*Math.sin(t*.03);fTug.yaw=-t*.03-Math.PI/2;fTug.obj.rotation.y=fTug.yaw;
    craneLoop(t);updateLiquefaction(t,dt);updateRain();
    if(cur.rain>.5){if(Math.random()<.004)flash=1;flash*=.86;hemi.intensity=cur.hi+flash*3;}
    sun.position.copy(controls.target).addScaledVector(sunDir,600);sun.target.position.copy(controls.target);
  }else{oceanU.uTime.value=t;zoneRings.forEach((r,i)=>r.material.opacity=.5+.5*Math.sin(t*3+i));}
  controls.update();updateLabels();
  renderer.render(active,camera);requestAnimationFrame(frame);}

/* ================= start ================= */
applyPreset(asPreset('golden'));resize();applyLang();
const start=Math.max(0,LESSONS.findIndex(l=>'#'+l.key===location.hash));
go(start,true);refreshEnv();
requestAnimationFrame(t=>{last=t;frame(t);setTimeout(()=>{$('loading').classList.add('done');setTimeout(()=>$('loading').remove(),700);},250);});
window.__ship={go,state:()=>({idx,liqT}),setLiq:v=>{liqT=v;}};
</script>
