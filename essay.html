<head>

<link rel="stylesheet" href="site.css">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<header>
  <nav class="wrap" aria-label="Main">
    <a class="mark" href="index.html"><b>LJ</b><span data-zh="巨龙飞">Longfei Ju</span></a>
    <div class="navr">
    <ul>
      <li><a href="story.html" data-zh="我的故事">My story</a></li>
      <li class="hide-s"><a href="index.html#projects" data-zh="项目">Projects</a></li>

      <li><a href="hobbies.html" data-zh="爱好">Hobbies</a></li>

</header>

<div class="readbar" aria-hidden="true"><i id="readbar"></i></div>
<main class="essay-wrap">
  <article class="essay" id="essay">
    <a class="essay-back" href="academic.html" data-zh="← 学术">← Academic</a>
    <p class="essay-loading">Loading…</p>
  </article>
  <footer class="essay-foot">
    <span data-zh="© 2026 巨龙飞">© 2026 Longfei Ju</span>
    <a href="academic.html" data-zh="全部论文">All essays</a>
  </footer>
</main>

<script src="site.js"></script>
<script>
(function () {
  var T = site.T, esc = site.esc;
  function wordsOf(body) { return (body || '').trim().split(/\s+/).filter(Boolean).length; }
  function fmt(n) { return n.toLocaleString('en-US'); }

  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
  }
  var slug = new URLSearchParams(location.search).get('e') || '';
  var box = document.getElementById('essay'), bar = document.getElementById('readbar');
  site.load('content/academic.json').then(function (d) {
    var items = d.items || [], x = items.filter(function (it, i) { return (it.slug || String(i)) === slug; })[0];
    if (!x || !x.body) {
      box.innerHTML = '<a class="essay-back" href="academic.html" data-zh="← 学术">← Academic</a><p data-zh="找不到这篇文章。">This essay could not be found.</p>';
      site.scan(); return;
    }
    document.title = (x.title && x.title.en ? x.title.en.slice(0, 70) : 'Essay') + ' · Longfei Ju';
    var paras = x.body.split(/\n\s*\n/).map(function (p) { return p.replace(/\s*\n\s*/g, ' ').trim(); }).filter(Boolean);
    var n = wordsOf(x.body), mins = Math.max(1, Math.round(n / 230));
    var bib = (x.bibliography || '').split(/\n/).map(function (l) { return l.replace(/^\s*[-•]\s*/, '').trim(); }).filter(Boolean);
    box.innerHTML = '<a class="essay-back" href="academic.html" data-zh="← 学术">← Academic</a>'
      + '<header class="essay-head">' + (site.has(x.kind) ? T(x.kind, 'div', 'class="essay-kind"') : '')
      + '<h1 class="essay-title">' + esc(x.title.en || '') + '</h1>'
      + '<div class="essay-by"><span data-zh="巨龙飞">Longfei Ju</span>' + (x.year ? '<span>' + esc(x.year) + '</span>' : '') + '<span>' + fmt(n) + ' <span data-zh="词">words</span></span><span>' + mins + ' <span data-zh="分钟阅读">min read</span></span></div>'
      + '<div class="essay-rule" aria-hidden="true">❦</div></header>'
      + '<div class="essay-body">' + paras.map(function (p) { return '<p>' + inline(p) + '</p>'; }).join('') + '</div>'
      + (bib.length ? '<section class="essay-bib"><h2 data-zh="参考文献">Bibliography</h2><ol>' + bib.map(function (b) { return '<li>' + linkify(b) + '</li>'; }).join('') + '</ol></section>' : '');
    site.scan();
  }).catch(function () { box.innerHTML = '<a class="essay-back" href="academic.html">← Academic</a><p>This essay could not be loaded.</p>'; });
  function onScroll() { var h = document.documentElement, max = h.scrollHeight - innerHeight; bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, scrollY / max) : 0) + ')'; }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();
</script>
</body>
</html>
