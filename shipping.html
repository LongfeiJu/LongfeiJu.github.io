<style>
/* Layout: full-screen 3D world. A navy glass card on the left (bottom sheet on phones) holds the current place's lesson.
   Glowing hotspots in the scene are the navigation: click one to sail there. */
:root{
  --ink:#eef3f8; --soft:#a9bbcf; --line:rgba(255,255,255,.14);
  --acc:#f2a541; --red:#e2574c; --ok:#5cc28a; --card:rgba(9,22,42,.82);
  --f-display:"Newsreader","Noto Serif SC",Georgia,serif;
  --f-body:"IBM Plex Sans","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1626;color:var(--ink);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:fixed;inset:0;background:#06101e;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1626;z-index:20;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:rgba(9,22,42,.72);border:1px solid rgba(255,255,255,.25);padding:4px 7px;border-radius:3px;backdrop-filter:blur(4px)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:rgba(255,255,255,.55)}
.lbl.acc{border-color:var(--acc);color:#ffd9a3}
.hs{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0;color:#fff;font:inherit}
.hs .dot{position:relative;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(242,165,65,.35),0 0 18px rgba(242,165,65,.8);flex:none}
.hs .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--acc);animation:ping 1.8s ease-out infinite}
.hs.red .dot{background:var(--red);box-shadow:0 0 0 3px rgba(226,87,76,.35),0 0 18px rgba(226,87,76,.8)}
.hs.red .dot::after{border-color:var(--red)}
.hs.small .dot{width:11px;height:11px}
.hs .txt{font:500 11px/1.25 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(9,22,42,.8);border:1px solid rgba(255,255,255,.22);padding:5px 8px;border-radius:4px;backdrop-filter:blur(6px);white-space:nowrap;transition:background .15s,border-color .15s}
.hs .txt small{display:block;font-size:9.5px;color:var(--soft);letter-spacing:.04em;text-transform:none;font-family:var(--f-body)}
.hs:hover .txt,.hs:focus-visible .txt{background:rgba(242,165,65,.92);color:#1c1306;border-color:var(--acc)}
.hs:hover .txt small,.hs:focus-visible .txt small{color:#3b2a10}
.hs:focus-visible{outline:none}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.tbtn{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:4px;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}
.tbtn:hover{border-color:rgba(255,255,255,.4)}
.tbtn:focus-visible,.btn:focus-visible,.menu a:focus-visible,.place:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top .sp{flex:1}
.menu{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:11;width:min(340px,calc(100vw - 28px));max-height:72vh;overflow:auto;background:rgba(9,22,42,.96);border:1px solid var(--line);border-radius:6px;padding:6px;display:none}
.menu.open{display:block}
.menu a{display:grid;gap:2px;padding:9px 10px;color:var(--ink);text-decoration:none;font-size:14px;border-radius:4px}
.menu a span{font:500 10.5px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.menu a:hover{background:rgba(255,255,255,.07)}
.menu a[aria-current="true"]{background:rgba(242,165,65,.15)}
.card{position:fixed;z-index:6;left:max(18px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:18px;width:min(410px,calc(100vw - 36px));
  display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card-in{overflow:auto;padding:22px 24px 10px;flex:1;scrollbar-width:thin}
.kick{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.card h1,.card h2{font:400 34px/1.06 var(--f-display);margin:10px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.card h1{font-size:42px}
.card p{margin:0 0 12px;font-size:15px;line-height:1.6;color:#dbe4ee}
.card p b{color:#fff;font-weight:600}
.card .note{font:12px/1.5 var(--f-mono);color:var(--soft)}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{font:500 11.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);background:none;border:0;border-bottom:2px solid transparent;padding:9px 8px 10px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--acc)}
dl.kv{margin:6px 0 14px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.kv dt,dl.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
dl.kv dt{font:500 11px/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding-right:14px}
dl.kv dd{color:#fff}
dl.kv dd em{font-style:normal;color:var(--acc)}
.terms{margin:4px 0 14px;display:grid;gap:8px}
.terms div{border-left:2px solid var(--acc);padding:2px 0 2px 10px;font-size:13.5px;line-height:1.45;color:#dbe4ee}
.terms b{display:block;color:#fff;font-weight:600;font-size:13px}
table.who{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:12.5px}
table.who th{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.who td{padding:7px 4px;border-bottom:1px solid var(--line);color:#dbe4ee}
table.who td.o{color:#9fd0ff} table.who td.c{color:#ffd9a3}
.places{display:grid;gap:6px;margin:6px 0 14px}
.place{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:#fff;cursor:pointer;font:inherit}
.place:hover{border-color:var(--acc);background:rgba(242,165,65,.1)}
.place i{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.place.red i{background:var(--red);box-shadow:0 0 8px var(--red)}
.place b{display:block;font-weight:600;font-size:13.5px}
.place span{display:block;font:11px/1.4 var(--f-mono);color:var(--soft);letter-spacing:.03em}
.foot{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.foot .sp{flex:1}
.btn{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid rgba(255,255,255,.3);padding:11px 14px;border-radius:4px;cursor:pointer}
.btn:hover:not(:disabled){border-color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1c1306}
.btn[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chips button{font:500 11.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--acc);color:#1c1306;border-color:var(--acc)}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin:4px 0 10px;font-size:13px}
.calc label{color:var(--soft);font:500 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.calc input[type=number]{width:120px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:4px;padding:7px 8px;font:13px var(--f-mono);text-align:right}
.calc input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.res{border:1px solid var(--acc);border-radius:6px;padding:10px 12px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res span{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.res b{font:400 24px/1 var(--f-display);color:#fff}
.res.bad{border-color:var(--red)} .res.good{border-color:var(--ok)}
.gauge{margin:6px 0 12px}
.gbar{position:relative;height:16px;border-radius:3px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4f8fc0,#76b3d6)}
.gbar i.over{background:linear-gradient(90deg,#c0574c,#e2574c)}
.gbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc)}
.gmeta{display:flex;justify-content:space-between;font:500 11px/1.6 var(--f-mono);color:var(--soft);margin-top:4px}
.phase{font:500 12px/1.5 var(--f-mono);color:#fff;min-height:3em;margin:6px 0 10px;padding:8px 10px;border-radius:4px;background:rgba(255,255,255,.05)}
.phase.bad{background:rgba(226,87,76,.18)}
.bl{background:#f4efe3;color:#2a2418;border-radius:4px;padding:12px 12px 10px;margin:4px 0 14px;font:11px/1.4 var(--f-mono);position:relative}
.bl h4{margin:0 0 6px;font:600 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.bl .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.bl .g div{border-bottom:1px dotted #b9ad94;padding:2px 0}
.bl .g div span{display:block;font-size:8.5px;color:#7c6f55;text-transform:uppercase;letter-spacing:.06em}
.bl .st{position:absolute;font:600 9px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid;border-radius:3px;padding:3px 5px;transform:rotate(-8deg);background:rgba(244,239,227,.85)}
.callout{border:1px solid var(--acc);background:rgba(242,165,65,.08);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:13.5px;line-height:1.5;color:#e9eef4}
.callout b{display:block;color:var(--acc);font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.hint{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 13px;pointer-events:none;backdrop-filter:blur(8px);transition:opacity .4s}
.toggle{display:none}
@media (max-width:760px){
  .card{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:12px 12px 0 0;border-left:0;border-right:0;border-bottom:0}
  .card.min{height:auto}
  .card.min .card-in{display:none}
  .card-in{padding:16px 18px 8px}
  .card h1{font-size:30px}.card h2{font-size:26px;margin:6px 0 10px}
  .card p{font-size:14.5px}
  .toggle{display:inline-block}
  .hint{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px));right:auto;left:50%;transform:translateX(-50%)}
  .lbl{font-size:9.5px;padding:3px 5px}
  .hs .txt{font-size:9.5px;padding:4px 6px}
  .hs .txt small{display:none}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}.hs .dot::after{animation:none}}
</style>

  body:T2(`<p>A <b>charter party</b> (C/P) is the contract to hire a ship, usually on a standard BIMCO form. Shipbrokers bring owners and charterers together and earn a commission.</p><p>Under a <b>voyage charter</b> the owner performs one voyage for freight per tonne. Under a <b>time charter</b> the charterer hires the ship by the day and directs where it goes. Under a <b>bareboat charter</b> the charterer takes the ship over completely, crew and all.</p>`,
  `<p><b>租船合同</b>（C/P）是租用船舶的合同，通常采用 BIMCO 标准格式。船舶经纪人撮合船东和租家，并赚取佣金。</p><p><b>航次租船</b>下，船东完成一个航次，按每吨收取运费；<b>定期租船</b>下，租家按天租船并决定船去哪里；<b>光船租赁</b>下，租家完全接管船舶，包括配备船员。</p>`),
  labels:[[T2('Waiting at anchor','锚泊等候'),()=>bulkAnch.localToWorld(V(0,34,0))],[T2('Tug','拖轮'),()=>tug.localToWorld(V(0,12,0))],[T2('Pilot boat','引航艇'),()=>pilot.localToWorld(V(0,7,0)),'acc']]},
 laytime:{kick:T2('Bulk berth','散货泊位'),title:T2('Laytime and demurrage','装卸时间与滞期费'),widget:'laytime',
  body:T2(`<p>On arrival the master tenders a <b>Notice of Readiness</b> (NOR). Once she is an "arrived ship" (at the agreed place, ready in every way and at the charterer's disposal), <b>laytime</b> starts: the time allowed to load or discharge.</p><p>Run over and the charterer pays <b>demurrage</b> to the owner. Finish early and the owner may pay <b>despatch</b>, often half the demurrage rate.</p>`,
  `<p>船舶抵港后，船长递交<b>准备就绪通知书</b>（NOR）。一旦成为"到达船"（抵达约定地点、各方面准备就绪、可供租家使用），<b>装卸时间</b>开始计算。</p><p>超时由租家向船东支付<b>滞期费</b>；提前完成，船东可能支付<b>速遣费</b>，通常为滞期费率的一半。</p>`),
  labels:[[T2('Shiploader','装船机'),()=>V(300,38,-60),'acc'],[T2('Bulk carrier alongside','靠泊散货船'),()=>bulkBerth.localToWorld(V(40,28,0))]]},
 bl:{kick:T2('Container terminal','集装箱码头'),title:T2('The bill of lading','提单'),widget:'bl',
  body:T2(`<p>When the box goes on board, the carrier issues a <b>bill of lading</b> (B/L). It does three jobs at once:</p><p><b>1. Receipt</b> for the goods, recording quantity and condition. <b>2. Evidence</b> of the contract of carriage. <b>3. Document of title</b>: whoever holds an original "to order" bill can claim the cargo, so it can be sold while the ship is still at sea.</p>`,
  `<p>集装箱装船后，承运人签发<b>提单</b>（B/L）。它同时承担三项功能：</p><p><b>1. 货物收据</b>，记录数量和状况；<b>2. 运输合同的证明</b>；<b>3. 物权凭证</b>：持有"凭指示"正本提单的人可以提货，所以货物在海上时就可以转卖。</p>`),
  kv:[[T2('Shipped / received','已装船 / 收货待运'),T2('issued after / before loading','装船后 / 装船前签发')],[T2('Straight / order','记名 / 指示'),T2('named consignee / negotiable','指定收货人 / 可转让')],[T2('Clean / claused','清洁 / 不清洁'),T2('no remarks / damage noted','无批注 / 注明货损')],[T2('Hague-Visby','海牙-维斯比规则'),T2("the carrier's minimum duties",'承运人的最低责任')]],
  labels:[[T2('Loading the box','集装箱装船'),()=>cranes[1].box.getWorldPosition(V()).add(V(0,6,0)),'acc']]},
 office:{kick:T2("Broker's office",'经纪人办公楼'),title:T2('Money and trust','金钱与信任'),tabs:[
  {t:T2('Freight','运费'),widget:'tce',body:T2(`<p>Owners compare very different jobs with the <b>time charter equivalent</b> (TCE): earnings per day after voyage costs such as fuel, port charges and commission.</p><p>Tanker freight is quoted in <b>Worldscale</b> points, a percentage of a published flat rate. Dry bulk rates are tracked by the <b>Baltic Exchange</b> indices (BDI, BCI, BPI…), and both sides can lock in future rates with <b>forward freight agreements</b> (FFAs), which are cash-settled and involve no ship.</p>`,
   `<p>船东用<b>等价期租租金</b>（TCE）比较不同的生意：扣除燃油、港口费和佣金等航次成本后的每日收入。</p><p>油轮运费以 <b>Worldscale</b> 点数报价，即公布基准费率的百分比。干散货运价由<b>波罗的海交易所</b>指数（BDI、BCI、BPI 等）追踪，双方还可以用<b>远期运费协议</b>（FFA）锁定未来运价；FFA 以现金结算，不涉及实际船舶。</p>`)},
  {t:T2('Ethics','职业道德'),body:T2(`<p>Deals worth millions are agreed by phone or chat before anything is signed, so shipping runs on trust. The classic traps: inventing a rival offer to push the price, taking <b>secret commissions</b>, leaking a client's confidential terms, and <b>backdating a bill of lading</b> to meet a letter-of-credit deadline, which is fraud.</p><p>Know your role. A <b>principal</b> is liable under the contract; an <b>agent</b> mainly for its own negligence.</p>`,
   `<p>价值数百万的交易往往在签约前就通过电话或聊天敲定，所以航运业建立在信任之上。常见陷阱：编造竞争报价来抬价、收取<b>秘密佣金</b>、泄露客户的保密条款，以及为赶上信用证期限而<b>倒签提单</b>，这属于欺诈。</p><p>明确自己的角色：<b>委托人</b>须承担合同责任；<b>代理人</b>主要只对自身过失负责。</p>`)}]},
 insure:{kick:T2('Storm offshore','近海风暴'),title:T2('Insurance','保险'),
  body:T2(`<p>A ship is covered by a stack of policies. <b>Hull & Machinery</b> (H&M) pays for damage to the ship itself. <b>P&I clubs</b> cover the owner's liabilities to others: cargo claims, pollution, injury. Cargo owners insure on the <b>Institute Cargo Clauses</b>: (A) is "all risks", (B) and (C) cover only named perils. War, piracy and strikes are usually bought separately.</p>`,
  `<p>一艘船由一整套保单覆盖。<b>船壳与机器险</b>（H&M）赔付船舶本身的损坏；<b>保赔协会</b>（P&I）承保船东对他人的责任，如货损索赔、污染和人身伤害。货主按<b>协会货物条款</b>投保：(A) 为"一切险"，(B) 和 (C) 只承保列明风险。战争、海盗和罢工通常另行投保。</p>`),
  terms:[[T2('Insurable interest','可保利益'),T2('You must stand to lose money if the goods are lost, at the time of the loss.','损失发生时，你必须会因货物灭失而蒙受经济损失。')],[T2('Utmost good faith','最大诚信'),T2('Disclose every material fact to the insurer.','向保险人披露所有重要事实。')],[T2('Proximate cause','近因'),T2('The dominant cause of the loss decides whether it is covered.','损失的主导原因决定是否在承保范围内。')],[T2('General average','共同海损'),T2('Everyone with a stake shares a sacrifice made to save the voyage.','为挽救航程而作出的牺牲，由各利益方共同分摊。')]]},
 liquefy:{kick:T2('Ore carrier','矿砂船'),title:T2('When cargo turns to liquid','当货物变成液体'),widget:'moist',
  body:T2(`<p>Some bulk cargoes, such as iron ore fines and nickel ore, are <b>Group A</b> under the IMSBC Code. Hold too much water and the ship's rolling and engine vibration can turn them into slurry.</p><p>The limit is the <b>Transportable Moisture Limit</b> (TML), and shippers must certify the cargo is below it before loading. Watch the meter: once moisture passes the TML, the ore liquefies, slides to one side, and the ship lists and capsizes, often within minutes.</p>`,
  `<p>铁矿粉、镍矿等部分散货在《国际海运固体散装货物规则》（IMSBC）中属于 <b>A 类</b>货物。含水过多时，船舶的横摇和主机振动会把它们变成泥浆。</p><p>上限是<b>适运水分限</b>（TML），托运人必须在装货前证明货物含水率低于该值。看看水分表：一旦超过 TML，矿石液化、涌向一侧，船舶倾侧并倾覆，往往只需几分钟。</p>`),
  labels:[[T2('Open hatch · iron ore','开启的舱口 · 铁矿石'),()=>oreShip.localToWorld(V(holdX,OH.deckY+4,0)),'acc']]},
 world:{kick:T2('World map','世界地图'),title:T2('Chokepoints & piracy','咽喉要道与海盗'),world:true,
  body:T2(`<p>A handful of canals and straits carry a huge share of world trade, and they cap ship size, which is why ship classes are named after them. When one closes, ships take the long way and freight rates rise.</p><p><b>Click an amber point</b> for a chokepoint, or a <b>red zone</b> to drop into a piracy hotspot.</p>`,
  `<p>少数运河与海峡承载着很大一部分世界贸易，同时也限制了船舶尺寸，所以船型以它们命名。一旦通道受阻，船舶只能绕远路，运价随之上涨。</p><p><b>点击琥珀色圆点</b>了解咽喉要道，或点击<b>红色区域</b>进入海盗高发海域。</p>`),
  legend:T2('<span style="color:#f2a541">━</span> main lanes &nbsp; <span style="color:#7fd1ff">┅</span> the long way round','<span style="color:#f2a541">━</span> 主要航线 &nbsp; <span style="color:#7fd1ff">┅</span> 绕行路线')},
 raid:{kick:T2('Piracy','海盗'),title:T2('A raid at sea','海上袭击'),widget:'raid',tabs:[
  {t:T2('The raid','袭击'),body:T2(`<p>Pirates in fast skiffs come in from astern, where a laden ship sits lowest, hook a ladder onto the rail and climb. Slow ships with low freeboard are the easiest targets.</p>`,`<p>海盗驾驶快艇从船尾方向逼近（满载船舶在那里干舷最低），把梯子挂上船舷后攀爬上船。航速慢、干舷低的船最容易成为目标。</p>`)},
  {t:T2('The law','法律'),body:T2(`<p>In law, <b>piracy</b> (UNCLOS Art. 101) is violence or robbery for private ends on the <b>high seas</b>. The same attack inside a country's 12-nautical-mile territorial sea is "armed robbery" under that country's own law. Reports are tracked by the IMB Piracy Reporting Centre and, in Asia, ReCAAP.</p>`,
   `<p>在法律上，<b>海盗行为</b>（《联合国海洋法公约》第 101 条）是指在<b>公海</b>上为私人目的实施的暴力或抢劫。同样的袭击若发生在一国 12 海里领海之内，则按该国法律属于"武装抢劫"。相关报告由国际海事局海盗报告中心以及亚洲的 ReCAAP 追踪。</p>`)},
  {t:T2('Costs & defence','成本与防御'),body:T2(`<p>Piracy costs money even when no ship is boarded: <b>diversions</b>, extra <b>war-risk premiums</b>, kidnap & ransom cover and <b>armed guards</b>. Best Management Practices add speed, <b>razor wire</b> on the rails, <b>fire hoses</b>, and a <b>citadel</b>: a locked safe room where the crew waits for the navy.</p>`,
   `<p>即使船舶未被登船，海盗也会带来成本：<b>绕航</b>、额外的<b>战争险保费</b>、绑架与赎金保险以及<b>武装护卫</b>。《最佳管理实践》要求提高航速、在船舷布设<b>蛇腹铁丝网</b>、使用<b>消防水枪</b>，并设置<b>安全舱</b>：船员躲入其中等待海军救援的上锁避难室。</p>`),

const asPreset=n=>{const p=PRE[n],o={};for(const k in p)o[k]=CK.includes(k)?new THREE.Color(p[k]):p[k];return o;};
function lerpPreset(a,b,t){const o={};for(const k in b)o[k]=CK.includes(k)?new THREE.Color(a[k]).lerp(b[k],t):lerp(a[k],b[k],t);return o;}
function applyPreset(p){sunDir.setFromSphericalCoords(1,(90-p.el)*DEG,p.az*DEG);
  const u=sky.material.uniforms;u.turbidity.value=p.turb;u.rayleigh.value=p.ray;u.mieCoefficient.value=.005;u.mieDirectionalG.value=.82;u.sunPosition.value.copy(sunDir);
  renderer.toneMappingExposure=p.exp;sun.color.copy(p.sun);sun.intensity=p.si*Math.max(.12,clamp(p.el/8+.4));hemi.color.copy(p.hs);hemi.groundColor.copy(p.hg);hemi.intensity=p.hi;
  sea.fog.color.copy(p.fog);sea.fog.near=p.fn;sea.fog.far=p.ff;
  oceanU.uSun.value.copy(sunDir);oceanU.uSunCol.value.copy(p.sun);oceanU.uDeep.value.copy(p.deep);oceanU.uScat.value.copy(p.scat);oceanU.uSky.value.copy(p.skyR);oceanU.uHor.value.copy(p.hor);
  oceanU.uFog.value.copy(p.fog);oceanU.uFogNear.value=p.fn;oceanU.uFogFar.value=p.ff;oceanU.uAmp.value=p.amp;oceanU.uClar.value=p.clar;
  skyCloudU.uCov.value=p.cov;skyCloudU.uBright.value=p.cbr;skyCloudU.uShade.value.copy(p.csh);skyCloudU.uSunCol.value.copy(p.sun);rain.material.opacity=.45*p.rain;glowMat.opacity=p.lamp;beamMat.opacity=.22*p.lamp;cityMat.emissiveIntensity=1.2*p.lamp;Object.assign(cur,p);}

/* ================= labels & hotspots ================= */
const labelsEl=document.getElementById('labels');let LBL=[],SPOTS=[];
function setLabels(list){LBL.forEach(l=>l.el.remove());LBL=(list||[]).map(([t,fn,cls])=>{const el=document.createElement('div');el.className='lbl'+(cls?' '+cls:'');el.textContent=L_(t);labelsEl.appendChild(el);return{el,fn,t};});}
function setSpots(list){SPOTS.forEach(s=>s.el.remove());SPOTS=(list||[]).map(s=>{const el=document.createElement('button');el.type='button';el.className='hs'+(s.cls?' '+s.cls:'');
  el.innerHTML=`<span class="dot"></span><span class="txt">${L_(s.title)}${s.sub?`<small>${L_(s.sub)}</small>`:''}</span>`;el.onclick=e=>{e.stopPropagation();s.go();};labelsEl.appendChild(el);return{...s,el};});}
const tv=V(),cd=V();
function place2d(el,p,gm){let a=1;if(gm){cd.copy(camera.position).sub(p).normalize();a=clamp((p.clone().normalize().dot(cd)-.12)/.2);}
  tv.copy(p).project(camera);if(tv.z>1||Math.abs(tv.x)>1.1||Math.abs(tv.y)>1.1)a=0;el.style.opacity=a*(moving?0:1);el.style.pointerEvents=a>.5&&!moving?'auto':'none';
  if(a<=0){el.style.display='none';return null;}el.style.display='';return[(tv.x*.5+.5)*innerWidth,(-tv.y*.5+.5)*innerHeight];}
function updateOverlays(){const gm=active===globeScene;
  for(const l of LBL){const xy=place2d(l.el,l.fn(),gm);if(xy)l.el.style.transform=`translate(${xy[0].toFixed(1)}px,${(xy[1]-14).toFixed(1)}px) translate(-50%,-100%)`;}
  for(const s of SPOTS){const xy=place2d(s.el,s.pos(),gm);if(xy)s.el.style.transform=`translate(${(xy[0]-8).toFixed(1)}px,${(xy[1]-8).toFixed(1)}px)`;}}

const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);vec3 col=c.rgb;float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,1.07);
  col=mix(col,col*col*(3.-2.*col),.2);col*=vec3(1.012,1.,.985);vec2 d=vUv-.5;col*=1.-dot(d,d)*.5;float g=fract(sin(dot(vUv*vec2(1123.,871.)+fract(uTime),vec2(12.9898,78.233)))*43758.5453);col+=(g-.5)*.018;gl_FragColor=vec4(col,c.a);}`});
composer.addPass(grade);
function resize(){const W=Math.max(1,innerWidth),H=Math.max(1,innerHeight),nar=narrowQ();renderer.setSize(W,H,false);camera.aspect=W/H;
  const cw=Math.min(410,W-36)+18,ch=card.classList.contains('min')?70:H*.46;camera.setViewOffset(W,H,nar?0:-cw/2,nar?ch/2:0,W,H);camera.updateProjectionMatrix();
  composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(W,H);const db=renderer.getDrawingBufferSize(new THREE.Vector2());refrRT.setSize(Math.round(db.x*rtScale),Math.round(db.y*rtScale));oceanU.uRes.value.set(db.x,db.y);}
addEventListener('resize',()=>{resize();if(!isFinite(camera.position.x)){const P=PLACES[topicKey];camera.position.copy(fit(V(...P.cam),V(...P.tgt)));controls.target.set(...P.tgt);}});
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;updateFlight(now);
  if(active===sea){
    if(presetT<1){presetT=Math.min(1,presetT+dt/(fly?fly.dur/1000:1.2));applyPreset(lerpPreset(presetFrom,presetTo,ease(presetT)));}
    drift+=(targetDrift-drift)*dt*.8;oceanU.uDrift.value+=drift*dt;oceanU.uTime.value=t;
    skyClouds.position.x=camera.position.x;skyClouds.position.z=camera.position.z;skyCloudU.uTime.value=t;ocean.position.x=Math.round(camera.position.x/40)*40;ocean.position.z=Math.round(camera.position.z/40)*40;
    fTug.x=ANCH.x+140*Math.cos(t*.03);fTug.z=ANCH.z+140*Math.sin(t*.03);fTug.yaw=-t*.03-Math.PI/2;
    for(const f of floaters)updateFloat(f,t);
    for(const f of wakes){const o=f.obj,off=o.userData.L/2+f.wake.len/2-6;f.wake.m.position.set(o.position.x-Math.cos(f.yaw)*off,.4,o.position.z+Math.sin(f.yaw)*off);f.wake.m.rotation.y=f.yaw;f.wake.m.visible=drift>1;}
    trucks.forEach(tr=>tr.g.position.set(lerp(-500,500,(t*.012+tr.o)%1),0,-74));
    SCANNERS.forEach(s=>s.rotation.y=t*2.2);lhBeam.rotation.y=t*.8;
    craneLoop(t);updateLiquefaction(t,dt);updateRaid(t,dt);updateRain();
    if(cur.rain>.5){if(Math.random()<.004)flash=1;flash*=.86;hemi.intensity=cur.hi+flash*3;}
    const sc=isNaN(shadowC.x)?controls.target:shadowC;sun.position.copy(sc).addScaledVector(sunDir,900);sun.target.position.copy(sc);sun.target.updateMatrixWorld();
  }else{cloudMesh.rotation.y=-Math.PI/2+t*.004;zoneRings.forEach((r,i)=>r.material.opacity=.5+.5*Math.sin(t*3+i));oceanU.uTime.value=t;}
  controls.update();updateOverlays();
  if(active===sea){renderer.shadowMap.needsUpdate=true;camera.layers.set(0);renderer.setClearColor(oceanU.uDeep.value,1);renderer.setRenderTarget(refrRT);renderer.clear();renderer.render(sea,camera);
    renderer.setRenderTarget(null);camera.layers.enableAll();renderPass.scene=sea;if(gtao){gtao.enabled=true;gtao.scene=sea;aoCam.copy(camera);aoCam.layers.set(0);aoCam.updateMatrixWorld();}grade.uniforms.uTime.value=t;composer.render(dt);}
  else{camera.layers.enableAll();renderPass.scene=globeScene;if(gtao)gtao.enabled=false;composer.render(dt);}
  requestAnimationFrame(frame);}

/* ================= start ================= */
applyPreset(asPreset('day'));resize();applyLang();
const h0=location.hash.slice(1);openTopic(TOPICS[h0]&&h0!=='raid'?h0:'hub',true);refreshEnv();
requestAnimationFrame(t=>{last=t;frame(t);setTimeout(()=>{$('loading').classList.add('done');setTimeout(()=>$('loading').remove(),700);},300);});
window.__ship={open:openTopic,raid:k=>openRaid(ZONES.find(z=>z.key===k)||ZONES[0]),state:()=>({topicKey,liqT,raidT}),setLiq:v=>{liqT=v;},setRaid:v=>{raidT=v;}};
</script>
