<main class="wrap">
  <div class="page-head">
    <div class="eyebrow" data-zh="摄影">Photography</div>
    <h1 data-zh="摄影">Photography</h1>
    <p id="intro"></p>
  </div>
  <div class="gallery" id="gallery"></div>
  <div class="empty" id="empty" hidden><span data-zh="照片即将上线。">Photos coming soon.</span></div>
  <footer>
    <span data-zh="© 2026 巨龙飞">© 2026 Longfei Ju</span>
    <span data-zh="新加坡">Singapore</span>
  </footer>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-top"><button type="button" id="lb-close" data-zh="关闭 ✕">Close ✕</button></div>
  <div class="lb-stage">
    <button type="button" class="nav-b" id="lb-prev" aria-label="Previous photo">←</button>
    <img id="lb-img" alt="">
    <button type="button" class="nav-b" id="lb-next" aria-label="Next photo">→</button>
  </div>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script src="site.js"></script>
<script>
(function () {
  var T = site.T, esc = site.esc, list = [], cur = 0, lastFocus = null;
  var lb = document.getElementById('lb'), img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap');
  function pick(o) { o = o || {}; return site.lang() === 'zh' ? (o.zh || o.en || '') : (o.en || ''); }
  function caption(p) { var a = pick(p.caption), b = pick(p.location); return (a ? '<b>' + esc(a) + '</b>' : '') + (a && b ? ' · ' : '') + esc(b); }
  function show(i) { cur = (i + list.length) % list.length; var p = list[cur]; img.src = p.image; img.alt = pick(p.caption) || pick(p.location) || 'Photo'; cap.innerHTML = caption(p); }
  function open(i) { lastFocus = document.activeElement; show(i); lb.hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('lb-close').focus(); }
  function close() { lb.hidden = true; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
  document.getElementById('lb-close').onclick = close;
  document.getElementById('lb-prev').onclick = function () { show(cur - 1); };
  document.getElementById('lb-next').onclick = function () { show(cur + 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('lb-stage')) close(); });
  document.addEventListener('keydown', function (e) { if (lb.hidden) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
  site.onLang(function () { if (!lb.hidden) show(cur); });
  site.load('content/photos.json').then(function (d) {
    var el = document.getElementById('intro'); if (site.has(d.intro)) el.outerHTML = T(d.intro, 'p', 'id="intro"');
    list = (d.photos || []).filter(function (p) { return p && p.image; });
    if (!list.length) { document.getElementById('empty').hidden = false; site.scan(); return; }
    document.getElementById('gallery').innerHTML = list.map(function (p, i) {
      var c = site.has(p.caption) ? T(p.caption, 'b') : '', l = site.has(p.location) ? T(p.location, 'span') : '';
      return '<button type="button" class="ph" data-i="' + i + '"><figure style="margin:0"><img src="' + esc(p.image) + '" alt="' + esc((p.caption && p.caption.en) || (p.location && p.location.en) || 'Photo') + '" loading="lazy" decoding="async">'
        + (c || l ? '<figcaption>' + c + l + '</figcaption>' : '') + '</figure></button>';
    }).join('');
    document.querySelectorAll('.ph').forEach(function (b) { b.onclick = function () { open(+b.dataset.i); }; });
    site.scan();
  }).catch(function () { document.getElementById('empty').hidden = false; site.scan(); });
})();
</script>
</body>
</html>
